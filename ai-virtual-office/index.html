<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><title>AI Virtual Office LIVE</title><style>
:root{--bg:#07111f;--p:#0d1b2b;--p2:#10243a;--line:#253b52;--t:#eef7ff;--m:#8da5bd;--c:#3be7ff;--g:#55e5a4;--y:#ffd166;--r:#ff7582;--v:#b58cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#123d6655,transparent 35%),var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}button{font:inherit;cursor:pointer}.app{max-width:1500px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:10;background:#07111fdd;backdrop-filter:blur(15px);border-bottom:1px solid #1c3044}.topin{max-width:1500px;margin:auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,var(--c),#6788ff);color:#04101a;font-weight:1000}.brand b{display:block}.brand small,.muted{color:var(--m);font-size:11px}.live{display:inline-flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;border:1px solid #2d6b54;background:#0b291f;color:#7df1bb;font-size:10px;font-weight:900}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor}.nav{display:flex;gap:6px;overflow:auto;padding:12px 0}.nav button{border:1px solid var(--line);background:#0a1726;color:var(--m);padding:8px 11px;border-radius:10px;white-space:nowrap}.nav button.on{color:white;border-color:#3e6c91;background:#122b43}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.card,.metric{border:1px solid var(--line);background:linear-gradient(145deg,#0d1c2e,#091625);border-radius:15px;padding:13px}.metric label{display:block;color:var(--m);font-size:10px}.metric strong{font-size:22px;display:block;margin-top:4px}.section{display:flex;justify-content:space-between;align-items:end;margin:18px 0 10px}.section h2{font-size:15px;margin:0}.section p{margin:3px 0 0;color:var(--m);font-size:10px}.schedule{display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:8px;overflow:auto}.slot{border:1px solid var(--line);border-radius:12px;background:#0a1726;padding:10px;min-height:82px}.slot strong{font-size:17px}.slot b{display:block;font-size:10px;margin:4px 0}.slot small{color:var(--m);font-size:9px}.slot.next{border-color:#4581ad}.slot.run{border-color:#35785f;background:#0c211a}.office{display:grid;grid-template-columns:repeat(12,1fr);gap:9px;min-width:980px}.officewrap{overflow:auto}.dept{grid-column:span 4;border:1px solid var(--line);border-radius:14px;background:#0b1929;padding:10px}.dept h3{font-size:11px;margin:0 0 8px;display:flex;justify-content:space-between}.dept h3 span{color:var(--m);font-weight:400}.staff{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.emp{border:1px solid #29425a;background:#0a1726;border-radius:10px;padding:8px;text-align:left;color:white;min-height:72px}.emp:hover{border-color:#4f7ba1}.emp b{font-size:9px;display:block}.emp small{color:var(--m);font-size:8px;display:block;margin-top:2px}.st{font-size:8px;margin-top:7px}.idle{color:#75879a}.research{color:var(--c)}.meeting{color:var(--v)}.done{color:var(--g)}.review{color:var(--y)}.meetinggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.committee h3{font-size:13px;margin:0 0 4px}.committee p{font-size:10px;color:#b7cadb;line-height:1.6}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:8px;border:1px solid #31506e;border-radius:99px;padding:3px 6px;color:#bad2e5}.items{display:grid;gap:7px;margin-top:10px}.item{border:1px solid #21384f;border-radius:10px;padding:9px;background:#091625}.item b{font-size:10px}.item p{margin:4px 0;color:var(--m);font-size:9px;line-height:1.5}.item .rank{color:var(--c);margin-right:5px}.tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.source{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #1e3145;padding:9px 0;font-size:10px}.ok{color:var(--g)}.bad{color:var(--r)}.btn{border:1px solid #365675;background:#10243a;color:white;border-radius:10px;padding:8px 11px}.btn.primary{border:0;background:linear-gradient(135deg,var(--c),#6788ff);color:#06111d;font-weight:900}.hero{border:1px solid #28465f;background:radial-gradient(circle at 85% 10%,#3be7ff18,transparent 32%),#0c1a2b;border-radius:16px;padding:15px}.hero h2{font-size:16px;margin:0 0 8px}.hero p{font-size:10px;line-height:1.6;color:#b7cadb}.modalbg{position:fixed;inset:0;background:#02060bc7;display:grid;place-items:center;padding:15px;z-index:50}.modal{width:min(620px,100%);max-height:86vh;overflow:auto;background:#0d1b2b;border:1px solid #35526e;border-radius:16px;padding:16px}.modal h2{font-size:16px}.modal p{font-size:10px;color:#b6c9db;line-height:1.65}.modal .close{float:right}.copy{white-space:pre-wrap;border:1px dashed #3b5f7d;background:#081624;border-radius:10px;padding:10px;font-size:10px;color:#bed3e5}.statusbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.statusbar small{color:var(--m)}@media(max-width:850px){.grid4{grid-template-columns:repeat(2,1fr)}.meetinggrid,.tasks{grid-template-columns:1fr}.app{padding:12px}.topin{padding:10px 12px}.brand small{display:none}.schedule{grid-template-columns:repeat(5,165px)}}
</style></head><body><div class="top"><div class="topin"><div class="brand"><div class="logo">AI</div><div><b>AI Virtual Office LIVE</b><small>Operational Investment Company</small></div></div><div style="display:flex;gap:8px;align-items:center"><span class="live"><span class="dot"></span>LIVE DATA</span><button class="btn" id="sync">↻ 同期</button></div></div></div><main class="app"><div id="root">同期中...</div></main><div id="modal"></div><script>
const P={agents:'../investment-company/organization/agents.json',committee:'../investment-company/committee/dashboard-latest.json',market:'../investment-company/market-intelligence/latest.json',holdings:'../stock-dashboard/data/holdings.json'};let D={},S={},tab='office',sel=null;const deptIcon={'経営企画・人材開発室':'◇','市場情報部':'◉','テーマ・ニュースリサーチ部':'✦','ファンダメンタル調査部':'△','戦術・テクニカル・執行部':'⌁','リスク管理部':'⚠','レッドチーム':'◆','バックオフィス':'▣'};const sched=[['marketIntelligence','07:30','市場情報部レポート',[1,2,3,4,5],25],['daytrade','08:00','デイトレ投資委員会',[1,2,3,4,5],18],['swing','08:15','スイング投資委員会',[1,2,3,4,5],20],['longterm','08:30','中長期投資委員会',[1],45],['holdings','09:00–17:00','保有株評価損益',[1,2,3,4,5],480]];const esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));const arr=v=>Array.isArray(v)?v:[];function jst(){let x={};new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Tokyo',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()).forEach(p=>x[p.type]=p.value);return {day:{Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6}[x.weekday],m:(+x.hour%24)*60+(+x.minute)}}function running(){let p=jst(),run=null,next=null,best=9999;sched.forEach(s=>{if(!s[3].includes(p.day))return;let st=s[1].includes('–')?540:(+s[1].slice(0,2))*60+(+s[1].slice(3,5)),en=st+s[4];if(p.m>=st&&p.m<=en)run=s;else if(st>p.m&&st-p.m<best){best=st-p.m;next=s}});return{run,next}}function fmt(v){if(!v)return'未取得';let s=String(v).replace(' JST','T00:00:00+09:00'),d=new Date(s);return isNaN(d)?v:new Intl.DateTimeFormat('ja-JP',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(d)}async function sync(){await Promise.all(Object.entries(P).map(async([k,u])=>{try{let r=await fetch(u+'?_='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);D[k]=await r.json();S[k]=true}catch(e){S[k]=false}}));render()}function status(a){let r=running().run,A=D.agents?.committeeAssignments||{};if(r&&arr(A[r[0]]).includes(a.id))return r[0]==='marketIntelligence'?'research':'meeting';let c=D.committee?.committees||{},today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo'}).format(new Date()),m=[['daytrade',c.day?.asOf],['swing',c.swing?.asOf],['longterm',c.medium?.asOf]];for(let [k,d]of m)if(arr(A[k]).includes(a.id)&&String(d||'').startsWith(today))return k==='longterm'?'review':'done';return'idle'}function hcount(){let h=D.holdings;if(Array.isArray(h))return h.length;for(let k of['holdings','positions','items','data'])if(Array.isArray(h?.[k]))return h[k].length;return 0}function nav(){return`<div class="nav">${[['office','オフィス'],['committee','委員会'],['tasks','タスク'],['system','システム']].map(x=>`<button data-tab="${x[0]}" class="${tab===x[0]?'on':''}">${x[1]}</button>`).join('')}</div>`}function metrics(){let a=D.agents?.agents||[],active=a.filter(x=>['research','meeting','review'].includes(status(x))).length,c=D.committee?.committees||{},latest=[c.day?.asOf,c.swing?.asOf,c.medium?.asOf].filter(Boolean).sort().pop();return`<div class="grid4"><div class="metric"><label>現在稼働中</label><strong>${active}<small> / ${D.agents?.headcount||34}</small></strong></div><div class="metric"><label>AI社員</label><strong>${D.agents?.headcount||34}</strong><small>${arr(D.agents?.departments).length||8}部署</small></div><div class="metric"><label>最新委員会</label><strong style="font-size:15px">${fmt(latest)}</strong></div><div class="metric"><label>保有データ</label><strong>${hcount()}</strong><small>GitHub正本</small></div></div>`}function schedule(){let r=running();return`<div class="section"><div><h2>Automation Line</h2><p>実際に設定済みの自動タスク</p></div></div><div class="schedule">${sched.map(s=>`<div class="slot ${r.run?.[0]===s[0]?'run':r.next?.[0]===s[0]?'next':''}"><strong>${s[1]}</strong><b>${s[2]}</b><small>${r.run?.[0]===s[0]?'● 稼働時間帯':r.next?.[0]===s[0]?'次の実行':'自動実行'}</small></div>`).join('')}</div>`}function office(){let by={};arr(D.agents?.agents).forEach(a=>(by[a.department]??=[]).push(a));return metrics()+schedule()+`<div class="section"><div><h2>Live Office Floor</h2><p>organization/agents.json を正本に34名を表示</p></div></div><div class="officewrap"><div class="office">${Object.entries(by).map(([d,aa])=>`<section class="dept"><h3>${deptIcon[d]||'◌'} ${esc(d)}<span>${aa.length}名</span></h3><div class="staff">${aa.map(a=>`<button class="emp" data-agent="${a.id}"><b>No.${a.id} ${esc(a.title)}</b><small>${esc(a.mission)}</small><div class="st ${status(a)}">● ${{idle:'待機中',research:'調査中',meeting:'会議中',done:'完了',review:'レビュー中'}[status(a)]}</div></button>`).join('')}</div></section>`).join('')}<section class="dept"><h3>◌ EXECUTIVE ROOM<span>Human CEO</span></h3><div class="hero"><b>AI提言 → 議長統合 → CEO最終決裁</b><p>${esc(D.committee?.marketSnapshot?.headline||'最新市場スナップショット待機中')}</p></div></section></div></div>`}function ccard(k){let c=D.committee?.committees||{},x=k==='day'?c.day:k==='swing'?c.swing:c.medium;if(!x)return`<div class="card committee"><h3>未取得</h3></div>`;return`<div class="card committee"><h3>${esc(x.title)}</h3><div class="chips"><span class="chip">${fmt(x.asOf)}</span></div><p>${esc(x.conclusion)}</p><div class="items">${arr(x.items).slice(0,5).map(i=>`<div class="item"><b><span class="rank">#${i.rank}</span>${esc(i.code)} ${esc(i.name)} · ${esc(i.grade)}</b><p>${esc(i.whyNow||i.summary)}</p></div>`).join('')}</div></div>`}function committees(){return`<div class="hero"><h2>${esc(D.committee?.marketSnapshot?.headline||'Market Snapshot')}</h2>${arr(D.committee?.marketSnapshot?.points).map(x=>`<p>・${esc(x)}</p>`).join('')}</div><div class="section"><div><h2>Executive Committees</h2><p>最新の実出力</p></div></div><div class="meetinggrid">${ccard('day')}${ccard('swing')}${ccard('medium')}</div>`}function tasks(){let c=D.committee?.committees||{};return`<div class="section"><div><h2>Operational Task Board</h2><p>委員会候補を実タスクとして表示</p></div><button class="btn primary" id="req">＋ CEO依頼文</button></div><div class="tasks">${[['DAY',c.day],['SWING',c.swing],['LONG',c.medium]].map(([n,x])=>`<div class="card"><h3 style="font-size:12px">${n} <span class="muted">${fmt(x?.asOf)}</span></h3><div class="items">${arr(x?.items).map(i=>`<div class="item"><b><span class="rank">#${i.rank}</span>${esc(i.code)} ${esc(i.name)}</b><p><strong>WHY:</strong> ${esc(i.whyNow||i.summary)}<br><strong>条件:</strong> ${esc(i.condition)}<br><strong>リスク:</strong> ${esc(i.risk)}</p></div>`).join('')||'<p class="muted">未取得</p>'}</div></div>`).join('')}</div>`}function system(){return`<div class="section"><div><h2>LIVE Architecture</h2><p>ChatGPT自動タスク → GitHub → この画面</p></div></div><div class="grid4">${Object.entries(P).map(([k,u])=>`<div class="card"><b style="font-size:11px">${k}</b><p class="muted" style="word-break:break-all">${u}</p><span class="${S[k]?'ok':'bad'}">● ${S[k]?'接続':'未取得'}</span></div>`).join('')}</div><div class="section"><div><h2>運用原則</h2></div></div><div class="card"><p class="muted" style="line-height:1.8">AIは調査・分析・反証・執行設計を行いますが、証券発注は行いません。取得不能な数値を推測で埋めず、最終決裁はHuman CEOが行います。ブラウザにはAPIキーを保存しません。</p></div>`}function render(){let ok=Object.values(S).filter(Boolean).length;document.getElementById('root').innerHTML=`<div class="statusbar"><span class="live"><span class="dot"></span>${ok?`LIVE ${ok}/${Object.keys(P).length}`:'SYNCING'}</span><small>60秒ごとに自動更新</small></div>${nav()}${tab==='office'?office():tab==='committee'?committees():tab==='tasks'?tasks():system()}`;bind()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>showAgent(+b.dataset.agent));let q=document.getElementById('req');if(q)q.onclick=request}function showAgent(id){let a=arr(D.agents?.agents).find(x=>x.id===id),A=D.agents?.committeeAssignments||{};if(!a)return;let cs=Object.entries(A).filter(([,ids])=>arr(ids).includes(id)).map(([k])=>k).join(' / ');modal(`<button class="btn close" id="x">閉じる</button><h2>No.${a.id} ${esc(a.title)}</h2><p>${esc(a.department)}</p><div class="hero"><p>${esc(a.mission)}</p></div><p><b>参加:</b> ${esc(cs||'個別稼働')}</p><p><b>現在:</b> ${{idle:'待機中',research:'調査中',meeting:'会議中',done:'完了',review:'レビュー中'}[status(a)]}</p>`)}function request(){let t=prompt('CEO依頼タイトル');if(!t)return;let body=prompt('依頼内容');if(!body)return;let text=`AI Virtual Office CEO依頼\n依頼: ${t}\n${body}\n\n既存のinvestment-company運用に沿い、必要なAI社員を起動して調査・反証・統合してください。事実と推測を分離し、GitHubへ反映できる形でまとめてください。最終決裁はHuman CEOが行います。`;navigator.clipboard?.writeText(text).then(()=>alert('ChatGPTへ貼り付ける依頼文をコピーしました')).catch(()=>modal(`<h2>依頼文</h2><div class="copy">${esc(text)}</div>`))}function modal(h){document.getElementById('modal').innerHTML=`<div class="modalbg" id="bg"><div class="modal">${h}</div></div>`;document.getElementById('x')?.addEventListener('click',()=>document.getElementById('modal').innerHTML='');document.getElementById('bg').onclick=e=>{if(e.target.id==='bg')document.getElementById('modal').innerHTML=''}}document.getElementById('sync').onclick=sync;sync();setInterval(sync,60000);
</script></body></html>
