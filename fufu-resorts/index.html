<style>

.side{padding:15px}.side h2{font-size:14px;margin:0 0 3px}.side p{font-size:10px;color:var(--muted);margin:0 0 11px}.areas{display:grid;gap:6px}.areaBtn{border:1px solid var(--line);border-radius:10px;background:#fff;padding:8px 9px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}.areaBtn b{font-size:10px}.areaBtn span{font-size:9px;color:var(--muted)}

<body>
<header class="top"><div class="wrap toprow"><div class="brand">ふふ MAP <small>12 SMALL LUXURY RESORTS</small></div><nav class="modes"><a id="mapMode" class="active" href="#map">MAP</a><a id="compareMode" href="#compare">比較</a></nav></div></header>

<main class="wrap" id="mapView">
<section class="hero"><div class="eyebrow">CHOOSE BY PLACE</div><h1>日本地図から、<br>次の「ふふ」を選ぶ。</h1><p>宿名の吹き出しをタップすると、詳細ビューが開きます。地理的な距離感で選んだ後は、比較モードで最大3施設を横並びにできます。</p></section>
<section class="mapGrid"><div class="mapCard"><div class="mapHead"><b>全12施設</b><span>宿名＝詳細 / ピン＝選択</span></div><div id="map"></div></div><aside class="side"><h2>エリアからフォーカス</h2><p>近い施設だけをまとめて見たいときに。</p><div class="areas" id="areas"></div></aside></section>
</main>

<main class="wrap compareView" id="compareView">
<section class="hero"><div class="eyebrow">COMPARE</div><h1>気になる「ふふ」を、<br>横並びで比較。</h1><p>最大3施設。価格・特徴・温泉・利用目的・所在地を比べられます。</p><div class="sel" id="sel"></div></section>
<div class="pickGrid" id="pickGrid"></div><div class="tableWrap" id="tableWrap"></div>
</main>

(() => {
 const mapView=document.getElementById('mapView'),compareView=document.getElementById('compareView'),mapMode=document.getElementById('mapMode'),compareMode=document.getElementById('compareMode'),detail=document.getElementById('detail'),detailBody=document.getElementById('detailBody'),selected=new Set();

 H.forEach(h=>{const icon=L.divIcon({className:'',html:'<div class="fufu-dot"></div>',iconSize:[15,15],iconAnchor:[7,7]}),m=L.marker([h.lat,h.lng],{icon,title:h.n}).addTo(map);markers.set(h.id,m);bounds.push([h.lat,h.lng]);m.bindTooltip(`<a href="#hotel=${h.id}">${h.n}</a>`,{permanent:true,direction:h.dir==='left'?'left':'right',offset:h.dir==='left'?[-8,0]:[8,0],className:'fufu-label',interactive:true,opacity:1});m.on('click',()=>openHotel(h.id))});
 map.fitBounds(bounds,{padding:[28,28],maxZoom:6});
 const groups={};H.forEach(h=>(groups[h.a]??=[]).push(h));const areas=document.getElementById('areas');Object.entries(groups).forEach(([a,items])=>{const b=document.createElement('button');b.type='button';b.className='areaBtn';b.innerHTML=`<b>${a}</b><span>${items.length}施設</span>`;b.addEventListener('click',()=>{items.length===1?(map.setView([items[0].lat,items[0].lng],9),markers.get(items[0].id).openTooltip()):map.fitBounds(items.map(x=>[x.lat,x.lng]),{padding:[55,55],maxZoom:9});document.getElementById('map').scrollIntoView({behavior:'smooth',block:'center'})});areas.appendChild(b)});
 function renderCompare(){const grid=document.getElementById('pickGrid'),sel=document.getElementById('sel'),wrap=document.getElementById('tableWrap');grid.innerHTML=H.map(h=>`<button class="pick ${selected.has(h.id)?'on':''}" data-id="${h.id}" ${!selected.has(h.id)&&selected.size>=3?'disabled':''}><b>${selected.has(h.id)?'✓ ':''}${h.n}</b><span>${h.a} · ${yen(h.avg)}前後</span></button>`).join('');sel.textContent=`${selected.size} / 3施設を選択中`;grid.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{const id=b.dataset.id;selected.has(id)?selected.delete(id):selected.size<3&&selected.add(id);renderCompare()}));const hs=[...selected].map(id=>H.find(h=>h.id===id)).filter(Boolean);if(!hs.length){wrap.innerHTML='<div class="empty">上の施設をタップすると比較表が表示されます。</div>';return}const row=(l,fn)=>`<tr><th>${l}</th>${hs.map(h=>`<td>${fn(h)}</td>`).join('')}</tr>`;wrap.innerHTML=`<table><tr><th>比較項目</th>${hs.map(h=>`<td><div class="hotelHead">${h.n}</div><small>${h.a}</small></td>`).join('')}</tr>${row('2名1泊 参考最安',h=>`<b>${yen(h.min)}</b>`)}${row('月別最安値平均',h=>`<b>${yen(h.avg)}</b>`)}${row('特徴',h=>h.d.join('<br><br>'))}${row('キーワード',h=>h.f.map(x=>`<span class="tag">${x}</span>`).join(''))}${row('向いている利用',h=>h.aud.map(x=>`<span class="tag">${x}</span>`).join(''))}${row('温泉',h=>h.on?'あり':'要確認')}${row('客室温泉',h=>h.ro?'あり':'客室タイプ要確認')}${row('所在地',h=>h.ad)}${row('詳細',h=>`<a class="deepLink" href="#hotel=${h.id}">深掘り</a>`)}${row('公式',h=>`<a class="officialLink" href="${h.u}" target="_blank" rel="noopener noreferrer">公式サイト ↗</a>`)}</table>`}
 function route(){const hash=location.hash||'#map';const comp=hash==='#compare';mapView.style.display=comp?'none':'block';compareView.classList.toggle('show',comp);mapMode.classList.toggle('active',!comp);compareMode.classList.toggle('active',comp);if(hash.startsWith('#hotel=')){mapView.style.display='block';compareView.classList.remove('show');mapMode.classList.add('active');compareMode.classList.remove('active');openHotel(hash.split('=')[1],false)}else if(detail.classList.contains('open'))closeHotel();if(comp)renderCompare();setTimeout(()=>map.invalidateSize(),0)}
 window.addEventListener('hashchange',route);document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#hotel="]');if(a){e.preventDefault();location.hash=a.getAttribute('href')}});renderCompare();route();
})();
</script>
