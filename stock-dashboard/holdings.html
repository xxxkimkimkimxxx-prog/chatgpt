<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>HOLDINGS | 日本株ダッシュボード</title><style>
:root{--bg:#07101d;--p:#0d1828;--p2:#111f32;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}button{font:inherit}.w{width:min(1080px,calc(100% - 20px));margin:auto}.hero{margin-top:14px;background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(77,222,155,.07));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}.muted{color:var(--m)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.nav button,.links a{border:1px solid var(--line);background:var(--p);color:var(--t);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.kpi{background:#0a1525;border:1px solid var(--line);border-radius:15px;padding:12px}.kpi span{display:block;font-size:10px;color:var(--m)}.kpi b{display:block;font-size:20px;margin-top:3px}.pos{color:var(--g)}.neg{color:var(--r)}main{padding:12px 0 40px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}.name{font-size:18px;font-weight:950}.code{font-size:10px;color:var(--m)}.market{margin:13px 0 9px;padding:10px;background:#091524;border:1px solid var(--line);border-radius:14px;overflow:hidden}.marketHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:7px}.marketHead span:first-child{font-size:10px;color:var(--m)}.auto{font-size:9px;font-weight:950;color:var(--c);border:1px solid rgba(83,211,255,.35);border-radius:999px;padding:3px 7px}.quoteSlot{min-height:76px;border-radius:10px;overflow:hidden}.saved{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:9px 11px;margin-bottom:9px;background:#0d1a2b;border:1px dashed #2a3c56;border-radius:12px}.saved span{display:block;font-size:9px;color:var(--m)}.saved b{font-size:14px}.pnl{text-align:right;font-weight:950}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#101e31;border-radius:11px;padding:9px}.box span{display:block;font-size:9px;color:var(--m)}.box b{font-size:12px}.mgmt{font-size:11px;margin-top:10px;border-top:1px dashed #2a3c56;padding-top:10px}.mgmt strong{color:var(--c)}.links{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.links a{display:inline-block}.chart{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#091524;min-height:340px}.chart iframe{width:100%;height:340px;border:0;display:block}.note{margin-top:12px;border-left:3px solid var(--y);background:#25200f;padding:10px 11px;border-radius:9px;font-size:11px;color:#f4e9be}.empty{padding:30px;text-align:center;color:var(--m);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.top{display:block}.nav{margin-top:10px}.chart,.chart iframe{min-height:300px;height:300px}}
</style></head><body><header class="w"><section class="hero"><div class="top"><div><div class="ey">HOLDINGS · AUTO MARKET QUOTE</div><h1>保有銘柄</h1><div id="asof" class="muted">読み込み中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="latest.html">LATEST</a><button id="reloadBtn" type="button">再読込</button></div></div><div class="kpis"><div class="kpi"><span>保有銘柄</span><b id="count">—</b></div><div class="kpi"><span>取得総額</span><b id="cost">—</b></div><div class="kpi"><span>前回保存時評価額</span><b id="value">—</b></div><div class="kpi"><span>前回保存時含み損益</span><b id="total">—</b></div></div></section></header><main class="w"><div id="grid" class="grid"></div><div class="note">カード最上部の「市場価格」はTradingViewの市場データをページ内で自動更新します。外部ページを開く必要はありません。取引所・データ提供条件によって遅延する場合があるため、発注時の最終確認だけはiSPEEDの現在値・板を正としてください。平均取得・数量・保存時損益は holdings.json の保有データです。</div></main><script>
function y(n){return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tvChartUrl(code){const sym='TSE%3A'+encodeURIComponent(code);return 'https://s.tradingview.com/widgetembed/?frameElementId=tv_'+encodeURIComponent(code)+'&symbol='+sym+'&interval=5&hidesidetoolbar=1&symboledit=0&saveimage=0&toolbarbg=f1f3f6&studies=%5B%5D&theme=dark&style=1&timezone=Asia%2FTokyo&withdateranges=1&hideideas=1'}
function mountQuote(slot,code){slot.innerHTML='<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div>';const wrap=slot.firstElementChild;const s=document.createElement('script');s.type='text/javascript';s.src='https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';s.async=true;s.text=JSON.stringify({symbol:'TSE:'+code,width:'100%',isTransparent:true,colorTheme:'dark',locale:'ja'});wrap.appendChild(s)}
async function load(){const g=document.getElementById('grid');g.innerHTML='<div class="empty">読み込み中…</div>';try{const r=await fetch('data/holdings.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const ps=d.positions||[];document.getElementById('asof').textContent=`保有データ: ${d.asOf||'—'} / 市場価格はカード内で自動更新`;document.getElementById('count').textContent=ps.length+'銘柄';let c=0,v=0;ps.forEach(p=>{c+=(+p.quantity||0)*(+p.averageCost||0);v+=(+p.quantity||0)*(+p.referencePrice||0)});document.getElementById('cost').textContent=y(c);document.getElementById('value').textContent=y(v);const tp=Number(d.totalUnrealizedPnl??(v-c));const t=document.getElementById('total');t.textContent=(tp>=0?'+':'')+y(tp);t.className=tp>=0?'pos':'neg';g.innerHTML=ps.map(p=>{const pc=(+p.quantity||0)*(+p.averageCost||0),pv=(+p.quantity||0)*(+p.referencePrice||0),pn=Number(p.unrealizedPnl??(pv-pc));return `<article class="card"><div class="name">${esc(p.name)}</div><div class="code">${esc(p.code)} · ${Number(p.quantity||0).toLocaleString()}株 · 平均取得 ${y(p.averageCost)}</div><div class="market"><div class="marketHead"><span>市場価格・前日比</span><span class="auto">AUTO UPDATE</span></div><div id="quote-${esc(p.code)}" class="quoteSlot"></div></div><div class="saved"><div><span>前回保存値</span><b>${y(p.referencePrice)}</b></div><div class="pnl ${pn>=0?'pos':'neg'}">${pn>=0?'+':''}${y(pn)}<div class="muted" style="font-size:9px">保存時含み損益</div></div></div><div class="mini"><div class="box"><span>平均取得</span><b>${y(p.averageCost)}</b></div><div class="box"><span>取得総額</span><b>${y(pc)}</b></div><div class="box"><span>前回評価額</span><b>${y(pv)}</b></div><div class="box"><span>保有データ時刻</span><b>${esc(d.asOf||'—')}</b></div></div><div class="chart"><iframe title="${esc(p.name)} 5分足" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${tvChartUrl(p.code)}"></iframe></div><div class="mgmt"><strong>管理方針：</strong>${esc(p.management||'—')}</div></article>`}).join('')||'<div class="empty">保有銘柄なし</div>';ps.forEach(p=>{const slot=document.getElementById('quote-'+p.code);if(slot)mountQuote(slot,p.code)})}catch(e){g.innerHTML=`<div class="empty">読込失敗：${esc(e.message)}</div>`}}
document.getElementById('reloadBtn').addEventListener('click',load);load();
</script></body></html>
