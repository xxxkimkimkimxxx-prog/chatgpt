<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>HOLDINGS | 日本株ダッシュボード</title>
<style>
:root{--bg:#07101d;--p:#0d1828;--p2:#111f32;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}button,textarea{font:inherit}.w{width:min(1180px,calc(100% - 20px));margin:auto}.hero{margin-top:14px;background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(77,222,155,.07));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}.muted{color:var(--m)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.nav button,.marketlinks a{border:1px solid var(--line);background:var(--p);color:var(--t);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.kpi{background:#0a1525;border:1px solid var(--line);border-radius:15px;padding:12px}.kpi span{display:block;font-size:10px;color:var(--m)}.kpi b{display:block;font-size:20px;margin-top:3px}.pos{color:var(--g)}.neg{color:var(--r)}main{padding:12px 0 40px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px}.name{font-size:18px;font-weight:950}.code{font-size:10px;color:var(--m)}.price{display:flex;justify-content:space-between;align-items:end;margin:13px 0;padding:12px;background:#091524;border:1px solid var(--line);border-radius:14px}.price b{font-size:25px}.pnl{text-align:right;font-weight:950}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#101e31;border-radius:11px;padding:9px}.box span{display:block;font-size:9px;color:var(--m)}.box b{font-size:12px}.mgmt{font-size:11px;margin-top:10px;border-top:1px dashed #2a3c56;padding-top:10px}.mgmt strong{color:var(--c)}.marketlinks{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.marketlinks a.live{border-color:rgba(77,222,155,.5);color:#9af3c8}.marketlinks a.chartlink{border-color:rgba(83,211,255,.5);color:#9fe9ff}.chartwrap{margin-top:10px;border:1px solid var(--line);background:#08121f;border-radius:14px;overflow:hidden}.charthead{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:10px}.charthead strong{color:var(--c)}.tvchart{width:100%;height:330px;border:0;display:block;background:#08121f}textarea{width:100%;margin-top:8px;background:#091524;border:1px solid var(--line);border-radius:10px;color:var(--t);padding:9px;min-height:65px}.note{margin-top:12px;border-left:3px solid var(--y);background:#25200f;padding:10px 11px;border-radius:9px;font-size:10px;color:#f4e9be}.empty{padding:30px;text-align:center;color:var(--m);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.top{display:block}.nav{margin-top:10px}.tvchart{height:300px}}
</style>
</head>
<body>
<header class="w"><section class="hero"><div class="top"><div><div class="ey">HOLDINGS · LIVE MARKET VIEW</div><h1>保有銘柄</h1><div id="asof" class="muted">読み込み中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="latest.html">LATEST</a><button onclick="load()">再読込</button></div></div><div class="kpis"><div class="kpi"><span>保有銘柄</span><b id="count">—</b></div><div class="kpi"><span>取得総額</span><b id="cost">—</b></div><div class="kpi"><span>評価額</span><b id="value">—</b></div><div class="kpi"><span>含み損益</span><b id="total">—</b></div></div></section></header>
<main class="w"><div id="grid" class="grid"></div><div class="note">カード上段の「確認値・含み損益」は GitHub の holdings.json に保存された最新値です。各カードのチャートは TradingView の TSE データを直接表示し、Yahoo!ファイナンスの「リアルタイム株価」も1タップで開けます。取引判断時の最終確認は iSPEED の板・約定値を優先してください。外部チャートはデータ契約により遅延する場合があります。</div></main>
<script>
const memoKey='stock_holdings_memos_v1';
function y(n){return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function getM(){try{return JSON.parse(localStorage.getItem(memoKey))||{}}catch(e){return{}}}
function setM(code,v){const m=getM();m[code]=v;localStorage.setItem(memoKey,JSON.stringify(m))}
function tvUrl(code){const sym=encodeURIComponent('TSE:'+code);return `https://s.tradingview.com/widgetembed/?symbol=${sym}&interval=5&theme=dark&style=1&timezone=Asia%2FTokyo&withdateranges=1&hide_side_toolbar=0&allow_symbol_change=0&saveimage=0&calendar=0&hide_volume=0`}
async function load(){const g=document.getElementById('grid');g.innerHTML='<div class="empty">読み込み中…</div>';try{const r=await fetch('data/holdings.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const ps=d.positions||[];asof.textContent=`${d.asOf||'—'} / ${d.source||''}`;count.textContent=ps.length+'銘柄';let c=0,v=0;ps.forEach(p=>{c+=(+p.quantity||0)*(+p.averageCost||0);v+=(+p.quantity||0)*(+p.referencePrice||0)});cost.textContent=y(c);value.textContent=y(v);const tp=Number(d.totalUnrealizedPnl??(v-c));total.textContent=(tp>=0?'+':'')+y(tp);total.className=tp>=0?'pos':'neg';const mem=getM();g.innerHTML=ps.map(p=>{const pc=(+p.quantity||0)*(+p.averageCost||0),pv=(+p.quantity||0)*(+p.referencePrice||0),pn=Number(p.unrealizedPnl??(pv-pc));const code=esc(p.code);return `<article class="card"><div class="name">${esc(p.name)}</div><div class="code">${code} · ${Number(p.quantity||0).toLocaleString()}株</div><div class="price"><div><span class="muted" style="font-size:10px">GitHub確認値</span><br><b>${y(p.referencePrice)}</b></div><div class="pnl ${pn>=0?'pos':'neg'}">${pn>=0?'+':''}${y(pn)}<div class="muted" style="font-size:9px">確認時含み損益</div></div></div><div class="mini"><div class="box"><span>平均取得</span><b>${y(p.averageCost)}</b></div><div class="box"><span>取得総額</span><b>${y(pc)}</b></div><div class="box"><span>評価額</span><b>${y(pv)}</b></div><div class="box"><span>確認時刻</span><b>${esc(p.referencePriceObservedAt||'—')}</b></div></div><div class="mgmt"><strong>管理方針：</strong>${esc(p.management||'—')}</div><div class="marketlinks"><a class="live" target="_blank" rel="noopener" href="https://finance.yahoo.co.jp/quote/${code}.T">● リアルタイム株価</a><a class="chartlink" target="_blank" rel="noopener" href="https://www.tradingview.com/chart/?symbol=TSE%3A${code}">↗ 大画面チャート</a></div><div class="chartwrap"><div class="charthead"><strong>5分足チャート</strong><span class="muted">TradingView / TSE:${code}</span></div><iframe class="tvchart" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${tvUrl(code)}" title="${esc(p.name)} 5分足"></iframe></div><textarea placeholder="自分メモ（この端末のみ）" oninput="setM('${code}',this.value)">${esc(mem[p.code]||'')}</textarea></article>`}).join('')||'<div class="empty">保有銘柄なし</div>'}catch(e){g.innerHTML=`<div class="empty">読込失敗：${esc(e.message)}</div>`}}
load();
</script>
</body></html>
