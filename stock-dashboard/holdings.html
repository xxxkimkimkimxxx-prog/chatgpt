<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>保有銘柄 | 日本株ダッシュボード</title>
<style>
:root{--bg:#07101d;--panel:#0d1828;--panel2:#111f32;--line:#22324a;--text:#edf4ff;--muted:#94a5bd;--cyan:#53d3ff;--up:#ff6674;--down:#4dde9b;--yellow:#ffd166}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{margin:0;min-height:100vh;padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.45}a{color:inherit;text-decoration:none}button{font:inherit}.wrap{width:min(1120px,calc(100% - 20px));margin:auto}.hero{margin-top:max(14px,env(safe-area-inset-top));padding:18px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(77,222,155,.07))}.top{display:flex;justify-content:space-between;gap:12px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--cyan)}h1{font-size:clamp(29px,6vw,46px);margin:5px 0}.status{font-size:12px;color:var(--muted)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.nav button{min-height:40px;padding:9px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--text);font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.kpi{padding:11px;border:1px solid var(--line);border-radius:14px;background:#0a1525;min-width:0}.kpi span{display:block;color:var(--muted);font-size:9px}.kpi b{display:block;margin-top:3px;font-size:19px;overflow-wrap:anywhere}.up{color:var(--up)!important}.down{color:var(--down)!important}.warn{color:var(--yellow)!important}main{padding:10px 0 36px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{padding:14px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(17,31,50,.97),rgba(10,21,36,.97));min-width:0}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.name{font-size:19px;font-weight:950}.code{font-size:10px;color:var(--muted)}.badge{white-space:nowrap;padding:4px 7px;border:1px solid rgba(83,211,255,.35);border-radius:999px;color:var(--cyan);font-size:8px;font-weight:900}.badge.stale{color:var(--yellow);border-color:rgba(255,209,102,.4)}.quote{margin:11px 0;padding:12px;border:1px solid var(--line);border-radius:14px;background:#091524}.quoteRow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}.label{color:var(--muted);font-size:9px}.price{font-size:30px;font-weight:950;letter-spacing:-.03em}.day{text-align:right;font-size:13px;font-weight:900}.time{margin-top:6px;color:var(--muted);font-size:8px;overflow-wrap:anywhere}.core,.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.core{margin-bottom:6px}.box{padding:8px;border-radius:10px;background:#101e31;min-width:0}.box span{display:block;color:var(--muted);font-size:8px}.box b{display:block;margin-top:2px;font-size:12px;overflow-wrap:anywhere}.chartWrap{margin-top:11px;padding:8px 7px 6px;border:1px solid var(--line);border-radius:14px;background:#071321}.chartHead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 3px 5px}.chartTitle{font-size:11px;font-weight:900}.chartUnit{font-size:9px;color:var(--muted)}.chart{width:100%;height:270px;display:block}.axisText{fill:#8fa2ba;font-size:10px}.gridLine{stroke:#22324a;stroke-width:1}.avgLine{stroke:#53d3ff;stroke-width:1.4;stroke-dasharray:5 4}.prevLine{stroke:#7f8da1;stroke-width:1;stroke-dasharray:3 4}.emptyChart{display:flex;height:250px;align-items:center;justify-content:center;color:var(--muted);font-size:11px}.legend{display:flex;gap:12px;flex-wrap:wrap;padding:2px 4px 0;color:var(--muted);font-size:8px}.legend i{display:inline-block;width:12px;height:2px;vertical-align:middle;margin-right:4px}.mgmt{margin-top:9px;padding-top:9px;border-top:1px dashed #2a3c56;font-size:10px}.mgmt strong{color:var(--cyan)}.note{margin-top:11px;padding:10px;border-left:3px solid var(--yellow);border-radius:8px;background:#25200f;color:#f4e9be;font-size:10px}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--down);margin-right:5px}.pulse.wait{background:var(--yellow)}
@media(max-width:800px){.wrap{width:calc(100% - 14px)}.hero{padding:14px;border-radius:18px}.top{display:block}.nav{margin-top:10px;flex-wrap:nowrap;overflow-x:auto}.nav a,.nav button{flex:0 0 auto;min-height:42px}.grid{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.core{grid-template-columns:1fr 1fr}.core .box:first-child{grid-column:1/-1}.subgrid{grid-template-columns:1fr 1fr}.chart{height:260px}}
@media(max-width:480px){.wrap{width:calc(100% - 10px)}.hero{margin-top:max(5px,env(safe-area-inset-top));padding:12px}.eyebrow{font-size:9px}h1{font-size:30px;margin:2px 0}.status{font-size:10px}.kpi{padding:9px}.kpi b{font-size:16px}.card{padding:10px;border-radius:15px}.name{font-size:18px}.quote{margin:9px 0;padding:10px}.price{font-size:27px}.day{font-size:12px}.chartWrap{padding:6px 4px 5px}.chart{height:245px}.axisText{font-size:9px}.box b{font-size:11px}}
</style>
</head>
<body>
<header class="wrap"><section class="hero"><div class="top"><div><div class="eyebrow">HOLDINGS · JPY LIVE MONITOR</div><h1>保有銘柄</h1><div id="asof" class="status"><span class="pulse wait"></span>株価データ取得中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="latest.html">LATEST</a><button id="reloadBtn" type="button">株価を再取得</button></div></div><div class="kpis"><div class="kpi"><span>保有銘柄</span><b id="count">—</b></div><div class="kpi"><span>取得総額</span><b id="cost">—</b></div><div class="kpi"><span>現在評価額</span><b id="value">—</b></div><div class="kpi"><span>現在含み損益</span><b id="total">—</b></div></div></section></header>
<main class="wrap"><div id="grid" class="grid"></div><div class="note">価格・評価額・損益・チャート縦軸はすべて日本円（円）です。チャート横軸は日本時間（JST）、縦軸は各銘柄の当日値幅に合わせた円建て価格です。株価はGitHub Actionsで約5分間隔に更新します。発注時はiSPEEDの現在値・板を正としてください。</div></main>
<script>
const LIVE_RAW='https://raw.githubusercontent.com/xxxkimkimkimxxx-prog/chatgpt/main/stock-dashboard/data/live-quotes.json';
let holdings=null;
const fmt=new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2});
function yen(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';return fmt.format(Number(n))+'円'}
function yen0(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';return Math.round(Number(n)).toLocaleString('ja-JP')+'円'}
function syen(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';const v=Number(n);return (v>=0?'＋':'−')+Math.abs(Math.round(v)).toLocaleString('ja-JP')+'円'}
function pct(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';const v=Number(n);return (v>=0?'＋':'−')+Math.abs(v).toFixed(2)+'%'}
function cls(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '';return Number(n)>=0?'up':'down'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ageMinutes(s){if(!s)return null;const m=String(s).match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2}) JST/);if(!m)return null;const t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4]-9,+m[5],+m[6]);return Math.max(0,(Date.now()-t)/60000)}
function renderBase(){const ps=holdings.positions||[];document.getElementById('count').textContent=ps.length+'銘柄';let cost=0;ps.forEach(p=>cost+=(+p.quantity||0)*(+p.averageCost||0));document.getElementById('cost').textContent=yen0(cost);document.getElementById('grid').innerHTML=ps.map(p=>{const code=esc(p.code),qty=Number(p.quantity||0),avg=Number(p.averageCost||0);return `<article class="card"><div class="head"><div><div class="name">${esc(p.name)}</div><div class="code">${code} · ${qty.toLocaleString('ja-JP')}株 · 平均取得 ${yen(avg)}</div></div><span class="badge stale" id="badge-${code}">取得待ち</span></div><div class="quote"><div class="quoteRow"><div><div class="label">現在値</div><div class="price" id="price-${code}">${yen(p.referencePrice)}</div></div><div class="day" id="day-${code}">—</div></div><div class="time" id="time-${code}">保存値で仮表示</div></div><div class="core"><div class="box"><span>現在評価額</span><b id="mv-${code}">—</b></div><div class="box"><span>含み損益</span><b id="pnl-${code}">—</b></div><div class="box"><span>取得単価比</span><b id="ret-${code}">—</b></div></div><div class="subgrid"><div class="box"><span>平均取得</span><b>${yen(avg)}</b></div><div class="box"><span>本日高値 / 安値</span><b id="range-${code}">—</b></div><div class="box"><span>始値</span><b id="open-${code}">—</b></div><div class="box"><span>前日終値</span><b id="prev-${code}">—</b></div><div class="box"><span>出来高</span><b id="vol-${code}">—</b></div><div class="box"><span>取得総額</span><b>${yen0(qty*avg)}</b></div></div><div class="chartWrap"><div class="chartHead"><div class="chartTitle">当日5分足</div><div class="chartUnit">縦軸：円　横軸：JST</div></div><div id="chart-${code}" class="emptyChart">5分足データ取得待ち</div><div class="legend"><span><i style="background:var(--cyan)"></i>平均取得</span><span><i style="background:#7f8da1"></i>前日終値</span></div></div><div class="mgmt"><strong>管理方針：</strong>${esc(p.management||'—')}</div></article>`}).join('')}
function svgChart(code,q,avg){const data=(q&&q.series5m)||[];if(data.length<2)return '<div class="emptyChart">5分足データ取得待ち</div>';const W=760,H=280,L=12,R=88,T=12,B=34,pw=W-L-R,ph=H-T-B;let lo=Math.min(...data.map(d=>Number(d.low))),hi=Math.max(...data.map(d=>Number(d.high)));if(q.previousClose!=null){lo=Math.min(lo,Number(q.previousClose));hi=Math.max(hi,Number(q.previousClose))}if(avg){lo=Math.min(lo,avg);hi=Math.max(hi,avg)}let pad=(hi-lo)*.08;if(!pad)pad=Math.max(1,hi*.005);lo-=pad;hi+=pad;const y=v=>T+(hi-v)/(hi-lo)*ph;const x=i=>L+(i+.5)/data.length*pw;let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${code} 当日5分足 円建て">`;for(let i=0;i<5;i++){const v=hi-(hi-lo)*i/4,yy=y(v);s+=`<line class="gridLine" x1="${L}" y1="${yy}" x2="${L+pw}" y2="${yy}"/><text class="axisText" x="${L+pw+7}" y="${yy+3}">${Math.round(v).toLocaleString('ja-JP')}円</text>`}if(q.previousClose!=null){const yy=y(Number(q.previousClose));s+=`<line class="prevLine" x1="${L}" y1="${yy}" x2="${L+pw}" y2="${yy}"/>`}if(avg){const yy=y(avg);s+=`<line class="avgLine" x1="${L}" y1="${yy}" x2="${L+pw}" y2="${yy}"/>`}const bw=Math.max(2,Math.min(8,pw/data.length*.58));data.forEach((d,i)=>{const xx=x(i),o=Number(d.open),h=Number(d.high),l=Number(d.low),c=Number(d.close),up=c>=o,col=up?'#ff6674':'#4dde9b';s+=`<line x1="${xx}" y1="${y(h)}" x2="${xx}" y2="${y(l)}" stroke="${col}" stroke-width="1.2"/>`;const yy=Math.min(y(o),y(c)),hh=Math.max(1.5,Math.abs(y(o)-y(c)));s+=`<rect x="${xx-bw/2}" y="${yy}" width="${bw}" height="${hh}" fill="${col}" rx=".5"/>`});const idx=[0,Math.floor((data.length-1)/3),Math.floor((data.length-1)*2/3),data.length-1];idx.forEach(i=>{s+=`<text class="axisText" text-anchor="middle" x="${x(i)}" y="${H-10}">${esc(data[i].time)}</text>`});s+=`</svg>`;return s}
async function fetchLive(){const u=LIVE_RAW+'?ts='+Date.now();try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('raw '+r.status);return await r.json()}catch(e){const r=await fetch('data/live-quotes.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw e;return await r.json()}}
function updateWithLive(live){const ps=holdings.positions||[],qs=live&&live.quotes?live.quotes:{};let totalCost=0,totalValue=0,liveCount=0;ps.forEach(p=>{const code=String(p.code),q=qs[code]||null,qty=Number(p.quantity||0),avg=Number(p.averageCost||0),fallback=Number(p.referencePrice||0),price=q&&q.price!=null?Number(q.price):fallback,isLive=!!(q&&q.price!=null),mv=price*qty,pnl=(price-avg)*qty,ret=avg?((price/avg)-1)*100:null;totalCost+=avg*qty;totalValue+=mv;if(isLive)liveCount++;const pe=document.getElementById('price-'+code);pe.textContent=yen(price);pe.className='price '+cls(ret);const de=document.getElementById('day-'+code);de.innerHTML=q&&q.changePct!=null?`<span class="${cls(q.changePct)}">${syen(q.change)}<br>${pct(q.changePct)}</span>`:'—';document.getElementById('mv-'+code).textContent=yen0(mv);const pne=document.getElementById('pnl-'+code);pne.textContent=syen(pnl);pne.className=cls(pnl);const re=document.getElementById('ret-'+code);re.textContent=pct(ret);re.className=cls(ret);document.getElementById('range-'+code).textContent=q&&q.high!=null&&q.low!=null?`${yen(q.high)} / ${yen(q.low)}`:'—';document.getElementById('open-'+code).textContent=q&&q.open!=null?yen(q.open):'—';document.getElementById('prev-'+code).textContent=q&&q.previousClose!=null?yen(q.previousClose):'—';document.getElementById('vol-'+code).textContent=q&&q.volume!=null?Number(q.volume).toLocaleString('ja-JP')+'株':'—';document.getElementById('chart-'+code).outerHTML=`<div id="chart-${code}">${svgChart(code,q,avg)}</div>`;const badge=document.getElementById('badge-'+code),tm=document.getElementById('time-'+code),age=q?ageMinutes(q.observedAt):null,stale=!isLive||(q&&q.sourceStatus!=='ok')||(age!=null&&age>12);badge.textContent=!isLive?'保存値':stale?'更新遅延':'約5分更新';badge.className='badge'+(stale?' stale':'');tm.textContent=isLive?`市場データ ${q.observedAt||live.asOf||'—'}${age!=null?' / 約'+Math.round(age)+'分前':''}`:'ライブ値未取得のため保存値を使用'});const totalPnl=totalValue-totalCost;document.getElementById('value').textContent=yen0(totalValue);const te=document.getElementById('total');te.textContent=syen(totalPnl);te.className=cls(totalPnl);const ok=liveCount===ps.length&&liveCount>0;document.getElementById('asof').innerHTML=`<span class="pulse ${ok?'':'wait'}"></span>${ok?'株価自動更新':'一部保存値を使用'} · ${live&&live.asOf?live.asOf:'取得待ち'} · ${liveCount}/${ps.length}銘柄`}
async function refreshQuotes(){const btn=document.getElementById('reloadBtn');btn.disabled=true;btn.textContent='取得中…';try{updateWithLive(await fetchLive())}catch(e){document.getElementById('asof').innerHTML='<span class="pulse wait"></span>ライブ株価取得失敗';updateWithLive({quotes:{}})}finally{btn.disabled=false;btn.textContent='株価を再取得'}}
async function init(){try{const r=await fetch('data/holdings.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('holdings '+r.status);holdings=await r.json();renderBase();await refreshQuotes();setInterval(refreshQuotes,30000)}catch(e){document.getElementById('grid').innerHTML='<div class="note">読込失敗：'+esc(e.message)+'</div>'}}
document.getElementById('reloadBtn').addEventListener('click',refreshQuotes);init();
</script>
</body>
</html>
