<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07101d"><title>HOLDINGS | 日本株ダッシュボード</title><style>
:root{--bg:#07101d;--p:#0d1828;--p2:#111f32;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}button,textarea{font:inherit}.w{width:min(1080px,calc(100% - 20px));margin:auto}.hero{margin-top:14px;background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(77,222,155,.07));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}.muted{color:var(--m)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.nav button{border:1px solid var(--line);background:var(--p);color:var(--t);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.kpi{background:#0a1525;border:1px solid var(--line);border-radius:15px;padding:12px}.kpi span{display:block;font-size:10px;color:var(--m)}.kpi b{display:block;font-size:20px;margin-top:3px}.pos{color:var(--g)}.neg{color:var(--r)}main{padding:12px 0 40px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px}.name{font-size:18px;font-weight:950}.code{font-size:10px;color:var(--m)}.price{display:flex;justify-content:space-between;align-items:end;margin:13px 0;padding:12px;background:#091524;border:1px solid var(--line);border-radius:14px}.price b{font-size:25px}.pnl{text-align:right;font-weight:950}.mini{display:grid;grid-template-columns:1fr 1fr;gap:7px}.box{background:#101e31;border-radius:11px;padding:9px}.box span{display:block;font-size:9px;color:var(--m)}.box b{font-size:12px}.mgmt{font-size:11px;margin-top:10px;border-top:1px dashed #2a3c56;padding-top:10px}.mgmt strong{color:var(--c)}textarea{width:100%;margin-top:8px;background:#091524;border:1px solid var(--line);border-radius:10px;color:var(--t);padding:9px;min-height:65px}.note{margin-top:12px;border-left:3px solid var(--y);background:#25200f;padding:10px 11px;border-radius:9px;font-size:10px;color:#f4e9be}.empty{padding:30px;text-align:center;color:var(--m);grid-column:1/-1}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.top{display:block}.nav{margin-top:10px}}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="w"><section class="hero"><div class="top"><div><div class="ey">HOLDINGS · GITHUB SYNC</div><h1>保有銘柄</h1><div id="asof" class="muted">読み込み中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="latest.html">LATEST</a><button onclick="load()">再読込</button></div></div><div class="kpis"><div class="kpi"><span>保有銘柄</span><b id="count">—</b></div><div class="kpi"><span>取得総額</span><b id="cost">—</b></div><div class="kpi"><span>評価額</span><b id="value">—</b></div><div class="kpi"><span>含み損益</span><b id="total">—</b></div></div></section></header><main class="w"><div id="grid" class="grid"></div><div class="note">価格はリアルタイム自動更新ではありません。GitHubの holdings.json に保存された最新のiSPEED確認値を表示します。各カードの「自分メモ」はこの端末だけに保存されます。</div></main><script>
const memoKey='stock_holdings_memos_v1';function y(n){return '¥'+Math.round(Number(n)||0).toLocaleString('ja-JP')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function getM(){try{return JSON.parse(localStorage.getItem(memoKey))||{}}catch(e){return{}}}function setM(code,v){const m=getM();m[code]=v;localStorage.setItem(memoKey,JSON.stringify(m))}async function load(){const g=document.getElementById('grid');g.innerHTML='<div class="empty">読み込み中…</div>';try{const r=await fetch('data/holdings.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const ps=d.positions||[];asof.textContent=`${d.asOf||'—'} / ${d.source||''}`;count.textContent=ps.length+'銘柄';let c=0,v=0;ps.forEach(p=>{c+=(+p.quantity||0)*(+p.averageCost||0);v+=(+p.quantity||0)*(+p.referencePrice||0)});cost.textContent=y(c);value.textContent=y(v);const tp=Number(d.totalUnrealizedPnl??(v-c));total.textContent=(tp>=0?'+':'')+y(tp);total.className=tp>=0?'pos':'neg';const mem=getM();g.innerHTML=ps.map(p=>{const pc=(+p.quantity||0)*(+p.averageCost||0),pv=(+p.quantity||0)*(+p.referencePrice||0),pn=Number(p.unrealizedPnl??(pv-pc));return `<article class="card"><div class="name">${esc(p.name)}</div><div class="code">${esc(p.code)} · ${Number(p.quantity||0).toLocaleString()}株</div><div class="price"><div><span class="muted" style="font-size:10px">確認値</span><br><b>${y(p.referencePrice)}</b></div><div class="pnl ${pn>=0?'pos':'neg'}">${pn>=0?'+':''}${y(pn)}<div class="muted" style="font-size:9px">含み損益</div></div></div><div class="mini"><div class="box"><span>平均取得</span><b>${y(p.averageCost)}</b></div><div class="box"><span>取得総額</span><b>${y(pc)}</b></div><div class="box"><span>評価額</span><b>${y(pv)}</b></div><div class="box"><span>確認時刻</span><b>${esc(p.referencePriceObservedAt||'—')}</b></div></div><div class="mgmt"><strong>管理方針：</strong>${esc(p.management||'—')}</div><textarea placeholder="自分メモ（この端末のみ）" oninput="setM('${esc(p.code)}',this.value)">${esc(mem[p.code]||'')}</textarea></article>`}).join('')||'<div class="empty">保有銘柄なし</div>'}catch(e){g.innerHTML=`<div class="empty">読込失敗：${esc(e.message)}</div>`}}load();
</script></body></html>
