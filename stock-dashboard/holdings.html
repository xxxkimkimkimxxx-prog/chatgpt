<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>HOLDINGS | 日本株ダッシュボード</title>
<style>
:root{--bg:#07101d;--p:#0d1828;--p2:#111f32;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit;text-decoration:none}button{font:inherit}.w{width:min(1120px,calc(100% - 20px));margin:auto}.hero{margin-top:max(14px,env(safe-area-inset-top));background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(77,222,155,.07));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}.muted{color:var(--m);font-size:13px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a,.nav button{border:1px solid var(--line);background:var(--p);color:var(--t);border-radius:999px;padding:9px 12px;min-height:38px;font-size:11px;font-weight:800;cursor:pointer}.nav button:disabled{opacity:.6}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.kpi{background:#0a1525;border:1px solid var(--line);border-radius:15px;padding:12px;min-width:0}.kpi span{display:block;font-size:10px;color:var(--m)}.kpi b{display:block;font-size:20px;margin-top:3px;word-break:break-word}.pos{color:var(--g)!important}.neg{color:var(--r)!important}.warn{color:var(--y)!important}main{padding:12px 0 40px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:19px;font-weight:950}.code{font-size:10px;color:var(--m)}.badge{font-size:9px;font-weight:950;border:1px solid rgba(83,211,255,.35);color:var(--c);border-radius:999px;padding:4px 7px;white-space:nowrap}.badge.stale{color:var(--y);border-color:rgba(255,209,102,.35)}.quote{margin:13px 0;padding:13px;background:#091524;border:1px solid var(--line);border-radius:14px}.quoteTop{display:flex;justify-content:space-between;align-items:end;gap:12px}.quoteLabel{font-size:10px;color:var(--m)}.price{font-size:30px;font-weight:950;letter-spacing:-.02em}.day{text-align:right;font-size:13px;font-weight:900}.time{font-size:9px;color:var(--m);margin-top:7px;overflow-wrap:anywhere}.core{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:7px}.box{background:#101e31;border-radius:11px;padding:9px;min-width:0}.box span{display:block;font-size:9px;color:var(--m)}.box b{display:block;font-size:13px;margin-top:2px;overflow-wrap:anywhere}.subgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.chart{margin-top:12px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#091524;min-height:320px}.chart iframe{width:100%;height:320px;border:0;display:block}.mgmt{font-size:11px;margin-top:10px;border-top:1px dashed #2a3c56;padding-top:10px}.mgmt strong{color:var(--c)}.note{margin-top:12px;border-left:3px solid var(--y);background:#25200f;padding:10px 11px;border-radius:9px;font-size:11px;color:#f4e9be}.empty{padding:30px;text-align:center;color:var(--m);grid-column:1/-1}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--g);margin-right:5px}.pulse.wait{background:var(--y)}
@media(max-width:800px){
  .w{width:calc(100% - 16px)}
  .hero{padding:15px;border-radius:20px}
  .top{display:block}
  .nav{margin-top:12px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .nav::-webkit-scrollbar{display:none}
  .nav a,.nav button{flex:0 0 auto;min-height:42px;padding:10px 14px}
  .grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr;gap:7px}
  .kpi{padding:11px}.kpi b{font-size:18px}
  .card{padding:12px;border-radius:16px}
  .chart,.chart iframe{min-height:290px;height:290px}
  .core{grid-template-columns:1fr 1fr}
  .core .box:first-child{grid-column:1/-1}
  .subgrid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .w{width:calc(100% - 12px)}
  .hero{margin-top:max(6px,env(safe-area-inset-top));padding:13px;border-radius:18px}
  h1{font-size:32px;margin:3px 0}.ey{font-size:10px}.muted{font-size:11px}
  .kpis{margin-top:12px}.kpi{border-radius:13px;padding:10px}.kpi span{font-size:9px}.kpi b{font-size:17px}
  main{padding-top:8px}.grid{gap:8px}.card{padding:11px}.name{font-size:18px}.code{font-size:10px}.badge{font-size:8px}
  .quote{margin:10px 0;padding:11px}.quoteTop{align-items:flex-start}.price{font-size:28px}.day{font-size:12px}.time{font-size:8px}
  .core,.subgrid{gap:6px}.box{padding:9px 8px}.box b{font-size:12px}.box span{font-size:8px}
  .chart,.chart iframe{min-height:250px;height:250px}.mgmt{font-size:10px}.note{font-size:10px;margin-bottom:calc(6px + env(safe-area-inset-bottom))}
}
@media(max-width:360px){
  .price{font-size:25px}.kpi b{font-size:15px}.subgrid{grid-template-columns:1fr}.core{grid-template-columns:1fr 1fr}.chart,.chart iframe{min-height:230px;height:230px}
}
</style>
</head>
<body>
<header class="w"><section class="hero"><div class="top"><div><div class="ey">HOLDINGS · AUTO VALUATION</div><h1>保有銘柄</h1><div id="asof" class="muted"><span class="pulse wait"></span>株価データ取得中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="latest.html">LATEST</a><button id="reloadBtn" type="button">株価を再取得</button></div></div><div class="kpis"><div class="kpi"><span>保有銘柄</span><b id="count">—</b></div><div class="kpi"><span>取得総額</span><b id="cost">—</b></div><div class="kpi"><span>現在評価額</span><b id="value">—</b></div><div class="kpi"><span>現在含み損益</span><b id="total">—</b></div></div></section></header>
<main class="w"><div id="grid" class="grid"></div><div class="note">株価スナップショットはGitHub ActionsがJPX営業日に約5分間隔で取得し、この画面は30秒ごとに最新JSONを再読込します。各カードの「現在評価額・含み損益・取得単価比」はその株価と holdings.json の数量・平均取得単価から自動計算します。発注時の最終確認はiSPEEDの現在値・板を正としてください。</div></main>
<script>
const LIVE_RAW='https://raw.githubusercontent.com/xxxkimkimkimxxx-prog/chatgpt/main/stock-dashboard/data/live-quotes.json';
let holdings=null;
function y(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';return '¥'+Math.round(Number(n)).toLocaleString('ja-JP')}
function nfmt(n,d=2){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';return Number(n).toLocaleString('ja-JP',{maximumFractionDigits:d})}
function pct(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';const v=Number(n);return (v>=0?'+':'')+v.toFixed(2)+'%'}
function signedY(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '—';const v=Number(n);return (v>=0?'+':'−')+'¥'+Math.abs(Math.round(v)).toLocaleString('ja-JP')}
function cls(n){if(n===null||n===undefined||Number.isNaN(Number(n)))return '';return Number(n)>=0?'pos':'neg'}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function tvChartUrl(code){const sym='TSE%3A'+encodeURIComponent(code);return 'https://s.tradingview.com/widgetembed/?frameElementId=tv_'+encodeURIComponent(code)+'&symbol='+sym+'&interval=5&hidesidetoolbar=1&symboledit=0&saveimage=0&toolbarbg=f1f3f6&studies=%5B%5D&theme=dark&style=1&timezone=Asia%2FTokyo&withdateranges=1&hideideas=1'}
function ageMinutes(s){if(!s)return null;const m=String(s).match(/(\d{4})-(\d{2})-(\d{2}) (\d{2}):(\d{2}):(\d{2}) JST/);if(!m)return null;const t=Date.UTC(+m[1],+m[2]-1,+m[3],+m[4]-9,+m[5],+m[6]);return Math.max(0,(Date.now()-t)/60000)}
function renderBase(){
 const ps=holdings.positions||[];document.getElementById('count').textContent=ps.length+'銘柄';let cost=0;ps.forEach(p=>cost+=(+p.quantity||0)*(+p.averageCost||0));document.getElementById('cost').textContent=y(cost);
 const g=document.getElementById('grid');
 g.innerHTML=ps.map(p=>{const code=esc(p.code),qty=Number(p.quantity||0),avg=Number(p.averageCost||0);return `<article class="card" id="card-${code}"><div class="head"><div><div class="name">${esc(p.name)}</div><div class="code">${code} · ${qty.toLocaleString()}株 · 平均取得 ${y(avg)}</div></div><span class="badge stale" id="badge-${code}">取得待ち</span></div><div class="quote"><div class="quoteTop"><div><div class="quoteLabel">現在値</div><div class="price" id="price-${code}">${y(p.referencePrice)}</div></div><div class="day" id="day-${code}">—</div></div><div class="time" id="time-${code}">保存値で仮表示</div></div><div class="core"><div class="box"><span>現在評価額</span><b id="mv-${code}">—</b></div><div class="box"><span>含み損益</span><b id="pnl-${code}">—</b></div><div class="box"><span>取得単価比</span><b id="ret-${code}">—</b></div></div><div class="subgrid"><div class="box"><span>平均取得</span><b>${y(avg)}</b></div><div class="box"><span>本日高値 / 安値</span><b id="range-${code}">—</b></div><div class="box"><span>始値</span><b id="open-${code}">—</b></div><div class="box"><span>前日終値</span><b id="prev-${code}">—</b></div><div class="box"><span>出来高</span><b id="vol-${code}">—</b></div><div class="box"><span>取得総額</span><b>${y(qty*avg)}</b></div></div><div class="chart"><iframe title="${esc(p.name)} 5分足" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="${tvChartUrl(p.code)}"></iframe></div><div class="mgmt"><strong>管理方針：</strong>${esc(p.management||'—')}</div></article>`}).join('')||'<div class="empty">保有銘柄なし</div>'
}
async function fetchLive(){const u=LIVE_RAW+'?ts='+Date.now();try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('raw '+r.status);return await r.json()}catch(e){const r=await fetch('data/live-quotes.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw e;return await r.json()}}
function updateWithLive(live){
 const ps=holdings.positions||[],qs=live&&live.quotes?live.quotes:{};let totalCost=0,totalValue=0,liveCount=0;
 ps.forEach(p=>{const code=String(p.code),q=qs[code]||null,qty=Number(p.quantity||0),avg=Number(p.averageCost||0),fallback=Number(p.referencePrice||0);const price=q&&q.price!=null?Number(q.price):fallback;const isLive=!!(q&&q.price!=null);if(isLive)liveCount++;const mv=price*qty,pnl=(price-avg)*qty,ret=avg?((price/avg)-1)*100:null;totalCost+=avg*qty;totalValue+=mv;
 const priceEl=document.getElementById('price-'+code);priceEl.textContent=y(price);priceEl.className='price '+cls(ret);
 const dayEl=document.getElementById('day-'+code);if(q&&q.changePct!=null){dayEl.innerHTML=`<span class="${cls(q.changePct)}">${signedY(q.change)}<br>${pct(q.changePct)}</span>`}else dayEl.textContent='—';
 const pnlEl=document.getElementById('pnl-'+code);pnlEl.textContent=signedY(pnl);pnlEl.className=cls(pnl);const retEl=document.getElementById('ret-'+code);retEl.textContent=pct(ret);retEl.className=cls(ret);
 document.getElementById('mv-'+code).textContent=y(mv);document.getElementById('range-'+code).textContent=q&&q.high!=null&&q.low!=null?`${nfmt(q.high)} / ${nfmt(q.low)}`:'—';document.getElementById('open-'+code).textContent=q&&q.open!=null?y(q.open):'—';document.getElementById('prev-'+code).textContent=q&&q.previousClose!=null?y(q.previousClose):'—';document.getElementById('vol-'+code).textContent=q&&q.volume!=null?Number(q.volume).toLocaleString('ja-JP')+'株':'—';
 const badge=document.getElementById('badge-'+code),tm=document.getElementById('time-'+code),age=q?ageMinutes(q.observedAt):null;const stale=!isLive||(q&&q.sourceStatus!=='ok')||(age!=null&&age>12);badge.textContent=!isLive?'保存値':stale?'更新遅延':'約5分更新';badge.className='badge'+(stale?' stale':'');tm.textContent=isLive?`市場データ: ${q.observedAt||live.asOf||'—'}${age!=null?' / 約'+Math.round(age)+'分前':''}`:`ライブ値未取得のため holdings.json の保存値 ${y(fallback)} を使用`;
 });
 const totalPnl=totalValue-totalCost;document.getElementById('value').textContent=y(totalValue);const t=document.getElementById('total');t.textContent=signedY(totalPnl);t.className=cls(totalPnl);const a=document.getElementById('asof');const ok=liveCount===ps.length&&liveCount>0;a.innerHTML=`<span class="pulse ${ok?'':'wait'}"></span>${ok?'株価自動更新':'一部保存値を使用'} · ${live&&live.asOf?live.asOf:'取得待ち'} · ${liveCount}/${ps.length}銘柄`;
}
async function refreshQuotes(){const btn=document.getElementById('reloadBtn');btn.disabled=true;btn.textContent='取得中…';try{const live=await fetchLive();updateWithLive(live)}catch(e){document.getElementById('asof').innerHTML='<span class="pulse wait"></span>ライブ株価の取得に失敗。保存値を表示中';updateWithLive({quotes:{}})}finally{btn.disabled=false;btn.textContent='株価を再取得'}}
async function init(){try{const r=await fetch('data/holdings.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('holdings '+r.status);holdings=await r.json();renderBase();await refreshQuotes();setInterval(refreshQuotes,30000)}catch(e){document.getElementById('grid').innerHTML=`<div class="empty">読込失敗：${esc(e.message)}</div>`;document.getElementById('asof').innerHTML='<span class="pulse wait"></span>データ読込エラー'}}
document.getElementById('reloadBtn').addEventListener('click',refreshQuotes);init();
</script>
</body>
</html>
