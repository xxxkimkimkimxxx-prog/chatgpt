<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220">
<title>過去トレード履歴 | 日本株トレードダッシュボード</title>
<style>
:root{--bg:#07101d;--panel:#0d1828;--panel2:#111f32;--line:#22324a;--text:#edf4ff;--muted:#94a5bd;--cyan:#53d3ff;--green:#4dde9b;--red:#ff6b7a;--yellow:#ffd166;--purple:#b79cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845 0,#07101d 38%,#050b14 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 20px));margin:auto}.hero{margin-top:14px;background:linear-gradient(135deg,rgba(83,211,255,.13),rgba(183,156,255,.08));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--cyan)}h1{margin:6px 0 8px;font-size:clamp(28px,6vw,46px);line-height:1.08}.muted{color:var(--muted)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.kpi{background:#0a1525;border:1px solid var(--line);border-radius:15px;padding:12px}.kpi span{display:block;font-size:10px;color:var(--muted)}.kpi b{display:block;font-size:21px;margin-top:3px}.pos{color:var(--green)}.neg{color:var(--red)}.warn{color:var(--yellow)}
main{padding:13px 0 40px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 10px}.filters{display:grid;grid-template-columns:1.2fr repeat(3,.7fr);gap:8px}.filters input,.filters select{width:100%;border:1px solid var(--line);background:#081423;color:var(--text);border-radius:11px;padding:9px 10px}.daily{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.day{border:1px solid var(--line);background:#0a1525;border-radius:13px;padding:10px}.day span{font-size:10px;color:var(--muted)}.day b{display:block;margin-top:3px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{border-collapse:collapse;width:100%;min-width:920px;background:#0a1525}th,td{padding:9px 10px;border-bottom:1px solid #1f3048;text-align:left;font-size:11px;white-space:nowrap}th{background:#132239;color:#a9bdd7;position:sticky;top:0}tr:last-child td{border-bottom:0}.tag{display:inline-block;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900}.tag.confirmed{background:#123025;color:#a9ffd4;border:1px solid #28684c}.tag.local{background:#182a40;color:#98ddff;border:1px solid #31536f}.tag.swing{background:#2b2348;color:#d2c4ff}.note{font-size:11px;color:#f4e9be;border-left:3px solid var(--yellow);background:#25200f;padding:11px 12px;border-radius:10px;margin-top:10px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:760px){.top{display:block}.nav{margin-top:12px}.kpis{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.daily{grid-template-columns:1fr 1fr}}
</style>
</head><body>
<header class="wrap"><section class="hero"><div class="top"><div><div class="eyebrow">TRADE HISTORY</div><h1>過去トレード履歴</h1><div class="muted">iSPEEDで確認済みの過去取引と、ダッシュボードへ今後追加する売買をまとめて確認します。</div></div><div class="nav"><a href="./">メイン</a><a href="holdings.html">保有銘柄</a></div></div>
<div class="kpis"><div class="kpi"><span>8月 iSPEED確定合計</span><b class="pos">+¥42,500</b></div><div class="kpi"><span>詳細登録済み</span><b id="detailPnl">—</b></div><div class="kpi"><span>詳細件数</span><b id="detailCount">—</b><small class="muted">公式35件</small></div><div class="kpi"><span>詳細ベース勝率</span><b id="winRate">—</b></div></div></section></header>
<main class="wrap">
<section class="card"><h2>日別サマリー</h2><div id="daily" class="daily"></div><div class="note" id="reconcile"></div></section>
<section class="card"><h2>絞り込み</h2><div class="filters"><input id="q" type="search" placeholder="銘柄名・証券コードで検索"><select id="date"><option value="all">全日付</option></select><select id="result"><option value="all">勝敗すべて</option><option value="win">利益のみ</option><option value="loss">損失のみ</option></select><select id="type"><option value="all">全区分</option><option value="day">デイトレ</option><option value="swing">スイング</option></select></div></section>
<section class="card"><h2>取引一覧</h2><div class="tableWrap"><table><thead><tr><th>日付</th><th>区分</th><th>銘柄</th><th>コード</th><th>数量</th><th>買値</th><th>売値</th><th>実現損益</th><th>データ</th></tr></thead><tbody id="tbody"></tbody></table></div></section>
</main>
<script>
const OFFICIAL_TOTAL=42500,OFFICIAL_COUNT=35;
const HIST=[
['2026-08-05','day','日経ダブルインバース','1357',null,null,null,-4335],['2026-08-05','day','YE DIGITAL','2354',null,null,null,162],['2026-08-05','day','YE DIGITAL','2354',null,null,null,163],['2026-08-05','day','SUMCO','3436',null,null,null,-1975],['2026-08-05','day','ニッカトー','5367',null,null,null,1075],['2026-08-05','day','住友電工','5802',null,null,null,-1325],['2026-08-05','day','フジクラ','5803',null,null,null,725],['2026-08-05','day','フジクラ','5803',null,null,null,2265],['2026-08-05','day','GO','',null,null,null,325],['2026-08-05','day','クラレ','3405',null,null,null,3185],['2026-08-05','day','ウシオ電機','6925',100,4315,4366.2,4845],['2026-08-05','day','長瀬産業','8012',200,1293,1278.5,-3175],
['2026-08-06','day','スズキ','7269',null,null,null,9120],['2026-08-06','day','めぶきFG','7167',null,null,null,2900],['2026-08-06','day','セイコーエプソン','6724',null,null,null,1250],['2026-08-06','day','オークマ','6103',null,null,null,-4980],
['2026-08-07','day','日本タングステン','6998',null,null,null,5400],['2026-08-07','day','バンダイナムコHD','7832',null,null,null,1800],['2026-08-07','day','任天堂','7974',null,null,null,450],
['2026-08-12','day','INPEX','1605',100,3666.55,3730,6300],['2026-08-12','day','IHI','7013',100,null,2899,-600],['2026-08-12','day','ヨネックス','7906',100,null,null,2000],
['2026-08-13','day','日東紡績','3110',100,null,3195,4200],['2026-08-20','swing','トライアルHD','141A',300,3955,3995,12000]
].map((x,i)=>({id:'hist-'+i,date:x[0],type:x[1],name:x[2],code:x[3],qty:x[4],buy:x[5],sell:x[6],pnl:x[7],source:'confirmed'}));
function localTrades(){try{const s=JSON.parse(localStorage.getItem('jp-stock-dashboard-v1'));return (s?.trades||[]).map((t,i)=>({id:'local-'+i,date:(t.date||'').slice(0,10),type:t.type||'day',name:t.name||'',code:t.code||'',qty:t.qty??null,buy:t.buy??null,sell:t.sell??null,pnl:Number(t.pnl)||0,source:'local'}));}catch(e){return []}}
function yen(n){return (n>=0?'+':'-')+'¥'+Math.abs(Math.round(n)).toLocaleString('ja-JP')}function num(v){return v===null||v===''||typeof v==='undefined'?'—':Number(v).toLocaleString('ja-JP',{maximumFractionDigits:2})}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
let all=[...HIST,...localTrades()];
function setup(){const ds=[...new Set(all.map(x=>x.date).filter(Boolean))].sort().reverse();date.innerHTML='<option value="all">全日付</option>'+ds.map(d=>`<option value="${d}">${d.replace('2026-','')}</option>`).join('');['input','change'].forEach(ev=>q.addEventListener(ev,render));date.onchange=result.onchange=type.onchange=render;render()}
function render(){const known=HIST.reduce((s,x)=>s+x.pnl,0),wins=HIST.filter(x=>x.pnl>0).length,losses=HIST.filter(x=>x.pnl<0).length;detailPnl.textContent=yen(known);detailPnl.className=known>=0?'pos':'neg';detailCount.textContent=HIST.length+'件';winRate.textContent=((wins/(wins+losses))*100).toFixed(1)+'%';reconcile.textContent=`iSPEED確定は35件・+¥42,500。現在、詳細まで復元できているのは${HIST.length}件・${yen(known)}です。未復元は${OFFICIAL_COUNT-HIST.length}件で、差額は${yen(OFFICIAL_TOTAL-known)}。不明な買値・売値・数量は推測せず「—」表示にしています。`;
 const by={};HIST.forEach(x=>(by[x.date]??=[]).push(x));daily.innerHTML=Object.keys(by).sort().reverse().map(d=>{const a=by[d],p=a.reduce((s,x)=>s+x.pnl,0);return `<div class="day"><span>${d}</span><b class="${p>=0?'pos':'neg'}">${yen(p)}</b><small class="muted">${a.length}件 / ${a.filter(x=>x.pnl>0).length}勝 ${a.filter(x=>x.pnl<0).length}敗</small></div>`}).join('');
 const qq=q.value.trim().toLowerCase();const rows=all.filter(x=>(!qq||(x.name+' '+x.code).toLowerCase().includes(qq))&&(date.value==='all'||x.date===date.value)&&(result.value==='all'||(result.value==='win'?x.pnl>0:x.pnl<0))&&(type.value==='all'||x.type===type.value)).sort((a,b)=>b.date.localeCompare(a.date));tbody.innerHTML=rows.length?rows.map(x=>`<tr><td>${esc(x.date)}</td><td><span class="tag ${x.type==='swing'?'swing':''}">${x.type==='swing'?'スイング':'デイトレ'}</span></td><td>${esc(x.name)}</td><td>${esc(x.code||'—')}</td><td>${num(x.qty)}</td><td>${num(x.buy)}</td><td>${num(x.sell)}</td><td class="${x.pnl>=0?'pos':'neg'}"><b>${yen(x.pnl)}</b></td><td><span class="tag ${x.source}">${x.source==='confirmed'?'確定履歴':'ダッシュボード入力'}</span></td></tr>`).join(''):'<tr><td colspan="9" class="empty">該当する取引がありません</td></tr>'}
setup();
</script></body></html>
