<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>最新戦略 | 日本株ダッシュボード</title><style>:root{--bg:#07101d;--p:#0d1828;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166;--v:#b79cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.w{width:min(1080px,calc(100% - 20px));margin:auto}.hero{margin-top:14px;background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(183,156,255,.08));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{border:1px solid var(--line);background:var(--p);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}.muted{color:var(--m)}main{padding:12px 0 40px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.card h2{margin:0 0 8px;font-size:17px}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:10px}.hot{color:#a9ffd4;border-color:#28684c;background:#102c22}.cold{color:#ffd1d7;border-color:#743543;background:#30151c}.candidate{border:1px solid var(--line);border-radius:15px;padding:12px;background:#0a1525;margin-bottom:8px}.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#1b304a;color:var(--c);font-weight:900;margin-right:7px}.name{font-weight:900}.meta{font-size:10px;color:var(--m);margin-top:5px}.cond{font-size:10px;margin-top:7px}.cond b{color:var(--c)}.status{font-size:11px;color:var(--m)}.source{font-size:10px;color:#b9c8da;margin:4px 0}.empty{padding:22px;text-align:center;color:var(--m);border:1px dashed #39506e;border-radius:14px}.banner{border:1px solid #665a2b;background:#25200f;color:#ffe8a0;border-radius:14px;padding:11px;font-size:11px;margin-bottom:10px}.good{color:var(--g)}.bad{color:var(--r)}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:9px;font-weight:900;margin-left:6px}.intraday{border-color:#355e75;background:linear-gradient(180deg,#0d2636,#0a1724)}@media(max-width:760px){.grid2{grid-template-columns:1fr}.top{display:block}.nav{margin-top:12px}}</style></head><body><header class="w"><section class="hero"><div class="top"><div><div class="ey">LIVE STRATEGY + 06:30 BASELINE</div><h1>最新の投資戦略</h1><div id="asof" class="muted">読み込み中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="holdings.html">HOLDINGS</a><a href="history.html">HISTORY</a></div></div></section></header><main class="w"><div class="banner">朝6:30の予想は検証用に保存し、場中の判断は別レイヤーで更新します。朝予想を書き換えないため、予想精度を後から正しく検証できます。</div><section class="card intraday"><h2>場中アップデート <span class="tag">CURRENT</span></h2><div id="currentSummary" class="status"></div></section><section class="grid2"><div class="card intraday"><h2>資金流入テーマ</h2><div id="flows"></div></div><div class="card intraday"><h2>現在のデイトレ候補</h2><div id="currentDay"></div></div></section><section class="grid2"><div class="card intraday"><h2>現在のスイング候補</h2><div id="currentSwing"></div></div><div class="card intraday"><h2>保有銘柄の更新</h2><div id="holdUpdate"></div></div></section><section class="card"><h2>06:30時点の朝戦略 <span class="tag">BASELINE</span></h2><div id="morningStance" class="status"></div><div class="pillrow" id="morningHot" style="margin-top:8px"></div></section><section class="grid2"><div class="card"><h2>朝のデイトレ候補</h2><div id="day"></div></div><div class="card"><h2>朝のスイング候補</h2><div id="swing"></div></div></section><section class="card"><h2>本日のリスク計画</h2><pre id="risk" style="white-space:pre-wrap;font-family:inherit;font-size:11px;color:#cbd8e8"></pre></section></main><script>function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cbox(c,type){return `<div class="candidate"><div><span class="rank">${esc(c.rank??'—')}</span><span class="name">${esc(c.name||'')} (${esc(c.code||'')})</span></div><div class="meta">${esc(c.stance||c.sector||'')}</div><div class="cond"><b>理由：</b>${esc(c.reason||c.catalyst||'—')}</div><div class="cond"><b>条件：</b>${esc(c.entryCondition||'—')}</div><div class="cond"><b>無効：</b>${esc(c.invalidCondition||c.skipCondition||'—')}</div>${c.targetGuide?`<div class="cond"><b>目標：</b>${esc(c.targetGuide)}</div>`:''}${c.referenceZone?`<div class="cond"><b>注目帯：</b>${esc(c.referenceZone)}</div>`:''}</div>`}async function load(){try{const [cr,mr]=await Promise.all([fetch('data/current-view.json?ts='+Date.now(),{cache:'no-store'}),fetch('data/latest-strategy.json?ts='+Date.now(),{cache:'no-store'})]);const c=cr.ok?await cr.json():null;const m=mr.ok?await mr.json():null;asof.textContent=c?.asOf?`場中更新 ${c.asOf}`:(m?.date?`${m.date} 6:30戦略`:'未更新');if(c){currentSummary.textContent=c.marketSummary||'—';flows.innerHTML=(c.capitalFlow||[]).map(x=>`<div class="candidate"><div><span class="rank">${esc(x.rank)}</span><span class="name">${esc(x.theme)}</span><span class="tag">${esc(x.strength)}</span></div><div class="meta">${esc((x.examples||[]).join(' / '))}</div><div class="cond">${esc(x.note||'')}</div></div>`).join('')||'<div class="empty">未更新</div>';currentDay.innerHTML=(c.daytrade?.candidates||[]).map(x=>cbox(x,'day')).join('')||'<div class="empty">候補なし</div>';currentSwing.innerHTML=(c.swing?.candidates||[]).map(x=>cbox(x,'swing')).join('')||'<div class="empty">候補なし</div>';holdUpdate.innerHTML=(c.holdingsUpdate||[]).map(x=>`<div class="candidate"><div class="name">${esc(x.name)} (${esc(x.code)})</div><div class="meta">${esc(x.observedAt||'')} / ${esc(x.price??'—')}円 / 平均取得 ${esc(x.averageCost??'—')}円</div><div class="cond"><b>判断：</b>${esc(x.stance||'')}</div><div class="cond"><b>テクニカル：</b>${esc(x.technical||'')}</div><div class="cond"><b>上：</b>${esc(x.upsideTrigger||'')}</div><div class="cond"><b>下：</b>${esc(x.downsideTrigger||'')}</div></div>`).join('')||'<div class="empty">更新なし</div>'}else{currentSummary.textContent='場中更新はまだありません';flows.innerHTML=currentDay.innerHTML=currentSwing.innerHTML=holdUpdate.innerHTML='<div class="empty">未更新</div>'}if(m){morningStance.textContent=m.marketStance||'—';morningHot.innerHTML=(m.hotSectors||[]).map(x=>`<span class="pill hot">${esc(typeof x==='string'?x:(x.name||''))}</span>`).join('');day.innerHTML=(m.daytradeCandidates||[]).map(x=>cbox(x,'day')).join('')||'<div class="empty">候補なし</div>';swing.innerHTML=(m.swingCandidates||[]).map(x=>cbox(x,'swing')).join('')||'<div class="empty">候補なし</div>';risk.textContent=typeof m.riskPlan==='string'?m.riskPlan:JSON.stringify(m.riskPlan||{},null,2)}else{morningStance.textContent='朝戦略なし';day.innerHTML=swing.innerHTML='<div class="empty">未登録</div>';risk.textContent='—'}}catch(e){asof.textContent='読み込み失敗';currentSummary.textContent=e.message}}load();</script></body></html>
