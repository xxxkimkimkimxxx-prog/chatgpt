<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1220"><title>最新朝戦略 | 日本株ダッシュボード</title><style>:root{--bg:#07101d;--p:#0d1828;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166;--v:#b79cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}.w{width:min(1080px,calc(100% - 20px));margin:auto}.hero{margin-top:14px;background:linear-gradient(135deg,rgba(83,211,255,.14),rgba(183,156,255,.08));border:1px solid var(--line);border-radius:24px;padding:20px}.top{display:flex;justify-content:space-between;gap:12px}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav a{border:1px solid var(--line);background:var(--p);border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:6px 0;font-size:clamp(30px,6vw,48px)}.muted{color:var(--m)}main{padding:12px 0 40px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:linear-gradient(180deg,rgba(17,31,50,.96),rgba(10,21,36,.96));border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}.card h2{margin:0 0 8px;font-size:17px}.pillrow{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:999px;padding:6px 8px;font-size:10px}.hot{color:#a9ffd4;border-color:#28684c;background:#102c22}.cold{color:#ffd1d7;border-color:#743543;background:#30151c}.candidate{border:1px solid var(--line);border-radius:15px;padding:12px;background:#0a1525;margin-bottom:8px}.rank{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:#1b304a;color:var(--c);font-weight:900;margin-right:7px}.name{font-weight:900}.meta{font-size:10px;color:var(--m);margin-top:5px}.cond{font-size:10px;margin-top:7px}.cond b{color:var(--c)}.status{font-size:11px;color:var(--m)}.source{font-size:10px;color:#b9c8da;margin:4px 0}.empty{padding:22px;text-align:center;color:var(--m);border:1px dashed #39506e;border-radius:14px}@media(max-width:760px){.grid2{grid-template-columns:1fr}.top{display:block}.nav{margin-top:12px}}</style></head><body><header class="w"><section class="hero"><div class="top"><div><div class="ey">LATEST 06:30 STRATEGY</div><h1>最新の朝戦略</h1><div id="asof" class="muted">読み込み中…</div></div><div class="nav"><a href="hub.html">HUB</a><a href="forecast-import.html">FORECAST取込</a><a href="holdings.html">HOLDINGS</a></div></div></section></header><main class="w"><section class="grid2"><div class="card"><h2>本日の結論</h2><div id="stance" style="font-size:28px;font-weight:950">—</div><div id="macro" class="status"></div></div><div class="card"><h2>業種・テーマ</h2><div class="muted" style="font-size:10px;margin-bottom:5px">強い</div><div id="hot" class="pillrow"></div><div class="muted" style="font-size:10px;margin:9px 0 5px">弱い</div><div id="cold" class="pillrow"></div></div></section><section class="card"><h2>保有銘柄レビュー</h2><div id="holdings"></div></section><section class="grid2"><div class="card"><h2>デイトレ候補</h2><div id="day"></div></div><div class="card"><h2>スイング候補</h2><div id="swing"></div></div></section><section class="card"><h2>本日のリスク計画</h2><pre id="risk" style="white-space:pre-wrap;font-family:inherit;font-size:11px;color:#cbd8e8"></pre></section><section class="card"><h2>出典</h2><div id="sources"></div></section></main><script>function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function cand(c,type){return `<div class="candidate"><div><span class="rank">${esc(c.rank)}</span><span class="name">${esc(c.name)} (${esc(c.code)})</span></div><div class="meta">${esc(c.sector||'')} / 上昇確率 ${esc(c.probability??'—')}% / 確信度 ${esc(c.confidence||'—')}</div><div class="cond"><b>材料：</b>${esc(Array.isArray(c.catalyst)?c.catalyst.join(' / '):(c.catalyst||'—'))}</div><div class="cond"><b>買い条件：</b>${esc(c.entryCondition||'—')}</div><div class="cond"><b>見送り：</b>${esc(c.skipCondition||c.invalidCondition||'—')}</div>${type==='day'?`<div class="cond"><b>9:00〜9:10：</b>${esc(Array.isArray(c.morningCheck)?c.morningCheck.join(' / '):(c.morningCheck||'—'))}</div>`:`<div class="cond"><b>保有想定：</b>${esc(c.holdingPeriod||'—')}</div>`}</div>`}async function load(){try{const r=await fetch('data/latest-strategy.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();asof.textContent=d.date?`${d.date} 6:30戦略`:'初回6:30実行待ち';stance.textContent=d.marketStance||'未更新';macro.textContent=typeof d.macroSummary==='string'?d.macroSummary:JSON.stringify(d.macroSummary||'');hot.innerHTML=(d.hotSectors||[]).map(x=>`<span class="pill hot">${esc(typeof x==='string'?x:(x.name||JSON.stringify(x)))}</span>`).join('')||'<span class="muted">—</span>';cold.innerHTML=(d.coldSectors||[]).map(x=>`<span class="pill cold">${esc(typeof x==='string'?x:(x.name||JSON.stringify(x)))}</span>`).join('')||'<span class="muted">—</span>';holdings.innerHTML=(d.holdingsReview||[]).map(x=>`<div class="candidate"><div class="name">${esc(x.name||'')} (${esc(x.code||'')})</div><div class="cond">${esc(x.summary||x.action||JSON.stringify(x))}</div></div>`).join('')||'<div class="empty">保有レビュー未登録</div>';day.innerHTML=(d.daytradeCandidates||[]).map(x=>cand(x,'day')).join('')||'<div class="empty">候補なし</div>';swing.innerHTML=(d.swingCandidates||[]).map(x=>cand(x,'swing')).join('')||'<div class="empty">候補なし</div>';risk.textContent=typeof d.riskPlan==='string'?d.riskPlan:JSON.stringify(d.riskPlan||{},null,2);sources.innerHTML=(d.sources||[]).map(x=>`<div class="source">${esc(typeof x==='string'?x:(x.title||x.name||x.url||JSON.stringify(x)))}</div>`).join('')||'<div class="muted">—</div>'}catch(e){asof.textContent='読み込み失敗';document.querySelector('main').innerHTML=`<div class="card"><div class="empty">${esc(e.message)}<br>初回6:30タスク実行後に最新戦略が表示されます。</div></div>`}}load();</script></body></html>
