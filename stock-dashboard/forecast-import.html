<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>朝戦略取込 | 投資ダッシュボード</title><style>:root{--bg:#07101d;--p:#0d1828;--line:#22324a;--t:#edf4ff;--m:#94a5bd;--c:#53d3ff;--g:#4dde9b;--r:#ff6b7a;--y:#ffd166}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#132845,#07101d 42%,#050b14);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}.w{width:min(760px,calc(100% - 20px));margin:auto}.card{margin-top:16px;background:var(--p);border:1px solid var(--line);border-radius:22px;padding:18px}.ey{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--c)}h1{margin:7px 0 8px}.muted{color:var(--m);font-size:11px}.status{margin:15px 0;padding:13px;border:1px solid var(--line);border-radius:14px;background:#0a1525}.btn{display:inline-block;border:1px solid var(--line);background:#111f32;color:var(--t);border-radius:11px;padding:10px 12px;font-weight:800;font-size:12px;text-decoration:none;margin-right:7px}.btn.primary{background:var(--c);border-color:var(--c);color:#04101b}.btn.green{background:var(--g);border-color:var(--g);color:#052017}.row{padding:9px 0;border-bottom:1px solid #1f3048}.row:last-child{border-bottom:0}.row b{display:block}.tag{display:inline-block;font-size:9px;font-weight:900;padding:3px 7px;border-radius:999px;background:#163449;color:#7de1ff;margin-right:5px}.tag.swing{background:#2b2348;color:#d2c4ff}.ok{color:var(--g)}.ng{color:var(--r)}</style></head><body><main class="w"><section class="card"><div class="ey">FORECAST SYNC</div><h1>GitHub朝戦略を取り込む</h1><div class="muted">6:30タスクがGitHubへ保存した latest-strategy.json をFORECASTへ登録します。同じ日付・区分・銘柄は重複登録しません。</div><div id="status" class="status">読み込み中…</div><div id="preview"></div><div style="margin-top:15px"><button id="importBtn" class="btn green" disabled>FORECASTへ取り込む</button><a class="btn" href="forecast.html">FORECASTを見る</a><a class="btn" href="hub.html">HUBへ戻る</a></div></section></main><script>const KEY='jp-stock-forecast-v1';let latest=null;const status=document.getElementById('status'),preview=document.getElementById('preview'),btn=document.getElementById('importBtn');function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function normalizeCandidate(c,type,date){return{id:'gh-'+date+'-'+type+'-'+c.code,date,type,rank:Number(c.rank)||1,code:String(c.code||''),name:c.name||'',sector:c.sector||'',prob:Number(c.probability)||0,conf:c.confidence||'中',catalyst:Array.isArray(c.catalyst)?c.catalyst.join(' / '):(c.catalyst||''),cond:[c.entryCondition,c.skipCondition].filter(Boolean).join(' / '),high:c.actualHighPct??'',close:c.actualClosePct??'',taken:c.tradeTaken?'yes':'no',pnl:c.realizedPnl??'',note:c.reviewNote||''}}async function load(){try{const r=await fetch('data/latest-strategy.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);latest=await r.json();const day=latest.daytradeCandidates||[],sw=latest.swingCandidates||[];status.innerHTML=`<span class="ok">取得成功</span><br>日付: ${esc(latest.date||'—')} / デイトレ ${day.length}件 / スイング ${sw.length}件`;preview.innerHTML=[...day.map(x=>({x,t:'day'})),...sw.map(x=>({x,t:'swing'}))].map(o=>`<div class="row"><span class="tag ${o.t==='swing'?'swing':''}">${o.t==='swing'?'SWING':'DAY'}</span><b>${esc(o.x.rank)}位 ${esc(o.x.name)} (${esc(o.x.code)})</b><span class="muted">${esc(o.x.sector||'')} / 上昇確率 ${esc(o.x.probability??'—')}%</span></div>`).join('')||'<div class="muted">候補なし</div>';btn.disabled=false}catch(e){status.innerHTML=`<span class="ng">まだ朝戦略データを取得できません。</span><br><span class="muted">初回6:30タスク実行後に利用可能になります。(${esc(e.message)})</span>`}}btn.onclick=()=>{if(!latest)return;let rows=[];try{rows=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}const date=latest.date||new Date().toISOString().slice(0,10),incoming=[...(latest.daytradeCandidates||[]).map(c=>normalizeCandidate(c,'day',date)),...(latest.swingCandidates||[]).map(c=>normalizeCandidate(c,'swing',date))];let added=0;incoming.forEach(x=>{const exists=rows.some(r=>r.date===x.date&&r.type===x.type&&String(r.code)===String(x.code));if(!exists){rows.push(x);added++}});localStorage.setItem(KEY,JSON.stringify(rows));status.innerHTML=`<span class="ok">${added}件をFORECASTへ追加しました。</span><br><span class="muted">重複候補はスキップしています。</span>`};load();</script></body></html>
