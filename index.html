<!doctype html>
<html lang="ja">
<head>

  <style>
    :root{--bg:#f7f3ec;--paper:#fffdf9;--ink:#20231f;--muted:#6d716b;--line:#e5dfd5;--green:#2f6b4f;--green2:#e5f1e9;--orange:#a65d28;--orange2:#f6e8dc;--blue:#345f83;--blue2:#e5eef5;--shadow:0 12px 32px rgba(46,39,28,.08);--radius:22px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif;line-height:1.55}button,input,select{font:inherit}.wrap{width:min(1180px,calc(100% - 28px));margin:auto}
    header{padding:28px 0 18px}.hero{background:linear-gradient(135deg,#fffdf9 0%,#f2eee3 100%);border:1px solid var(--line);border-radius:28px;padding:28px;box-shadow:var(--shadow);position:relative;overflow:hidden}.hero:after{content:"☕";position:absolute;right:22px;top:4px;font-size:86px;opacity:.09}.eyebrow{font-size:13px;font-weight:800;color:var(--green);letter-spacing:.08em}.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.08;margin:8px 0 10px}.hero p{margin:0;max-width:760px;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}.stat{background:rgba(255,255,255,.78);border:1px solid var(--line);padding:13px 14px;border-radius:16px}.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}.notice{margin:14px 0 0;font-size:12px;color:var(--muted)}
    .panel{position:sticky;top:0;z-index:20;background:rgba(247,243,236,.94);backdrop-filter:blur(12px);padding:10px 0}.filters{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 8px 20px rgba(46,39,28,.05)}.search{display:flex;gap:8px}.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}.favToggle{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:14px;padding:0 13px}.favToggle.active{background:#fff0f0;border-color:#eac5c5}.filterRow{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:9px}.filterRow select{width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 11px}
    .resultHead{display:flex;justify-content:space-between;align-items:end;margin:22px 2px 12px}.resultHead h2{margin:0;font-size:21px}.resultHead small{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding-bottom:40px}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:0 7px 18px rgba(46,39,28,.045);display:flex;flex-direction:column;gap:13px}.cardTop{display:flex;justify-content:space-between;gap:10px}.name{font-size:20px;font-weight:850}.code{font-size:12px;color:var(--muted)}.heart{border:0;background:transparent;font-size:23px;color:#b3aaa0}.heart.on{color:#d65b66}.tags{display:flex;flex-wrap:wrap;gap:6px}.tag{border-radius:999px;padding:4px 8px;font-size:11px;font-weight:750;background:#eee}.tag.cafe{background:var(--orange2);color:var(--orange)}.tag.restaurant{background:var(--green2);color:var(--green)}.tag.food{background:var(--blue2);color:var(--blue)}.tag.budget{background:#f2eee5;color:#71654d}.tag.long{background:#fff3cd;color:#7d6419}.money{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{padding:11px 12px;border-radius:14px;background:#f5f2eb}.metric span{display:block;font-size:11px;color:var(--muted)}.metric b{font-size:19px}.metric small{color:var(--muted)}.rights{border:1px solid var(--line);border-radius:14px;padding:11px 12px}.rights .title{font-size:11px;color:var(--muted);font-weight:700}.months{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.month{background:#242a25;color:white;padding:4px 8px;border-radius:8px;font-weight:800;font-size:12px}.next{margin-top:7px;font-size:12px;color:var(--green);font-weight:750}.benefit{font-size:14px}.benefit strong{display:block;margin-bottom:3px}.benefit ul{padding-left:19px;margin:6px 0 0}.condition{font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}.source{margin-top:auto;display:flex;justify-content:space-between;gap:10px}.source a{font-size:12px;color:var(--blue);font-weight:700;text-decoration:none}.updated{font-size:10px;color:var(--muted)}.empty{grid-column:1/-1;text-align:center;padding:50px 15px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:20px}footer{padding:8px 0 42px;color:var(--muted);font-size:12px}.footbox{border-top:1px solid var(--line);padding-top:18px}
    @media(max-width:760px){.wrap{width:min(100% - 20px,1180px)}header{padding-top:14px}.hero{padding:21px 18px}.stats{grid-template-columns:1fr 1fr 1fr}.filterRow{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.card{padding:16px}}
    @media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.name{font-size:18px}.metric b{font-size:17px}}
  </style>
</head>
<body>
<header class="wrap"><section class="hero"><div class="eyebrow">FAMILY SHARE · 2026</div><h1>株主優待ナビ</h1><p>カフェ・外食・食品系を中心に、必要株数・参考株価・最低投資額・権利月・長期保有条件をまとめて比較できます。</p><div class="stats"><div class="stat"><b id="statCount">—</b><span>掲載企業</span></div><div class="stat"><b id="statUnder">—</b><span>50万円以内</span></div><div class="stat"><b>8/21</b><span>株価基準日</span></div></div><div class="notice">※ 株価は2026年8月21日終値ベースの参考値。優待制度は変更・廃止される場合があります。</div></section></header>
<div class="panel"><div class="wrap filters"><div class="search"><input id="q" type="search" placeholder="会社名・証券コード・優待内容で検索"><button id="favToggle" class="favToggle" type="button">♡ 候補</button></div><div class="filterRow"><select id="category"><option value="all">全カテゴリ</option><option value="カフェ">カフェ</option><option value="外食">外食</option><option value="食品">食品</option></select><select id="month"><option value="all">全権利月</option><option value="2">2月</option><option value="3">3月</option><option value="4">4月</option><option value="6">6月</option><option value="8">8月</option><option value="9">9月</option><option value="10">10月</option><option value="11">11月</option><option value="12">12月</option></select><select id="budget"><option value="all">予算指定なし</option><option value="100000">10万円以内</option><option value="200000">20万円以内</option><option value="300000">30万円以内</option><option value="500000">50万円以内</option><option value="1000000">100万円以内</option></select><select id="sort"><option value="next">次の権利日順</option><option value="investment">最低投資額が安い順</option><option value="price">株価が安い順</option><option value="name">会社名順</option></select></div></div></div>
<main class="wrap"><div class="resultHead"><h2>優待一覧</h2><small id="resultCount"></small></div><div id="grid" class="grid"></div></main>
<footer class="wrap"><div class="footbox"><b>ご利用上の注意</b><br>本ページは家族内での比較・情報整理を目的とした参考資料です。投資判断を勧誘するものではありません。購入前に企業公式IR・証券会社の最新情報をご確認ください。</div></footer>

{code:'3387',name:'クリエイト・レストランツHD',category:'外食',price:783,minShares:100,rights:[2,8],next:'2026-08-27',benefits:['100株：1,500円分','200株：3,000円分、300株：4,000円分','400株：5,000円分、500株：6,000円分'],longTerm:'800株以上などは1年以上保有で追加優待あり。',source:'https://finance.yahoo.co.jp/quote/3387.T/incentive'},
{code:'3397',name:'トリドールホールディングス',category:'外食',price:4355,minShares:100,rights:[3,9],next:'2026-09-28',benefits:['100株：3,000円分','200株：4,000円分','1,000株：10,000円分','丸亀製麺などで利用可'],longTerm:'200株以上を1年以上継続保有で3,000円分追加。',source:'https://finance.yahoo.co.jp/quote/3397.T/incentive'},
{code:'3097',name:'物語コーポレーション',category:'外食',price:5670,minShares:100,rights:[6,12],next:'2026-12-28',benefits:['100株以上：3,500円分の電子チケット（年2回）','焼肉きんぐ・丸源ラーメンなどで利用可'],longTerm:'6か月以上の継続保有が必要。',source:'https://finance.yahoo.co.jp/quote/3097.T/incentive'},
{code:'3196',name:'ホットランドホールディングス',category:'外食',price:1680,minShares:100,rights:[6,12],next:'2026-12-28',benefits:['100株：1,500円分（年3,000円分）','500株：7,500円分','1,000株：15,000円分','築地銀だこ等で利用可'],longTerm:'長期保有条件なし。',source:'https://finance.yahoo.co.jp/quote/3196.T/incentive'},
{code:'9887',name:'松屋フーズホールディングス',category:'外食',price:5130,minShares:100,rights:[3],next:'2027-03-29',benefits:['100株を1年以上：優待食事券10枚','3年以上：12枚','松屋・松のや等の対象店舗で利用可'],longTerm:'1年以上の継続保有が必要。',source:'https://finance.yahoo.co.jp/quote/9887.T/incentive'},
{code:'2809',name:'キユーピー',category:'食品',price:4779,minShares:100,rights:[11],next:'2026-11-26',benefits:['100株・6か月以上：1,000円相当の自社商品','100株・3年以上：1,500円相当','500株・6か月以上：3,000円相当'],longTerm:'6か月以上の継続保有が必要。3年以上で増額。',source:'https://finance.yahoo.co.jp/quote/2809.T/incentive'},
{code:'2811',name:'カゴメ',category:'食品',price:2701,minShares:100,rights:[6],next:'2027-06-28',benefits:['100株：2,000円相当の自社商品','1,000株：6,000円相当','10年以上保有で記念品（1回）'],longTerm:'6か月以上の継続保有が必要。',source:'https://finance.yahoo.co.jp/quote/2811.T/incentive'},
{code:'2269',name:'明治ホールディングス',category:'食品',price:4351,minShares:100,rights:[3],next:'2027-03-29',benefits:['100株：1,500円相当','200株：2,500円相当','1,000株：5,500円相当のグループ商品'],longTerm:'3年以上保有で長期保有株主向け感謝BOXあり。',source:'https://finance.yahoo.co.jp/quote/2269.T/incentive'},
{code:'2810',name:'ハウス食品グループ本社',category:'食品',price:3766,minShares:100,rights:[3,9],next:'2026-09-28',benefits:['100株：1,000円相当','200株：2,000円相当','1,000株：3,000円相当','グループ商品または寄付を選択'],longTerm:'6か月以上の継続保有が必要。',source:'https://finance.yahoo.co.jp/quote/2810.T/incentive'}
];
const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(n);const cls=c=>c==='カフェ'?'cafe':c==='外食'?'restaurant':'food';const minInv=s=>Math.round(s.price*s.minShares);const favorites=new Set(JSON.parse(localStorage.getItem('yutaiFavorites')||'[]'));let favOnly=false;function saveFav(){localStorage.setItem('yutaiFavorites',JSON.stringify([...favorites]));}
function card(s){const invest=minInv(s);const longFlag=/必要|以上保有|継続保有/.test(s.longTerm);return `<article class="card"><div class="cardTop"><div><div class="name">${s.name}</div><div class="code">証券コード ${s.code}</div></div><button class="heart ${favorites.has(s.code)?'on':''}" data-code="${s.code}">${favorites.has(s.code)?'♥':'♡'}</button></div><div class="tags"><span class="tag ${cls(s.category)}">${s.category}</span>${invest<=500000?'<span class="tag budget">50万円以内</span>':''}${longFlag?'<span class="tag long">長期条件あり</span>':''}</div><div class="money"><div class="metric"><span>参考株価</span><b>${yen(s.price)}</b><small> / 株</small></div><div class="metric"><span>最低投資額</span><b>${yen(invest)}</b><small>（${s.minShares}株）</small></div></div><div class="rights"><div class="title">権利月</div><div class="months">${s.rights.map(m=>`<span class="month">${m}月</span>`).join('')}</div><div class="next">次の権利付最終日：${s.next.replaceAll('-','/')}</div></div><div class="benefit"><strong>主な優待</strong><ul>${s.benefits.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="condition"><b>保有条件：</b>${s.longTerm}</div><div class="source"><a href="${s.source}" target="_blank" rel="noopener">優待・株価情報を確認 ↗</a><span class="updated">株価 2026/8/21</span></div></article>`;}
function render(){const q=document.getElementById('q').value.trim().toLowerCase(),c=document.getElementById('category').value,m=document.getElementById('month').value,b=document.getElementById('budget').value,sort=document.getElementById('sort').value;let list=stocks.filter(s=>{const text=[s.name,s.code,s.category,...s.benefits,s.longTerm].join(' ').toLowerCase();return(!q||text.includes(q))&&(c==='all'||s.category===c)&&(m==='all'||s.rights.includes(Number(m)))&&(b==='all'||minInv(s)<=Number(b))&&(!favOnly||favorites.has(s.code));});list.sort((a,z)=>sort==='investment'?minInv(a)-minInv(z):sort==='price'?a.price-z.price:sort==='name'?a.name.localeCompare(z.name,'ja'):a.next.localeCompare(z.next));document.getElementById('resultCount').textContent=`${list.length}社を表示`;document.getElementById('grid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">条件に合う銘柄がありません。</div>';document.querySelectorAll('.heart').forEach(btn=>btn.addEventListener('click',()=>{const code=btn.dataset.code;favorites.has(code)?favorites.delete(code):favorites.add(code);saveFav();render();}));}
['q','category','month','budget','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));document.getElementById('favToggle').addEventListener('click',e=>{favOnly=!favOnly;e.currentTarget.classList.toggle('active',favOnly);e.currentTarget.textContent=favOnly?'♥ 候補のみ':'♡ 候補';render();});document.getElementById('statCount').textContent=`${stocks.length}社`;document.getElementById('statUnder').textContent=`${stocks.filter(s=>minInv(s)<=500000).length}社`;render();
</script>
