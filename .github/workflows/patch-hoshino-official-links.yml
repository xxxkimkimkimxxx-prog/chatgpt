name: Patch Hoshino official links

on:
  push:
    paths:
      - '.github/workflows/patch-hoshino-official-links.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hoshino-official-links
  cancel-in-progress: false

jobs:
  patch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch official hotel links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('hoshino-resorts/index.html')
          s = p.read_text(encoding='utf-8')
          urls = {
            '星のや東京':'https://hoshinoresorts.com/ja/hotels/hoshinoyatokyo/',
            '星のや富士':'https://hoshinoresorts.com/ja/hotels/hoshinoyafuji/',
            '星のや軽井沢':'https://hoshinoresorts.com/ja/hotels/hoshinoyakaruizawa/',
            '星のや京都':'https://hoshinoresorts.com/ja/hotels/hoshinoyakyoto/',
            '星のや奈良監獄':'https://hoshinoresorts.com/ja/hotels/hoshinoyanarakangoku/',
            '星のや沖縄':'https://hoshinoresorts.com/ja/hotels/hoshinoyaokinawa/',
            '星のや竹富島':'https://hoshinoresorts.com/ja/hotels/hoshinoyataketomijima/',
            '星のやグーグァン':'https://hoshinoresorts.com/ja/hotels/hoshinoyaguguan/',
            '星のやバリ':'https://hoshinoresorts.com/ja/hotels/hoshinoyabali/',
            '界 ポロト':'https://hoshinoresorts.com/ja/hotels/kaiporoto/',
            '界 津軽':'https://hoshinoresorts.com/ja/hotels/kaitsugaru/',
            '界 秋保':'https://hoshinoresorts.com/ja/hotels/kaiakiu/',
            '界 蔵王':'https://hoshinoresorts.com/ja/hotels/kaizao/',
            '界 鬼怒川':'https://hoshinoresorts.com/ja/hotels/kaikinugawa/',
            '界 草津':'https://hoshinoresorts.com/ja/hotels/kaikusatsu/',
            '界 箱根':'https://hoshinoresorts.com/ja/hotels/kaihakone/',
            '界 仙石原':'https://hoshinoresorts.com/ja/hotels/kaisengokuhara/',
            '界 アンジン':'https://hoshinoresorts.com/ja/hotels/kaianjin/',
            '界 伊東':'https://hoshinoresorts.com/ja/hotels/kaiito/',
            '界 遠州':'https://hoshinoresorts.com/ja/hotels/kaienshu/',
            '界 アルプス':'https://hoshinoresorts.com/ja/hotels/kaialps/',
            '界 松本':'https://hoshinoresorts.com/ja/hotels/kaimatsumoto/',
            '界 奥飛騨':'https://hoshinoresorts.com/ja/hotels/kaiokuhida/',
            '界 加賀':'https://hoshinoresorts.com/ja/hotels/kaikaga/',
            '界 玉造':'https://hoshinoresorts.com/ja/hotels/kaitamatsukuri/',
            '界 出雲':'https://hoshinoresorts.com/ja/hotels/kaiizumo/',
            '界 宮島':'https://hoshinoresorts.com/ja/hotels/kaimiyajima/',
            '界 長門':'https://hoshinoresorts.com/ja/hotels/kainagato/',
            '界 別府':'https://hoshinoresorts.com/ja/hotels/kaibeppu/',
            '界 由布院':'https://hoshinoresorts.com/ja/hotels/kaiyufuin/',
            '界 阿蘇':'https://hoshinoresorts.com/ja/hotels/kaiaso/',
            '界 雲仙':'https://hoshinoresorts.com/ja/hotels/kaiunzen/',
            '界 霧島':'https://hoshinoresorts.com/ja/hotels/kaikirishima/',
            'リゾナーレトマム':'https://hoshinoresorts.com/ja/hotels/risonaretomamu/',
            'リゾナーレ那須':'https://hoshinoresorts.com/ja/hotels/risonarenasu/',
            'リゾナーレ八ヶ岳':'https://hoshinoresorts.com/ja/hotels/risonareyatsugatake/',
            'リゾナーレ熱海':'https://hoshinoresorts.com/ja/hotels/risonareatami/',
            'リゾナーレ大阪':'https://hoshinoresorts.com/ja/hotels/risonareosaka/',
            'リゾナーレ下関':'https://hoshinoresorts.com/ja/hotels/risonareshimonoseki/',
            'リゾナーレ小浜島':'https://hoshinoresorts.com/ja/hotels/risonarekohamajima/',
            'リゾナーレグアム':'https://hoshinoresorts.com/ja/hotels/risonareguam/',
            'OMO7旭川':'https://hoshinoresorts.com/ja/hotels/omo7asahikawa/',
            'OMO5小樽':'https://hoshinoresorts.com/ja/hotels/omo5otaru/',
            'OMO5函館':'https://hoshinoresorts.com/ja/hotels/omo5hakodate/',
            'OMO5東京大塚':'https://hoshinoresorts.com/ja/hotels/omo5tokyootsuka/',
            'OMO5東京五反田':'https://hoshinoresorts.com/ja/hotels/omo5tokyogotanda/',
            'OMO3浅草':'https://hoshinoresorts.com/ja/hotels/omo3asakusa/',
            'OMO3東京赤坂':'https://hoshinoresorts.com/ja/hotels/omo3tokyoakasaka/',
            'OMO7横浜':'https://hoshinoresorts.com/ja/hotels/omo7yokohama/',
            'OMO5横浜馬車道':'https://hoshinoresorts.com/ja/hotels/omo5yokohamabashamichi/',
            'OMO5金沢片町':'https://hoshinoresorts.com/ja/hotels/omo5kanazawakatamachi/',
            'OMO5京都祇園':'https://hoshinoresorts.com/ja/hotels/omo5kyotogion/',
            'OMO5京都三条':'https://hoshinoresorts.com/ja/hotels/omo5kyotosanjo/',
            'OMO3京都東寺':'https://hoshinoresorts.com/ja/hotels/omo3kyototoji/',
            'OMO7大阪':'https://hoshinoresorts.com/ja/hotels/omo7osaka/',
            'OMO関西空港':'https://hoshinoresorts.com/ja/hotels/omokansaiairport/',
            'OMO7高知':'https://hoshinoresorts.com/ja/hotels/omo7kochi/',
            'OMO5熊本':'https://hoshinoresorts.com/ja/hotels/omo5kumamoto/',
            'OMO5沖縄那覇':'https://hoshinoresorts.com/ja/hotels/omo5okinawanaha/',
            'BEB5土浦':'https://hoshinoresorts.com/ja/hotels/beb5tsuchiura/',
            'BEB5軽井沢':'https://hoshinoresorts.com/ja/hotels/beb5karuizawa/',
            'BEB5門司港':'https://hoshinoresorts.com/ja/hotels/beb5mojiko/',
            'BEB5沖縄瀬良垣':'https://hoshinoresorts.com/ja/hotels/beb5okinawaseragaki/',
            'LUCY尾瀬鳩待':'https://hoshinoresorts.com/ja/hotels/lucyozehatomachi/',
            'トマム ザ・タワー':'https://hoshinoresorts.com/ja/hotels/tomamuthetower/',
            '青森屋':'https://hoshinoresorts.com/ja/hotels/aomoriya/',
            '奥入瀬渓流ホテル':'https://hoshinoresorts.com/ja/hotels/oirasekeiryu/',
            '磐梯山温泉ホテル':'https://hoshinoresorts.com/ja/hotels/bandai/',
            'ホテルブレストンコート':'https://www.blestoncourt.com/',
            '1955 東京ベイ':'https://hoshinoresorts.com/ja/hotels/1955tokyobay/',
            '西表島ホテル':'https://hoshinoresorts.com/ja/hotels/iriomote/',
            '嘉助天台':'https://www.kasuketiantai.com/',
            'サーフジャック ハワイ':'https://hoshinoresorts.com/ja/hotels/surfjack/'
          }

          m = re.search(r'const hotels=(\[.*?\]);\n  const brandOrder=', s, re.S)
          if not m:
              raise SystemExit('hotels data not found')
          hotels = json.loads(m.group(1))
          missing = [h['name'] for h in hotels if h['name'] not in urls]
          if missing:
              raise SystemExit('missing URLs: ' + ', '.join(missing))
          for h in hotels:
              h['url'] = urls[h['name']]
          new_json = json.dumps(hotels, ensure_ascii=False, separators=(',', ':'))
          s = s[:m.start(1)] + new_json + s[m.end(1):]

          css_needle = '#hrnav .detailBtn{margin-top:10px;width:100%;min-height:40px;border:0;border-top:1px solid light-dark(#e4ddd2,#2d3935);background:transparent;color:light-dark(#476252,#b8d1c0);font-weight:800;cursor:pointer}\n'
          css_add = '#hrnav .cardActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} #hrnav .officialBtn{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:11px;border:1px solid light-dark(#93a88f,#637b69);background:light-dark(#edf4ee,#213129);color:light-dark(#315442,#d4e8d9);font-weight:850;font-size:12px;text-decoration:none;padding:8px 10px} #hrnav .officialBtn:hover{text-decoration:underline} #hrnav .cardActions .detailBtn{margin-top:0;border:1px solid light-dark(#ded7cb,#34413d);border-radius:11px;min-height:42px;padding:8px 10px}\n'
          if '.officialBtn{' not in s:
              if css_needle not in s:
                  raise SystemExit('detail css marker not found')
              s = s.replace(css_needle, css_needle + css_add, 1)

          old = '      <button type="button" class="detailBtn" data-detail="${key}">用途・目的を見る ＋</button>\n'
          new = '      <div class="cardActions"><a class="officialBtn" href="${esc(h.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(h.name)}の公式サイトを開く">公式サイトを見る ↗</a><button type="button" class="detailBtn" data-detail="${key}">用途・目的を見る ＋</button></div>\n'
          if 'class="cardActions"' not in s:
              if old not in s:
                  raise SystemExit('card marker not found')
              s = s.replace(old, new, 1)

          old_row = "      row('旅の目的',h=>h.purposes.map(esc).join(' / '))+row('子連れ',h=>`${h.family} / 5`)+row('カップル',h=>`${h.couple} / 5`)+row('ひとり',h=>`${h.solo} / 5`)+row('アクティブ',h=>`${h.active} / 5`)+row('車なし',h=>h.carless?'向き':'要確認');"
          new_row = "      row('旅の目的',h=>h.purposes.map(esc).join(' / '))+row('子連れ',h=>`${h.family} / 5`)+row('カップル',h=>`${h.couple} / 5`)+row('ひとり',h=>`${h.solo} / 5`)+row('アクティブ',h=>`${h.active} / 5`)+row('車なし',h=>h.carless?'向き':'要確認')+row('公式サイト',h=>`<a href=\"${esc(h.url)}\" target=\"_blank\" rel=\"noopener noreferrer\">公式ページ ↗</a>`);"
          if "row('公式サイト'" not in s:
              if old_row not in s:
                  raise SystemExit('compare marker not found')
              s = s.replace(old_row, new_row, 1)

          mobile_old = '@media(max-width:380px){#hrnav .filterGrid{grid-template-columns:1fr} #hrnav .heroStats{grid-template-columns:1fr 1fr 1fr}}\n'
          mobile_new = '@media(max-width:380px){#hrnav .filterGrid{grid-template-columns:1fr} #hrnav .heroStats{grid-template-columns:1fr 1fr 1fr} #hrnav .cardActions{grid-template-columns:1fr}}\n'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)

          p.write_text(s, encoding='utf-8')
          print(f'Patched {len(hotels)} hotel links')
          PY

      - name: Commit patched site
        shell: bash
        run: |
          if git diff --quiet -- hoshino-resorts/index.html; then
            echo 'No site changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hoshino-resorts/index.html
          git commit -m 'Add official links to Hoshino Resorts cards'
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
