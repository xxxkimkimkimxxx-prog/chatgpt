name: Update Japan low-price stock snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * 1-5" # 15:40 JST on weekdays
  push:
    branches: ["main"]
    paths:
      - "stock-dashboard/low-price-map/update_data.py"
      - "stock-dashboard/low-price-map/export_compact.py"
      - "stock-dashboard/low-price-map/rank_multibagger.py"
      - ".github/workflows/update-low-price-stocks.yml"

permissions:
  contents: write

concurrency:
  group: "low-price-stock-refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest Japan stock snapshot
        run: |
          python stock-dashboard/low-price-map/update_data.py
          python stock-dashboard/low-price-map/export_compact.py
          python stock-dashboard/low-price-map/rank_multibagger.py

      - name: Validate output
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('stock-dashboard/low-price-map/data.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          stocks = data.get('stocks', [])
          assert stocks, 'No stocks found'
          assert all(0 < float(x['price']) <= 300.0001 for x in stocks), 'Price condition failed'
          assert len({x['symbol'] for x in stocks}) == len(stocks), 'Duplicate symbols found'
          compact = Path('stock-dashboard/low-price-map/compact.tsv').read_text(encoding='utf-8').splitlines()
          assert len(compact) == len(stocks) + 1, 'Compact export row count failed'
          insights = json.loads(Path('stock-dashboard/low-price-map/insights.json').read_text(encoding='utf-8'))
          assert insights['counts']['total'] == len(stocks), 'Insights count failed'
          rank = json.loads(Path('stock-dashboard/low-price-map/multibagger_rank.json').read_text(encoding='utf-8'))
          assert len(rank['top20_quant']) == 20, 'Rank top20 failed'
          top20 = Path('stock-dashboard/low-price-map/multibagger_top20.tsv').read_text(encoding='utf-8').splitlines()
          assert len(top20) == 21, 'Top20 compact export failed'
          print('validated:', len(stocks), 'stocks')
          PY

      - name: Commit snapshot if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stock-dashboard/low-price-map/data.json stock-dashboard/low-price-map/compact.tsv stock-dashboard/low-price-map/insights.json stock-dashboard/low-price-map/multibagger_rank.json stock-dashboard/low-price-map/multibagger_top20.tsv
          if git diff --cached --quiet; then
            echo "No snapshot change"
            exit 0
          fi
          git commit -m "Update low-price Japan stock snapshot"
          git push
