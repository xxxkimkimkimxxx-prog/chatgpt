name: Patch Hoshino official links v2

on:
  push:
    paths:
      - '.github/workflows/patch-hoshino-official-links-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: hoshino-official-links-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Sync latest main
        shell: bash
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Patch official hotel links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, json

          p = Path('hoshino-resorts/index.html')
          s = p.read_text(encoding='utf-8')
          official_urls = [
            'https://hoshinoresorts.com/ja/hotels/hoshinoyatokyo/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyafuji/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyakaruizawa/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyakyoto/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyanarakangoku/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyaokinawa/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyataketomijima/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyaguguan/',
            'https://hoshinoresorts.com/ja/hotels/hoshinoyabali/',
            'https://hoshinoresorts.com/ja/hotels/kaiporoto/',
            'https://hoshinoresorts.com/ja/hotels/kaitsugaru/',
            'https://hoshinoresorts.com/ja/hotels/kaiakiu/',
            'https://hoshinoresorts.com/ja/hotels/kaizao/',
            'https://hoshinoresorts.com/ja/hotels/kaikinugawa/',
            'https://hoshinoresorts.com/ja/hotels/kaikusatsu/',
            'https://hoshinoresorts.com/ja/hotels/kaihakone/',
            'https://hoshinoresorts.com/ja/hotels/kaisengokuhara/',
            'https://hoshinoresorts.com/ja/hotels/kaianjin/',
            'https://hoshinoresorts.com/ja/hotels/kaiito/',
            'https://hoshinoresorts.com/ja/hotels/kaienshu/',
            'https://hoshinoresorts.com/ja/hotels/kaialps/',
            'https://hoshinoresorts.com/ja/hotels/kaimatsumoto/',
            'https://hoshinoresorts.com/ja/hotels/kaiokuhida/',
            'https://hoshinoresorts.com/ja/hotels/kaikaga/',
            'https://hoshinoresorts.com/ja/hotels/kaitamatsukuri/',
            'https://hoshinoresorts.com/ja/hotels/kaiizumo/',
            'https://hoshinoresorts.com/ja/hotels/kaimiyajima/',
            'https://hoshinoresorts.com/ja/hotels/kainagato/',
            'https://hoshinoresorts.com/ja/hotels/kaibeppu/',
            'https://hoshinoresorts.com/ja/hotels/kaiyufuin/',
            'https://hoshinoresorts.com/ja/hotels/kaiaso/',
            'https://hoshinoresorts.com/ja/hotels/kaiunzen/',
            'https://hoshinoresorts.com/ja/hotels/kaikirishima/',
            'https://hoshinoresorts.com/ja/hotels/risonaretomamu/',
            'https://hoshinoresorts.com/ja/hotels/risonarenasu/',
            'https://hoshinoresorts.com/ja/hotels/risonareyatsugatake/',
            'https://hoshinoresorts.com/ja/hotels/risonareatami/',
            'https://hoshinoresorts.com/ja/hotels/risonareosaka/',
            'https://hoshinoresorts.com/ja/hotels/risonareshimonoseki/',
            'https://hoshinoresorts.com/ja/hotels/risonarekohamajima/',
            'https://hoshinoresorts.com/ja/hotels/risonareguam/',
            'https://hoshinoresorts.com/ja/hotels/omo7asahikawa/',
            'https://hoshinoresorts.com/ja/hotels/omo5otaru/',
            'https://hoshinoresorts.com/ja/hotels/omo5hakodate/',
            'https://hoshinoresorts.com/ja/hotels/omo5tokyootsuka/',
            'https://hoshinoresorts.com/ja/hotels/omo5tokyogotanda/',
            'https://hoshinoresorts.com/ja/hotels/omo3asakusa/',
            'https://hoshinoresorts.com/ja/hotels/omo3tokyoakasaka/',
            'https://hoshinoresorts.com/ja/hotels/omo7yokohama/',
            'https://hoshinoresorts.com/ja/hotels/omo5yokohamabashamichi/',
            'https://hoshinoresorts.com/ja/hotels/omo5kanazawakatamachi/',
            'https://hoshinoresorts.com/ja/hotels/omo5kyotogion/',
            'https://hoshinoresorts.com/ja/hotels/omo5kyotosanjo/',
            'https://hoshinoresorts.com/ja/hotels/omo3kyototoji/',
            'https://hoshinoresorts.com/ja/hotels/omo7osaka/',
            'https://hoshinoresorts.com/ja/hotels/omokansaiairport/',
            'https://hoshinoresorts.com/ja/hotels/omo7kochi/',
            'https://hoshinoresorts.com/ja/hotels/omo5kumamoto/',
            'https://hoshinoresorts.com/ja/hotels/omo5okinawanaha/',
            'https://hoshinoresorts.com/ja/hotels/beb5tsuchiura/',
            'https://hoshinoresorts.com/ja/hotels/beb5karuizawa/',
            'https://hoshinoresorts.com/ja/hotels/beb5mojiko/',
            'https://hoshinoresorts.com/ja/hotels/beb5okinawaseragaki/',
            'https://hoshinoresorts.com/ja/hotels/lucyozehatomachi/',
            'https://hoshinoresorts.com/ja/hotels/tomamuthetower/',
            'https://hoshinoresorts.com/ja/hotels/aomoriya/',
            'https://hoshinoresorts.com/ja/hotels/oirasekeiryu/',
            'https://hoshinoresorts.com/ja/hotels/bandai/',
            'https://www.blestoncourt.com/',
            'https://hoshinoresorts.com/ja/hotels/1955tokyobay/',
            'https://hoshinoresorts.com/ja/hotels/iriomote/',
            'https://www.kasuketiantai.com/',
            'https://hoshinoresorts.com/ja/hotels/surfjack/'
          ]

          m = re.search(r'const hotels=(\[.*?\]);\n  const brandOrder=', s, re.S)
          if not m:
              raise SystemExit('hotels data not found')
          hotels = json.loads(m.group(1))
          if len(hotels) != len(official_urls):
              raise SystemExit(f'hotel count mismatch: {len(hotels)} vs {len(official_urls)}')
          if hotels[0].get('name') != '星のや東京' or hotels[-1].get('name') != 'サーフジャック ハワイ':
              raise SystemExit('hotel order changed; refusing positional URL patch')
          for h, url in zip(hotels, official_urls):
              h['url'] = url
          new_json = json.dumps(hotels, ensure_ascii=False, separators=(',', ':'))
          s = s[:m.start(1)] + new_json + s[m.end(1):]

          css_needle = '#hrnav .detailBtn{margin-top:10px;width:100%;min-height:40px;border:0;border-top:1px solid light-dark(#e4ddd2,#2d3935);background:transparent;color:light-dark(#476252,#b8d1c0);font-weight:800;cursor:pointer}\n'
          css_add = '#hrnav .cardActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px} #hrnav .officialBtn{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:11px;border:1px solid light-dark(#93a88f,#637b69);background:light-dark(#edf4ee,#213129);color:light-dark(#315442,#d4e8d9);font-weight:850;font-size:12px;text-decoration:none;padding:8px 10px} #hrnav .officialBtn:hover{text-decoration:underline} #hrnav .cardActions .detailBtn{margin-top:0;border:1px solid light-dark(#ded7cb,#34413d);border-radius:11px;min-height:42px;padding:8px 10px}\n'
          if '.officialBtn{' not in s:
              if css_needle not in s:
                  raise SystemExit('detail css marker not found')
              s = s.replace(css_needle, css_needle + css_add, 1)

          old = '      <button type="button" class="detailBtn" data-detail="${key}">用途・目的を見る ＋</button>\n'
          new = '      <div class="cardActions"><a class="officialBtn" href="${esc(h.url)}" target="_blank" rel="noopener noreferrer" aria-label="${esc(h.name)}の公式サイトを開く">公式サイトを見る ↗</a><button type="button" class="detailBtn" data-detail="${key}">用途・目的を見る ＋</button></div>\n'
          if 'class="cardActions"' not in s:
              if old not in s:
                  raise SystemExit('card marker not found')
              s = s.replace(old, new, 1)

          old_row = "      row('旅の目的',h=>h.purposes.map(esc).join(' / '))+row('子連れ',h=>`${h.family} / 5`)+row('カップル',h=>`${h.couple} / 5`)+row('ひとり',h=>`${h.solo} / 5`)+row('アクティブ',h=>`${h.active} / 5`)+row('車なし',h=>h.carless?'向き':'要確認');"
          new_row = "      row('旅の目的',h=>h.purposes.map(esc).join(' / '))+row('子連れ',h=>`${h.family} / 5`)+row('カップル',h=>`${h.couple} / 5`)+row('ひとり',h=>`${h.solo} / 5`)+row('アクティブ',h=>`${h.active} / 5`)+row('車なし',h=>h.carless?'向き':'要確認')+row('公式サイト',h=>`<a href=\"${esc(h.url)}\" target=\"_blank\" rel=\"noopener noreferrer\">公式ページ ↗</a>`);"
          if "row('公式サイト'" not in s:
              if old_row not in s:
                  raise SystemExit('compare marker not found')
              s = s.replace(old_row, new_row, 1)

          mobile_old = '@media(max-width:380px){#hrnav .filterGrid{grid-template-columns:1fr} #hrnav .heroStats{grid-template-columns:1fr 1fr 1fr}}\n'
          mobile_new = '@media(max-width:380px){#hrnav .filterGrid{grid-template-columns:1fr} #hrnav .heroStats{grid-template-columns:1fr 1fr 1fr} #hrnav .cardActions{grid-template-columns:1fr}}\n'
          if mobile_old in s:
              s = s.replace(mobile_old, mobile_new, 1)

          p.write_text(s, encoding='utf-8')
          print(f'Patched {len(hotels)} official links')
          PY

      - name: Commit and push with retry
        shell: bash
        run: |
          if git diff --quiet -- hoshino-resorts/index.html; then
            echo 'No site changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hoshino-resorts/index.html
          git commit -m 'Add official links to Hoshino Resorts cards'
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              exit 0
            fi
            echo "Push raced with another commit; rebasing (attempt ${attempt})"
            git pull --rebase origin main
          done
          echo 'Failed to push after retries.' >&2
          exit 1

  deploy:
    needs: patch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
      - name: Prepare verified local XLSX runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bank-reconciliation/vendor
          curl --fail --location --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js \
            --output bank-reconciliation/vendor/xlsx.full.min.js
          echo 'af6da00a10e71af072964f74fb67bfc9caf7455ac38bc0c83a420636126529fbb240ce2d211008d3ad8c695f2c7e340a6151a338169904e03cef3f8885913d0c  bank-reconciliation/vendor/xlsx.full.min.js' | sha512sum --check --strict
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
