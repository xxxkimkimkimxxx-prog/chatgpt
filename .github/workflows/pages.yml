name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "stock-dashboard/data/live-quotes.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify FUFU map version
        shell: bash
        run: |
          set -euo pipefail
          grep -q "ふふ MAP" fufu-resorts/index.html
          grep -q "leaflet" fufu-resorts/index.html
          echo "FUFU map source found"

      - name: Attach Hoshino comparison enhancements
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('hoshino-resorts/index.html')
          if not p.exists():
              raise SystemExit(0)
          s = p.read_text(encoding='utf-8')
          tags = [
              '<script src="./enhancements-v2.js?v=20260824-4"></script>',
              '<script src="./cleanup-v3.js?v=20260824-5"></script>',
          ]
          for tag in tags:
              if tag not in s:
                  s = s.replace('</body>', tag + '\n</body>')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Prepare verified local XLSX runtime
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bank-reconciliation/vendor
          curl --fail --location --silent --show-error \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js \
            --output bank-reconciliation/vendor/xlsx.full.min.js
          echo "af6da00a10e71af072964f74fb67bfc9caf7455ac38bc0c83a420636126529fbb240ce2d211008d3ad8c695f2c7e340a6151a338169904e03cef3f8885913d0c  bank-reconciliation/vendor/xlsx.full.min.js" | sha512sum --check --strict

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
