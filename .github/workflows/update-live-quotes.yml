name: Update live stock quotes

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/update-live-quotes.yml"
      - "stock-dashboard/data/holdings.json"
  schedule:
    - cron: "*/5 0-6 * * 1-5"

permissions:
  contents: write

concurrency:
  group: live-stock-quotes
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest quotes
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          JST = ZoneInfo('Asia/Tokyo')
          holdings_path = Path('stock-dashboard/data/holdings.json')
          output_path = Path('stock-dashboard/data/live-quotes.json')
          holdings = json.loads(holdings_path.read_text(encoding='utf-8'))

          old = {}
          if output_path.exists():
              try:
                  old = json.loads(output_path.read_text(encoding='utf-8'))
              except Exception:
                  old = {}
          old_quotes = old.get('quotes', {}) if isinstance(old, dict) else {}

          def num(v):
              return None if v is None else float(v)

          def fmt_epoch(ts):
              if not ts:
                  return None
              return datetime.fromtimestamp(int(ts), JST).strftime('%Y-%m-%d %H:%M:%S JST')

          def aggregate_5m(timestamps, opens, highs, lows, closes, volumes):
              buckets = {}
              for i, ts in enumerate(timestamps or []):
                  vals = []
                  for arr in (opens, highs, lows, closes):
                      vals.append(arr[i] if i < len(arr) else None)
                  o, h, l, c = vals
                  if c is None:
                      continue
                  dt = datetime.fromtimestamp(int(ts), JST)
                  minute = (dt.minute // 5) * 5
                  bucket_dt = dt.replace(minute=minute, second=0, microsecond=0)
                  key = int(bucket_dt.timestamp())
                  v = volumes[i] if i < len(volumes) and volumes[i] is not None else 0
                  if key not in buckets:
                      buckets[key] = {
                          't': key,
                          'time': bucket_dt.strftime('%H:%M'),
                          'open': num(o if o is not None else c),
                          'high': num(h if h is not None else c),
                          'low': num(l if l is not None else c),
                          'close': num(c),
                          'volume': int(v or 0),
                      }
                  else:
                      b = buckets[key]
                      b['high'] = max(b['high'], float(h if h is not None else c))
                      b['low'] = min(b['low'], float(l if l is not None else c))
                      b['close'] = num(c)
                      b['volume'] += int(v or 0)
              return [buckets[k] for k in sorted(buckets)]

          quotes = {}
          observed_epochs = []
          ua = 'Mozilla/5.0 (compatible; stock-dashboard/1.0)'

          for p in holdings.get('positions', []):
              code = str(p.get('code', '')).strip()
              if not code:
                  continue
              symbol = f'{code}.T'
              url = f'https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1m&range=1d&includePrePost=false'
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': ua, 'Accept': 'application/json'})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      payload = json.load(r)
                  result = payload.get('chart', {}).get('result', [None])[0]
                  if not result:
                      raise RuntimeError('no result')
                  meta = result.get('meta', {})
                  q = (result.get('indicators', {}).get('quote') or [{}])[0]

                  timestamps = result.get('timestamp') or []
                  raw_open = q.get('open') or []
                  raw_high = q.get('high') or []
                  raw_low = q.get('low') or []
                  raw_close = q.get('close') or []
                  raw_vol = q.get('volume') or []

                  closes = [v for v in raw_close if v is not None]
                  opens = [v for v in raw_open if v is not None]
                  highs = [v for v in raw_high if v is not None]
                  lows = [v for v in raw_low if v is not None]
                  vols = [v for v in raw_vol if v is not None]
                  series5m = aggregate_5m(timestamps, raw_open, raw_high, raw_low, raw_close, raw_vol)

                  price = meta.get('regularMarketPrice')
                  if price is None and closes:
                      price = closes[-1]
                  prev = meta.get('chartPreviousClose')
                  if prev is None:
                      prev = meta.get('previousClose')
                  ts = meta.get('regularMarketTime')
                  if ts:
                      observed_epochs.append(int(ts))

                  day_open = meta.get('regularMarketOpen')
                  if day_open is None and opens:
                      day_open = opens[0]
                  day_high = meta.get('regularMarketDayHigh')
                  if day_high is None and highs:
                      day_high = max(highs)
                  day_low = meta.get('regularMarketDayLow')
                  if day_low is None and lows:
                      day_low = min(lows)
                  volume = meta.get('regularMarketVolume')
                  if volume is None and vols:
                      volume = sum(int(v) for v in vols)

                  change = None
                  change_pct = None
                  if price is not None and prev not in (None, 0):
                      change = float(price) - float(prev)
                      change_pct = change / float(prev) * 100

                  quotes[code] = {
                      'code': code,
                      'symbol': symbol,
                      'price': num(price),
                      'previousClose': num(prev),
                      'change': num(change),
                      'changePct': num(change_pct),
                      'open': num(day_open),
                      'high': num(day_high),
                      'low': num(day_low),
                      'volume': int(volume) if volume is not None else None,
                      'observedAt': fmt_epoch(ts),
                      'currency': 'JPY',
                      'exchangeName': meta.get('fullExchangeName') or meta.get('exchangeName') or 'Tokyo',
                      'series5m': series5m,
                      'sourceStatus': 'ok'
                  }
              except Exception:
                  if code in old_quotes:
                      quotes[code] = old_quotes[code]
                      quotes[code]['sourceStatus'] = 'stale-fallback'
                  else:
                      quotes[code] = {
                          'code': code,
                          'symbol': symbol,
                          'price': None,
                          'previousClose': None,
                          'change': None,
                          'changePct': None,
                          'open': None,
                          'high': None,
                          'low': None,
                          'volume': None,
                          'observedAt': None,
                          'currency': 'JPY',
                          'exchangeName': 'Tokyo',
                          'series5m': [],
                          'sourceStatus': 'unavailable'
                      }

          as_of = fmt_epoch(max(observed_epochs)) if observed_epochs else old.get('asOf')
          out = {
              'asOf': as_of,
              'currency': 'JPY',
              'source': 'Yahoo Finance chart endpoint (unofficial, server-side via GitHub Actions)',
              'refreshPolicy': 'GitHub Actions polls about every 5 minutes on JPX weekdays; workflow timing may be delayed.',
              'quotes': quotes
          }
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_text(json.dumps(out, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit quote snapshot when changed
        shell: bash
        run: |
          set -e
          git add stock-dashboard/data/live-quotes.json
          if git diff --cached --quiet; then
            echo "No quote changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update live holdings quotes"
          git push
