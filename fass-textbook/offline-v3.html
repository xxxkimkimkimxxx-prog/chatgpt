<script>
window.FASS_ASSETS=[{"domain":"資産","title":"売掛債権","flow":["信用審査","受注・出荷","請求","入金","消込","残高・滞留確認"],"entries":[{"title":"売掛金・未収入金","body":"商品やサービスの通常の営業取引によって後日代金を受け取る権利が売掛金。固定資産の売却など営業取引以外の未回収代金は通常、未収入金。","tip":"商品を掛けで売ると売掛金が増え、代金入金で減る。入金時に売上を二重計上しない。"},{"title":"受取手形・電子記録債権","body":"受取手形は手形上の金銭債権、電子記録債権は記録機関の電子記録により発生・譲渡する債権。","tip":"売掛金の回収手段。電子請求書や振込データそのものとは別。"},{"title":"信用調査・信用格付","body":"決算書、支払履歴、外部信用情報、事業状況などから相手先の信用力を評価する。格付はその評価結果を区分したもの。","tip":"取引開始時だけでなく決算更新、延滞、業況悪化時に再評価。"},{"title":"与信限度額","body":"許容できる信用供与の上限。社内規程に従い既存債権、未決済手形、受注残等を合算して管理する。","tip":"限度800、既存650、追加200なら50超過。超過前に承認や条件見直しを行う。"},{"title":"債権年齢表（エイジング）","body":"発生日又は回収期日からの経過期間別に債権残高を並べる一覧。","tip":"例：期日内100、30日以内滞留20、90日超10。単なる総残高では見えない回収遅延を抽出できる。"},{"title":"売掛金元帳・残高確認書","body":"元帳は取引先ごとの増減明細、残高確認書は相手先に残高を照会し一致を検証する書類。","tip":"入金予定表は将来の回収予測。エイジングとは目的が異なる。"},{"title":"入金消込・仮受金","body":"銀行入金を請求書、支払通知、名義等と対応させて債権を減らす。不明入金は仮受金等で管理。","tip":"入金額と請求額が違う場合は振込手数料・相殺・値引・分割入金等を確認。"},{"title":"一般債権","body":"経営状態に重大な問題が生じていない債務者への債権。","tip":"通常は貸倒実績率等によって回収不能見込を算定する。"},{"title":"貸倒懸念債権","body":"経営破綻には至っていないが、弁済に重大な問題がある債務者への債権。","tip":"財務内容評価法又はキャッシュフロー見積法等。担保・保証・返済能力を評価。"},{"title":"破産更生債権等","body":"経営破綻又は実質的破綻の状態にある債務者への債権。","tip":"担保処分・保証等による回収見込額を控除して貸倒見積り。"},{"title":"貸倒引当金・貸倒損失","body":"引当金は将来回収不能となる見積額。貸倒損失は実際に回収不能が確定した損失。","tip":"債権100、対応引当70を全額取崩す場合の追加損失は30。会計と税務要件は別。"},{"title":"貸倒引当金の繰入・戻入","body":"期末必要額に残高を合わせる。既存引当残高が不足すれば繰入、過大なら戻入等。","tip":"期首300、貸倒取崩180、必要250なら追加130。"},{"title":"債権譲渡・対抗要件","body":"債権を他者に移転すること。債務者や第三者に譲渡を主張するための通知・承諾、登記等の要件を確認する。","tip":"資金化してもリスクを保有していれば会計上売却とならない場合がある。"},{"title":"相殺","body":"互いに負う債権債務を対当額で消滅させること。","tip":"売掛100、買掛70なら相殺後30を回収。決済相殺とBSの純額表示は別。"},{"title":"売上債権回転日数・回収サイト","body":"平均債権残高÷年商（掛売上高を用いる設問もある）×365。回収サイトは支払期日までの期間。","tip":"日商100万円でサイト30日延長なら単純化した追加資金需要3,000万円。"},{"title":"財務内容評価法","body":"貸倒懸念債権について債権額から担保処分・保証回収見込額を控除し、残額を債務者の財務内容・支払能力に応じて見積もる。","tip":"一般債権の貸倒実績率法と区別。"},{"title":"キャッシュ・フロー見積法","body":"合理的に見積もった将来元利金の受取額を当初約定利率で割り引き、帳簿価額との差額を貸倒見積高とする方法。","tip":"回収額・時期が見積可能な貸倒懸念債権に利用。"},{"title":"金融資産の消滅認識","body":"譲渡で金融資産を消すには、原則として譲渡資産に対する支配が移転することが必要。法的隔離、譲受人が通常の方法で権利を享受できること、譲渡人に実質的な買戻権・義務がないこと等を確認する。","tip":"入金を受けただけで売掛金の消滅とは限らない。ファクタリング契約の実態を確認。"}]},{"domain":"資産","title":"買掛債務","flow":["発注","納入・検収","債務認識","請求照合","支払承認","送金・消込"],"entries":[{"title":"買掛金","body":"通常の営業取引に伴う仕入債務。","tip":"販売商品・原材料の未払代金は買掛金。事務用備品は通常未払金。"},{"title":"未払金・未払費用","body":"未払金は備品購入等の確定した債務、未払費用は継続的役務の既経過分でまだ払っていない費用。","tip":"設備代金と借入利息を区別。"},{"title":"発注書・検収記録・請求書","body":"注文条件、実際に納品された内容、請求された代金を突き合わせる三点照合。","tip":"発注だけでは通常債務成立しない。検収済み・債務成立なら請求書未着でも計上。"},{"title":"買掛金元帳・支払予定表","body":"元帳は仕入先ごとの債務増減。支払予定表は支払日と金額の将来計画。","tip":"元帳残高と仕入先の残高確認、振込結果の照合。"},{"title":"仕入返品","body":"仕入商品を返すこと。","tip":"通常、仕入原価や買掛金の減額。"},{"title":"仕入値引","body":"品質不良、数量不足などにより仕入代金が減額されること。","tip":"返品とは異なり商品を返さず価格を調整する場合がある。"},{"title":"仕入割戻","body":"一定期間の取引量・金額等を基準として還元されるリベート。","tip":"早期決済による仕入割引とは別。"},{"title":"仕入割引","body":"代金を早く決済したことによる金利的な利益。","tip":"従来の簿記では営業外収益とする扱いがある。契約実態と適用基準を確認。"},{"title":"支払サイト・債務回転日数","body":"支払までの期間。回転日数＝平均仕入債務÷年間仕入高等×365。","tip":"期末買掛金＝期首＋掛仕入－支払等。サイト延長で通常資金拘束は減る。"},{"title":"滞留債務・支払統制","body":"期限超過債務は支払漏れ、係争、二重計上、消込漏れを調査。","tip":"振込先変更は別経路で確認。請求番号・金額の重複検知、入力・承認・実行の分離。"},{"title":"支払サイト・締日・支払日","body":"締日は一定期間の取引を集計する基準日、支払日は実際の決済日、支払サイトは取引・締日等から決済までの期間。","tip":"月末締め翌月末払いでは締日から原則1か月。支払条件を変えると資金繰りにも影響。"}]},{"domain":"資産","title":"在庫","flow":["入庫","保管・受払記録","実地棚卸","差異調査","単価・評価","期末残高"],"entries":[{"title":"棚卸資産","body":"商品、製品、仕掛品、原材料など、通常の営業過程で販売・消費する資産。","tip":"自社に帰属する外部倉庫品は含め、他社の預かり品は除く。"},{"title":"委託販売・積送品","body":"他社に販売を委託する取引。受託者による販売時に収益を認識する通常の契約では未販売品は委託者在庫。","tip":"発送しただけで売上にはならない。契約上の支配移転を確認。"},{"title":"継続記録法","body":"入出庫の都度、帳簿数量を記録する。","tip":"実地棚卸で帳簿と現物を照合する必要は残る。"},{"title":"棚卸計算法","body":"期末の実棚数量等から払出数量を求める方法。","tip":"期首100＋仕入200－期末80＝払出220。単価評価方法とは異なる。"},{"title":"個別法・先入先出法","body":"個別法は個々の取得原価、先入先出法は先に取得したものから払い出す仮定。","tip":"先入先出法では期末に比較的新しい仕入原価が残る。"},{"title":"総平均法","body":"一定期間の総原価を総数量で割る。","tip":"100個×100円＋100個×140円→平均120円。"},{"title":"移動平均法","body":"仕入の都度、平均単価を更新する。","tip":"期中に何度も仕入・払出がある場合、総平均と結果が異なり得る。"},{"title":"最終仕入原価法","body":"期末在庫を最後の仕入単価で評価する方法。","tip":"税法上の評価方法と会計上の評価方法の適用可否を区別。"},{"title":"取得原価・付随費用","body":"購入代価に引取運賃等、取得に直接必要な費用を加える。","tip":"売上原価＝期首在庫＋当期仕入等－期末在庫。"},{"title":"棚卸減耗損","body":"帳簿数量に比べ現物が不足した損失。","tip":"帳簿100個、実棚95個、原価100円なら減耗500円。"},{"title":"正味売却価額・棚卸評価損","body":"見積売価から追加製造原価と販売直接経費を控除した額。通常の販売目的の在庫は収益性が低下すれば切下げ。","tip":"原価100、正味売却価額80なら20切下げ。数量差とは別。"},{"title":"実地棚卸・カットオフ","body":"現物の数量や状態を確認。期末前後の入出庫を正しい期間に帰属させる。","tip":"棚札、独立カウント、再実査、差異承認、社外保管先の残高確認。"},{"title":"在庫エイジング・陳腐化","body":"滞留期間別に在庫を分類し、販売可能性・使用予定・正味売却価額を確認する。","tip":"滞留期間が長いだけで自動的に全額評価損になるわけではない。"}]},{"domain":"資産","title":"固定資産","flow":["投資稟議","取得・建設","使用開始","台帳・償却","現物実査","売却・除却"],"entries":[{"title":"固定資産台帳","body":"個別資産の番号、取得原価、所在地、部門、取得日、耐用年数、移動・処分等の履歴を管理する。","tip":"総勘定元帳は勘定別、減価償却費明細表は償却計算、固定資産課税台帳は自治体の課税目的。"},{"title":"取得原価","body":"購入代価に搬入、据付、使用前の直接必要な試運転等を加えた取得に要した額。","tip":"本体900、据付40、運賃10、稼働後一般研修20なら取得原価950。"},{"title":"建設仮勘定","body":"建設・製作中の固定資産の支出を仮に集計する勘定。","tip":"使用可能になった時点で本勘定へ振替。通常供用前は減価償却しない。"},{"title":"減価償却・累計額","body":"取得原価を経済的使用期間に配分する手続。累計額はこれまでの償却額。","tip":"帳簿価額＝取得原価－累計額－減損等。現金支出と償却費は別。"},{"title":"定額法","body":"償却対象額を耐用年数にわたり均等配分。","tip":"600万円、残存0、5年なら年120万円。6か月なら60万円。"},{"title":"定率法・級数法","body":"定率法は未償却残高に一定の率、級数法は残存年数等の比率で逓減配分。","tip":"初期に償却費が多くなりやすい。定額法との違い。"},{"title":"生産高比例法","body":"設備の使用量・生産量に応じて償却する方法。","tip":"使用量が多い期に多く費用配分する。"},{"title":"耐用年数・残存価額・供用日","body":"耐用年数は経済的に使う期間、残存価額は使用終了時の見積価値。供用日は事業に使用し始めた日。","tip":"税務上の法定耐用年数と会計上の見積年数は必ずしも一致しない。"},{"title":"修繕費・資本的支出","body":"通常の維持・原状回復は費用。価値増加や使用期間延長に対応する改良は原則資産。","tip":"名前が修理工事でも実態で判断。新部品の資産化と旧部品除却を検討。"},{"title":"減損の兆候・認識","body":"収益性悪化等の兆候を確認し、日本基準では割引前将来CFが簿価を下回る場合に減損を認識。","tip":"兆候があるだけで直ちに損失額は決まらない。"},{"title":"減損の測定・回収可能価額","body":"使用価値（割引後将来CF）と正味売却価額の高い方を回収可能価額とする。","tip":"簿価100、割引前90、使用価値75、売却80なら減損20。"},{"title":"売却・除却","body":"売却は対価を受けて処分。除却は使用廃止・廃棄等により帳簿から除く。","tip":"売却損益＝対価－簿価（費用別途）。廃棄承認、証憑、台帳更新。"},{"title":"資産除去債務","body":"法令・契約等に基づく撤去義務を現在価値で負債計上し、対応額を原則資産計上。","tip":"2年後121万円、10%複利なら当初100万円。負債の時の経過による増加と資産償却を区別。"},{"title":"リース","body":"資産の使用権を一定期間得る契約。旧日本基準ではファイナンス・オペレーティング等を区別。","tip":"新リース基準は原則2027年4月以後開始年度から。早期適用可。単純化した負債残高＝期首＋利息－支払。"},{"title":"少額減価償却資産・一括償却資産","body":"税務上10万円未満等は即時損金、20万円未満等は3年均等の一括償却を選択できる場合。","tip":"一定の中小企業者等の特例は2026年4月以後取得等から40万円未満に改正。年300万円等の要件あり。"},{"title":"会計上と税務上の減価償却","body":"会計上は使用実態に沿う費用配分、税務上は法令に定める償却限度額等に従う。","tip":"会計償却額が税務限度額を超えれば原則申告加算。将来認容される差額は税効果の対象になり得る。"}]},{"domain":"資産","title":"ソフトウェア（クラウドサービス）","flow":["企画・研究","将来便益の確実性判定","制作","使用開始","償却・保守"],"entries":[{"title":"自社利用ソフトウェア★","body":"自社業務用に制作するソフトウェア。将来の収益獲得又は費用削減が確実と認められる場合に制作費を資産計上。","tip":"著作権登録、支払完了、総額確定だけでは要件を満たさない。事業計画等で便益を裏付ける。"},{"title":"研究開発費","body":"新たな知識や技術を得る研究開発の支出は原則発生時費用。","tip":"将来便益を期待するだけで研究開発費を資産計上しない。"},{"title":"市場販売目的ソフトウェア","body":"販売用製品マスターの制作に関連する費用。研究開発終了後の一定の制作費は資産計上。","tip":"自社利用ソフトウェアと資産計上・償却の考え方が異なる。"},{"title":"受注制作ソフトウェア","body":"顧客の注文に基づいて制作するもの。契約内容に基づき履行義務と収益を認識する。","tip":"自社で保有する資産とは異なる。"},{"title":"SaaS・PaaS・IaaS","body":"SaaSは完成サービス、PaaSは開発・実行環境、IaaSはサーバー等の基盤を利用する形態。","tip":"利用契約のみで独立資産を支配しないなら通常期間費用。"},{"title":"クラウド利用料・前払費用","body":"月額利用料は利用期間に応じ費用。一括払いした未経過分は前払費用。","tip":"ソフトウェアを所有するライセンス取得とサービス利用を区別。"},{"title":"導入・カスタマイズ費","body":"資産を利用可能にする直接制作費は取得原価となり得る。","tip":"クラウド設定費は契約・独立した資産の支配・サービス提供時期によって判断。"},{"title":"保守・研修・機能追加","body":"既存機能の維持や稼働後の一般研修は通常費用。機能向上は資産計上要件を別途検討。","tip":"更新という名称だけで判断しない。"},{"title":"ソフトウェア償却","body":"自社利用ソフトウェアは利用可能期間に合理的に配分。日本基準では原則5年以内（合理的根拠があれば例外）。","tip":"使用停止・便益低下時には減損等の検討。"}]}];

</script><script>
window.FASS_CLOSING=[{"domain":"決算","title":"月次業績","flow":["締め日設定","実績集計","予実対比","原因分析","通期見込み","報告"],"entries":[{"title":"固定予算・変動予算","body":"固定予算は当初予定操業度に基づく。変動予算は実際の操業度で変動費部分を調整する。","tip":"8,000個×標準100円＝変動予算80万円。実績86万円なら6万円不利差異。"},{"title":"ゼロベース予算・増分予算","body":"ゼロベースは必要性を一から検討。増分は前期等の予算を基礎に増減。","tip":"変動予算とは作成方法・比較目的が違う。"},{"title":"数量差異・単価差異","body":"売上高差を数量と単価の変動に分ける。","tip":"一例：数量差異＝数量差×予算単価、単価差異＝単価差×実績数量。"},{"title":"標準原価・原価差異","body":"標準的な材料費・労務費等を設定して実際原価との差を測る。","tip":"単価上昇か使用量増加かを分析する。"},{"title":"固定費・変動費","body":"固定費は一定範囲で操業度に依存しない費用。変動費は操業度に連動する費用。","tip":"家賃は固定費、製品材料は一般に変動費。"},{"title":"限界利益・損益分岐点","body":"限界利益＝売上－変動費。損益分岐点売上＝固定費÷限界利益率。","tip":"固定費900、限界利益率30%なら3,000。損益分岐点は利益ゼロ。"},{"title":"着地見込み・ローリング予測","body":"実績＋残期間の最新見込みで年度末を予測する。","tip":"予算は目標、見込は現時点の予測。差異を一過性と継続性に分ける。"},{"title":"月次決算・管理会計","body":"月次の売上原価・経費等を締め、経営管理用に分析。","tip":"外部開示向け財務会計とは目的が異なる。部門別・商品別の集計を照合。"},{"title":"売上総利益・営業利益・経常利益","body":"売上総利益＝売上高−売上原価。営業利益＝売上総利益−販管費。経常利益＝営業利益＋営業外収益−営業外費用。","tip":"支払利息等は通常営業外費用。営業利益と経常利益を混同しない。"}]},{"domain":"決算","title":"単体決算","flow":["締め処理","証憑・残高照合","決算整理","試算表","財務諸表","承認"],"entries":[{"title":"BS・PL・CF","body":"BSは時点の財政状態、PLは期間の利益、CFは期間の現金及び現金同等物の増減。","tip":"利益と資金は一致しない。資産＝負債＋純資産。"},{"title":"発生主義・カットオフ","body":"収益費用を適切な発生期間に帰属させる。期末前後の取引の計上時期を確認。","tip":"請求書到着・支払日だけで期を決めない。"},{"title":"前払費用・長期前払費用","body":"支払済みの継続的役務の未経過分は資産。通常1年以内に費用化する分は流動、超える分は長期前払費用等。","tip":"12か月保険料120万円を10月支払、3月決算なら残り6か月60万円が前払。"},{"title":"未収収益","body":"継続的役務を提供済みで対価未受領の部分を資産計上。","tip":"貸付金の未収利息など。未収入金・売掛金と区別。"},{"title":"前受収益","body":"受取済みの継続的役務のうち未提供部分を負債計上。","tip":"年間保守料120を1月受領、3月末なら未経過90。"},{"title":"未払費用","body":"継続的役務を受けたが未払いの部分を負債計上。","tip":"借入利息、家賃等の既経過分。設備購入の未払金と区別。"},{"title":"前払金・前受金・仮払金","body":"前払金・前受金は商品等の先払い・先受け。仮払金は使途や金額が未確定の一時的支出。","tip":"旅費仮払いは精算後に適切な費用・残金へ振替。"},{"title":"引当金","body":"将来の特定費用・損失の原因が過去の事象にあり、発生可能性が高く、合理的見積りが可能な場合に計上。","tip":"賞与、製品保証、訴訟等。確定債務や利益準備金とは別。"},{"title":"収益認識の5ステップ","body":"契約特定、履行義務特定、取引価格算定、独立販売価格比で配分、履行義務充足時に認識。","tip":"独立価格80・20、契約90なら80側72。請求日でなく支配移転を確認。"},{"title":"一時点・一定期間の収益","body":"支配移転時に一時点で認識、一定要件のある役務等は進捗度に応じて認識。","tip":"対価900、進捗2/3なら600。"},{"title":"契約資産・契約負債・返金負債","body":"契約資産は履行済みだが対価請求権が条件付き。契約負債は受領等に対応する未履行義務。返金負債は返金見込額。","tip":"無条件の請求権は通常債権。売上全額を即時認識しない。"},{"title":"会計方針の変更★","body":"会計処理の方法を変更すること。例：在庫評価方法を先入先出法から総平均法へ。","tip":"原則遡及適用。新基準の経過措置、実務上不可能な場合等を除く。"},{"title":"表示方法の変更★","body":"財務諸表での表示区分の変更。例：重要性の増加により費用を独立掲記。","tip":"原則比較情報を組替え。会計処理方法の変更ではない。"},{"title":"会計上の見積りの変更★","body":"新たな情報や状況変化により耐用年数や回収見込額等を見直すこと。","tip":"当期以降に将来に向かって反映。減価償却方法の変更は見積り変更と区別困難な特有の扱い。"},{"title":"過去の誤謬の訂正★","body":"過年度に利用可能だった情報の誤用・不使用等による誤りを訂正。","tip":"原則修正再表示。過年度売上計上漏れは見積り変更ではない。"},{"title":"勘定残高照合・決算整理","body":"補助簿と総勘定元帳、証憑、翌期支払、外部残高等を照合。","tip":"計上漏れ、二重計上、期間帰属、見積過不足、異常残高を検証。"},{"title":"CF直接法・間接法","body":"直接法は主要な現金収入・支出を表示。間接法は税引前利益から非資金損益・運転資本変動等を調整。","tip":"減価償却加算、売却益減算、売掛・在庫増加減算、買掛増加加算。"},{"title":"営業CF・投資CF・財務CF","body":"営業＝本業等、投資＝固定資産等の取得売却、財務＝借入・返済・資本調達。","tip":"借入元本返済は財務、設備取得は投資。利息配当の区分は日本基準で選択肢あり。"},{"title":"現金及び現金同等物","body":"現金は手許現金・要求払預金。現金同等物は容易に換金可能で価値変動リスクが僅少な短期投資。","tip":"通常取得日から満期まで3か月以内等。決算日から3か月ではない。"},{"title":"退職給付債務・年金資産","body":"退職給付債務は将来の退職給付の現在価値。年金資産は給付に充てるため外部積立された資産。連結上は原則として両者の差額を退職給付に係る負債または資産として認識する。","tip":"債務2,000万円・年金資産1,500万円なら差額500万円の負債（単一制度、他の調整なし）。個別会計では未認識項目等の扱いが異なる。"},{"title":"確定給付制度・確定拠出制度","body":"確定給付は給付額の算定方法が定められ企業が給付リスクを負う制度。確定拠出は拠出額が定められ原則その拠出を費用処理する制度。","tip":"確定拠出は企業が将来の運用成果を原則保証しない。"},{"title":"変動対価・返品権","body":"返品等で対価が変動する場合、収益の著しい減額が生じない可能性が高い範囲で収益を認識。返品権付き販売では返品見込分の返金負債と、回収する商品に係る資産を認識する。","tip":"単価1,000円×1,000個、返品見込5%なら収益95万円・返金負債5万円（税抜、他の調整なし）。"},{"title":"賞与引当金","body":"決算日までの勤務に対応し、将来支給する賞与の合理的見積額を当期費用として認識する。","tip":"現金支払日ではなく勤務対象期間に着目。法人税の損金算入時期とは別。"},{"title":"未払利息・未請求費用","body":"借入利息や継続的役務の対価が当期に発生していれば、請求や支払い前でも当期費用と負債を認識する。","tip":"元本×利率×経過期間。利払日だけを基準に費用計上しない。"},{"title":"利益準備金","body":"会社法に従い利益剰余金の一部を積み立てる法定準備金。純資産の項目。","tip":"将来の費用・損失に備える引当金とは異なる。"},{"title":"合計残高試算表・補助元帳","body":"試算表は各勘定の借貸合計・残高を集計する資料。補助元帳は取引先や資産等の内訳を記録する。","tip":"試算表の借貸一致だけでは計上漏れを発見できない。補助元帳・証憑との照合が必要。"}]},{"domain":"決算","title":"連結決算","flow":["範囲判定","子会社データ収集","方針・決算日調整","合算","内部消去","連結開示"],"entries":[{"title":"子会社・支配力基準","body":"財務・営業・事業方針の意思決定機関を支配する会社。議決権過半数が基本だが、40～50%等でも役員構成・契約等で実質支配を判定。","tip":"議決権45%でも実質支配なら子会社となり得る。"},{"title":"関連会社・重要な影響力","body":"支配はしないが財務・営業方針に重要な影響を与えられる会社。議決権20%以上が通常の目安、15～20%等でも実態で判断。","tip":"出資比率だけでは確定しない。"},{"title":"持分法","body":"関連会社等の持分相当損益を投資利益・損失に反映し投資簿価を調整する方法。","tip":"利益4000、持分30%なら1200増加（他調整なし）。配当受領は投資簿価減額。"},{"title":"連結パッケージ・決算日差異","body":"連結用の子会社データを集約。原則同一決算日、差が3か月以内なら一定条件で子会社決算利用可。","tip":"重要取引の調整、同種取引の会計方針統一。"},{"title":"資本連結・のれん","body":"親会社投資と子会社資本を相殺。取得原価が取得時識別可能純資産の持分相当額等を上回る部分はのれん。","tip":"日本基準は効果期間20年以内に規則的償却。減損も検討。"},{"title":"非支配株主持分","body":"連結子会社の純資産のうち親会社に帰属しない部分。連結BSの純資産。","tip":"親80%なら他調整なしで残20%。負債ではない。"},{"title":"内部債権債務・内部取引消去","body":"親子の売掛・買掛、貸付・借入、売上・仕入等は連結上相殺消去。","tip":"差異は計上時期、未達、換算、誤記を確認して調整。"},{"title":"未実現利益","body":"内部販売利益のうちグループ外に実現していない部分を消去。","tip":"原価80、内部売価100、期末40%残存なら8消去。"},{"title":"アップストリーム・ダウンストリーム","body":"子→親の内部取引がアップ、親→子がダウン。","tip":"アップの未実現利益消去は非支配株主帰属額も調整。ダウンは原則親会社側。"},{"title":"在外子会社・為替換算調整勘定","body":"資産負債は原則決算時相場、収益費用は期中平均等、資本の一定項目は発生時相場。","tip":"換算差額は純資産の為替換算調整勘定等。個別の外貨建売掛金の為替差損益とは別。"}]},{"domain":"決算","title":"外部開示","flow":["決算確定","監査・承認","決算短信","法定開示","株主総会等"],"entries":[{"title":"決算短信","body":"取引所の規則に基づく決算情報の速報開示。","tip":"決算確定後速やかに公表し、45日以内が一般的目安。法定有報と異なる。"},{"title":"有価証券報告書","body":"金融商品取引法に基づく企業情報の法定開示書類。","tip":"通常事業年度終了後3か月以内。財務諸表、事業・リスク等の情報を含む。"},{"title":"半期報告書・四半期決算短信","body":"上場会社等の半期法定開示と取引所四半期情報。","tip":"旧四半期報告書制度と現行の取引所開示を混同しない。"},{"title":"計算書類・事業報告","body":"会社法に基づく財務諸表等と会社の事業状況の報告。","tip":"監査・取締役会・株主総会の手続は機関設計により異なる。"},{"title":"修正後発事象","body":"決算日現在の状況について追加の証拠となる後発事象で、財務諸表の修正を要するもの。","tip":"期末以前から財務悪化していた先が翌期に倒産した場合など。"},{"title":"開示後発事象","body":"決算日後に新たに発生した重要事象。","tip":"翌期に新規発生した大火災等は当期数値の修正ではなく注記を検討。"},{"title":"継続企業の前提","body":"事業継続に重要な疑義があり、対応策を考慮しても重要な不確実性が残る場合などに注記。","tip":"単に赤字だから直ちに注記とは限らない。返済困難、資金調達等を検討。"},{"title":"セグメント情報","body":"経営者が意思決定に用いる事業区分等に基づく売上・利益等の情報。","tip":"全社PLとは異なる事業別の情報。"},{"title":"関連当事者情報","body":"親会社、役員、関連会社等との重要な取引・条件等の開示。","tip":"内部取引消去とは別。取引の相手と重要性を確認。"},{"title":"重要な会計方針・偶発債務","body":"会計方針は採用処理方法の説明。偶発債務は不確実な事象に依存する潜在的債務等。","tip":"保証・訴訟等は引当計上要件と注記要否をそれぞれ検討。"},{"title":"適時開示・インサイダー情報","body":"投資判断に重要な事実を取引所規則に従って開示。","tip":"未公表の重要事実は情報管理と取引規制に留意。"}]}];

</script><script>
window.FASS_TAX=[{"domain":"税務","title":"税効果計算","flow":["会計と税務の簿価照合","差異分類","解消予定・税率","回収可能性","計上"],"entries":[{"title":"税効果会計","body":"会計上の利益と税金費用の期間対応を図るため、会計と税務の差による税額への影響を適切な期に配分する。","tip":"当期の現金納税額を減らすための制度ではない。"},{"title":"一時差異","body":"会計上と税務上の資産・負債の金額の差等で将来解消するもの。","tip":"税務上の減価償却限度超過額、将来損金になる引当金等。"},{"title":"永久差異","body":"会計と税務の差のうち将来も解消しないもの。","tip":"永久損金不算入の罰金、交際費等や益金不算入配当部分。税効果対象外。"},{"title":"将来減算一時差異・DTA","body":"将来解消時に課税所得を減少させる差異。回収可能性を満たす範囲で繰延税金資産を計上。","tip":"差異500、回収可能な差異300、税率30%→DTA90。"},{"title":"将来加算一時差異・DTL","body":"将来解消時に課税所得を増加させる差異。原則繰延税金負債を計上。","tip":"差異600×税率30%＝180。例えば税務上先行して償却し会計簿価が税務簿価を超える場合。"},{"title":"法定実効税率","body":"法人税、住民税、事業税等の影響を反映した税率。","tip":"解消時に適用が見込まれる税率を用いる。税率変更の影響も検討。"},{"title":"回収可能性","body":"将来課税所得、解消時期、タックスプランニング等からDTAが回収できるかを評価。","tip":"会計上の差異があってもDTAを無条件に全額計上しない。"},{"title":"法人税等調整額・相殺","body":"税効果による当期税金費用の調整。相殺要件を満たす同一納税主体等のDTA・DTLは純額表示。","tip":"DTA120、DTL30なら純額DTA90。納税額とは別。"}]},{"domain":"税務","title":"消費税申告","flow":["税区分判定","売上税額集計","仕入控除区分","納付額計算","申告・納付"],"entries":[{"title":"課税取引","body":"国内において事業者が事業として対価を得て行う資産譲渡・貸付け・役務提供等。","tip":"事務所賃料、商品の販売、サービス提供。標準税率10%。"},{"title":"非課税取引","body":"課税の対象となる取引のうち法律で非課税とされるもの。","tip":"土地の譲渡・一定の貸付け、貸付金利息、一定の住宅賃貸等。1か月未満の土地貸付等は例外。"},{"title":"不課税取引","body":"そもそも消費税の課税対象外となる取引。","tip":"給与、対価性のない寄附等。非課税と不課税は課税売上割合の扱いが違う。"},{"title":"輸出免税","body":"国内取引の課税売上でも一定の輸出取引は税率相当の負担が免除される。","tip":"輸出免税売上は課税売上割合の分子に含む。輸出証明等を保存。"},{"title":"軽減税率","body":"一定の飲食料品（酒類・外食等を除く）や定期購読の一定の新聞は8%。","tip":"持ち帰り食品と店内飲食、酒類とノンアルコールを区別。"},{"title":"仮受・仮払消費税","body":"税抜経理で売上税額は仮受、仕入税額は仮払とする。","tip":"納付＝売上税額－控除できる仕入税額等。仮払全額が控除できるとは限らない。"},{"title":"課税売上割合・95%ルール","body":"課税売上高（輸出免税含む）÷総売上高等で算定。","tip":"課税売上高5億円以下かつ課税売上割合95%以上なら原則全額控除。両方必要。"},{"title":"個別対応方式","body":"課税売上専用の仕入税額全額＋共通仕入税額×課税売上割合。非課税売上専用は控除なし。","tip":"専用80、共通40、非課税専用20、75%なら110。"},{"title":"一括比例配分方式","body":"課税仕入れに係る税額全体に課税売上割合を掛ける。","tip":"上の例なら140×75%=105。選択後は原則2年以上継続。"},{"title":"免税事業者・基準期間","body":"基準期間（法人は通常前々事業年度）の課税売上高1,000万円以下なら原則免税。","tip":"特定期間、新設法人、登録等で例外がある。インボイス登録した事業者は原則課税。"},{"title":"簡易課税","body":"基準期間の課税売上高5,000万円以下等で届出要件を満たせばみなし仕入率で控除。","tip":"卸90、小売80、製造等70、その他60、サービス等50、不動産40%。原則2年継続。"},{"title":"申告期限・中間申告","body":"法人の確定申告は原則課税期間終了後2か月以内。一定の届出等で延長あり。","tip":"直前課税期間の確定消費税額（国税）48万円超は中間申告、400万円超は年3回、4,800万円超は年11回（通常1年）。"}]},{"domain":"税務","title":"法人税等申告","flow":["会計利益確定","申告調整","所得・税額計算","別表照合","申告納付"],"entries":[{"title":"益金・損金★","body":"法人税法上の収益・費用。会計上の収益費用とは一致しない。","tip":"税務所得＝会計利益＋加算－減算。会計上費用だが損金不算入なら加算。"},{"title":"加算・減算★","body":"会計上の利益を税務所得に修正。損金不算入・益金算入は加算、益金不算入・損金算入は減算。","tip":"利益4,000＋200－70－90＝4,040。"},{"title":"別表一・別表四","body":"別表一は税額計算、別表四は所得金額の計算（申告調整）。","tip":"四で所得を求め、一で税額を算定。"},{"title":"別表五（一）・五（二）","body":"五（一）は利益積立金額・資本金等の額、五（二）は租税公課の納付状況等。","tip":"加算留保残高の管理は五（一）。納付は五（二）。"},{"title":"留保・社外流出・認容★","body":"留保は税務上の利益積立金額等に反映される調整、社外流出は社外へ流出する調整。前期加算留保が当期損金となるのが認容。","tip":"減価償却超過等は通常留保、罰金等は通常社外流出。認容は減算。"},{"title":"租税公課","body":"固定資産税、法人事業税等は原則損金算入。法人税・法人住民税本税やペナルティ性附帯税等は原則損金不算入。","tip":"損金算入時期も確認。一定の利子税等は別。"},{"title":"交際費等","body":"取引先等との接待・贈答等。法人区分等で損金不算入額が異なる。","tip":"一定の社外飲食費は1人1万円以下かつ記録保存等で交際費等の範囲外。一定の中小法人の年800万円枠等も区分を確認。"},{"title":"寄附金・福利厚生費","body":"寄附金は対価性のない贈与等で損金限度あり。福利厚生費は従業員に通常・公平に提供する福利。","tip":"支出の名称ではなく相手先・目的・内容で判断。"},{"title":"受取配当等の益金不算入","body":"法人間配当への二重課税を調整する制度。株式保有区分等で不算入額が異なる。","tip":"全ての配当が全額益金不算入とは限らない。"},{"title":"債務確定基準","body":"販売費・一般管理費等の損金算入で債務成立、原因事実、金額の合理的算定等を確認。","tip":"修繕完了・債務成立・金額確定なら請求書翌期到着だけで損金不可とはならない。"},{"title":"税務上の貸倒損失","body":"法的な切捨て、事実上の全額回収不能等の要件で判定。","tip":"単に2か月延滞しているだけでは貸倒損失の要件を満たさない。"},{"title":"減価償却超過・資本的支出","body":"税務限度を超える償却は原則加算。資本的支出を修繕費処理した場合は申告調整を検討。","tip":"将来認容される部分は留保・税効果の対象になり得る。"},{"title":"確定申告・中間申告","body":"法人税確定申告は原則期末後2か月以内。中間申告は通常6か月経過後2か月以内（前期税額等による要否・例外あり）。","tip":"予定申告は前期税額基準、仮決算は実績基準。"},{"title":"青色欠損金","body":"青色申告等の要件を満たす欠損金は将来所得と相殺可能。","tip":"2018年4月以後開始事業年度の欠損金の繰越は原則10年。控除限度等は法人区分による。"},{"title":"源泉所得税","body":"給与・一定の報酬等の支払者が税を差し引き納付する。","tip":"個人税理士の報酬100万円以下部分は10.21%。消費税等が明確に区分される場合は報酬本体を対象にできる。"},{"title":"源泉所得税の納付期限","body":"原則として徴収した月の翌月10日までに納付。","tip":"一定の給与等の支払者は納期特例あり。報酬を支払う相手が個人か法人か確認。"},{"title":"防衛特別法人税","body":"2026年4月1日以後開始課税事業年度に適用。基準法人税額から年500万円を控除した課税標準に4%を乗じる。","tip":"所得に直接4%を掛ける税ではない。適用年度・個別調整を確認。"},{"title":"定期同額給与・事前確定届出給与・業績連動給与","body":"役員給与は原則として一定の損金算入要件を満たすものに限り損金算入可能。定期同額給与は各支給時期の額が原則同額、事前確定届出給与は定めた時期・額について所定の届出等を行うもの、業績連動給与は一定の要件に従うもの。","tip":"役員への臨時賞与を会計上費用処理しただけでは損金にならない。過大部分等も要注意。"},{"title":"使用人賞与の損金算入時期","body":"原則支払年度。所定の支給予定日が到来し通知・損金経理等の要件を満たす場合や、各人別に全員へ通知し期末翌日から1か月以内に全員へ支払い、当期損金経理する場合等は例外。","tip":"会計上の賞与引当金と税務上の損金算入要件を分ける。"},{"title":"法人税本税・法人事業税","body":"法人税・地方法人税・法人住民税の本税は原則損金不算入。法人事業税等は原則損金算入可能で、計上・申告時期に留意する。","tip":"すべての租税公課を一律に加算しない。"},{"title":"加算留保の戻入・認容","body":"前期に税務上加算留保した費用が当期損金になる場合、または会計上戻入益が発生し税務上益金としない場合は、対応する調整を減算する。","tip":"別表四の加減算と別表五（一）の残高管理を対応させる。"},{"title":"損金算入時期・債務確定","body":"一般に販売費・一般管理費等は、期末までに債務が成立し、具体的給付原因が発生し、金額を合理的に算定できること等が必要。","tip":"請求書の受領だけが判断基準ではない。引当金等には個別規定。"}]},{"domain":"税務","title":"グループ通算制度","flow":["完全支配関係確認","承認","各法人所得計算","損益通算","各法人申告"],"entries":[{"title":"グループ通算制度","body":"完全支配関係にある一定の国内法人グループで損益通算等を行う制度。2022年4月以後開始年度から旧連結納税に代わる。","tip":"各法人が個別に納税主体として申告・納付する。"},{"title":"完全支配関係","body":"原則直接・間接で100%保有する関係等。","tip":"会計上の子会社（支配力基準）と対象範囲が異なる。"},{"title":"通算承認・加入・離脱","body":"親法人と対象子法人全体で原則承認申請。完全支配の発生・消滅時に加入離脱等を管理。","tip":"任意に黒字会社だけ選ぶことはできない。"},{"title":"損益通算・欠損金","body":"一定の黒字・赤字をグループで通算し、要件に従い各法人の所得を調整。","tip":"加入前欠損、時価評価等の制限もある。"},{"title":"グループ法人税制","body":"完全支配関係内の一定資産譲渡損益の繰延べ等。","tip":"通算制度の選択がなくても適用され得る。会計上の連結消去とは別。"}]},{"domain":"税務","title":"税務調査","flow":["資料準備","帳簿・証憑提示","質問対応","指摘事項確認","修正等","再発防止"],"entries":[{"title":"税務調査・証憑","body":"申告内容を税務当局が確認する手続。","tip":"契約、発注、検収、請求書、支払記録、成果物で実在性・事業関連性・時期を説明。"},{"title":"修正申告","body":"税額を過少に申告した納税者が税額増額等を訂正する手続。","tip":"過大申告は更正の請求。"},{"title":"更正の請求","body":"過大に申告した税額等の減額を求める手続。","tip":"原則法定申告期限から5年以内。期限内に訂正する場合とは別。"},{"title":"更正・決定・期限後申告","body":"更正は税務署が既申告税額等を訂正、決定は未申告の税額等を定める、期限後申告は納税者の期限後提出。","tip":"主体（納税者か税務署か）と申告の有無で区別。"},{"title":"過少申告加算税・無申告加算税","body":"過少申告、無申告に対する加算税。","tip":"期限内申告の有無で区別。税率は事例条件による。"},{"title":"重加算税","body":"仮装・隠蔽等に対し通常の加算税に代えて課される。","tip":"単なる誤記と仮装隠蔽は別。"},{"title":"延滞税・利子税・不納付加算税","body":"延滞税は納付遅延、利子税は一定の期限延長等、不納付加算税は源泉所得税等の不納付。","tip":"ペナルティ性附帯税は原則損金不算入。利子税等は例外。"},{"title":"不服申立て","body":"処分に対する再調査の請求、審査請求等。","tip":"一般に処分通知から3か月以内等。具体的手続・期限を確認。"}]},{"domain":"税務","title":"電子帳簿保存法","flow":["データの種類判定","電子保存","改ざん防止","検索・表示","調査時提示"],"entries":[{"title":"電子帳簿等保存","body":"自己作成した帳簿・書類を電子データで保存する制度。","tip":"自己作成帳簿と受領したPDFを区別。"},{"title":"スキャナ保存","body":"紙で作成・受領した国税関係書類を電子化して保存する制度。","tip":"要件を満たした電子化が必要。"},{"title":"電子取引データ保存","body":"メール、EDI、Web等で授受した請求書等の取引情報を電子保存。","tip":"原則、紙への印刷だけでは保存要件を満たさない。"},{"title":"真実性・可視性・検索性","body":"訂正削除防止、履歴やタイムスタンプ等と、見読・検索可能な状態を確保。","tip":"基本検索項目は取引日・取引金額・取引先。緩和や猶予措置あり。"},{"title":"保存期間","body":"法人の税務帳簿・書類は原則確定申告期限の翌日から7年。","tip":"欠損年度等は例外。会社法の会計帳簿は原則10年。"}]},{"domain":"税務","title":"消費税インボイス制度","flow":["登録確認","記載事項確認","帳簿入力","請求書保存","仕入控除集計"],"entries":[{"title":"適格請求書","body":"登録番号、取引日、取引内容、税率別対価・税額、宛名等を記載する書類。","tip":"発行事業者登録が必要。単に消費税額を記載した請求書とは別。"},{"title":"適格簡易請求書","body":"小売業等一定の業種で発行できる簡易なインボイス。","tip":"宛名を省略できる等の違い。"},{"title":"仕入税額控除の保存要件","body":"一般課税では原則として所定の帳簿と適格請求書等の双方の保存が必要。","tip":"請求書のみ、帳簿のみ、申告書のみは原則不可。"},{"title":"帳簿のみ保存の特例","body":"公共交通機関等の一定取引や少額特例等では帳簿保存のみで控除可。","tip":"少額特例は一定規模以下、税込1万円未満の仕入、2029年9月末まで。"},{"title":"免税事業者等からの仕入・経過措置","body":"登録外の相手からの仕入は原則控除不可だが要件を満たせば一定割合控除。","tip":"2026年4月1日時点は80%期間。2026年10月以後の改正後は70%（～2028.9）、50%（～2030.9）、30%（～2031.9）、その後0%。上限改正は2026.10以後開始課税期間から。"},{"title":"2割特例・3割特例","body":"登録を機に免税から課税となる一定事業者の納付税額を売上税額の2割等とする特例。","tip":"2割は2026.9.30を含む所定課税期間まで。3割は一定の個人事業者の2027・2028年分。法人は対象外。"},{"title":"修正インボイス・返還インボイス","body":"記載誤りの修正や返品・値引等に対応した書類。","tip":"発行・受領側で適切に保存し控除額を調整。少額返還等に例外あり。"}]}];

</script><script>
window.FASS_TREASURY=[{"domain":"資金","title":"現金出納","flow":["入出金","出納帳","証憑突合","現金実査・預金照合","差異調査","承認"],"entries":[{"title":"現金出納帳","body":"現金の受入・払出と残高を記録する帳簿。","tip":"現金実査で現物と帳簿を突合。担当者以外の確認を組み込む。"},{"title":"現金過不足","body":"実査額と帳簿の差を原因判明まで一時的に管理する勘定。","tip":"原因調査後に適切な科目へ。原因不明のまま期末なら雑損益等、私費補填はしない。"},{"title":"定額資金前渡法（インプレスト）","body":"小口現金を一定額前渡しし、使用額を補給して元の額に戻す方法。","tip":"手許現金＋未精算支払証憑＝定額。随時補給法は必要時に補給。"},{"title":"残高証明書・当座勘定照合表","body":"残高証明書は指定日の銀行残高を金融機関が証明。照合表は銀行取引等を記録。","tip":"銀行勘定調整表は帳簿残高との差異を調整する社内資料。"},{"title":"未取付小切手","body":"振り出して交付済みだが銀行未呈示の小切手。会社帳簿は減少済み。","tip":"銀行側残高から控除。"},{"title":"未渡小切手","body":"振り出したが相手にまだ交付していない小切手。","tip":"帳簿を減額していた場合、会社側で修正。"},{"title":"未取立小切手・未記帳入金","body":"銀行へ預けたが取立・記帳未了の入金等。","tip":"会社帳簿計上済みなら銀行側に加算。契約・実際の取立状況を確認。"},{"title":"銀行勘定調整表","body":"銀行残高と会社帳簿残高を、未達取引や誤記等で調整して一致させる。","tip":"銀行1,000＋未記帳入金50－未取付100＝調整950。会社側の誤記は会社側で修正。"},{"title":"決済用預金・預金保険","body":"無利息・要求払・決済サービス提供の要件を満たす決済用預金は全額保護。一般預金等は原則1金融機関・1預金者元本1,000万円と利息等。","tip":"外貨預金等は保護対象外。資金集中と安全性を管理。"},{"title":"口座台帳・職務分掌","body":"口座開閉・残高・印鑑・電子証明書・利用者権限を一元管理。作成・承認・実行を分離。","tip":"退職者権限削除、二重払チェック、振込先変更の独立確認、実行結果照合。"}]},{"domain":"資金","title":"手形","flow":["振出・受取","手形台帳","保管・譲渡","満期呈示","決済・消込"],"entries":[{"title":"約束手形","body":"振出人が一定期日に一定額を支払うことを約束する証券。","tip":"受取側は受取手形、振出側は支払手形。"},{"title":"為替手形","body":"振出人が第三者（支払人）に受取人等への支払を委託する証券。","tip":"約束手形は振出人自身の支払約束。"},{"title":"小切手","body":"銀行等への支払委託を内容とする証券。原則として呈示払い。","tip":"手形の将来期日決済と区別。"},{"title":"手形台帳","body":"額面、振出人、受取人、期日、手形番号、保管・裏書・割引履歴を管理。","tip":"満期の資金手当と取立状況を照合する。"},{"title":"裏書譲渡","body":"手形に裏書して権利を他者に移転する。","tip":"不渡り時に裏書人等に遡求される可能性がある。"},{"title":"手形割引","body":"満期前に金融機関等へ手形を譲渡して資金化する。","tip":"満期までの割引料等が差し引かれる。遡求リスクを管理。"},{"title":"不渡り・遡求","body":"手形が呈示されても支払われないことが不渡り。一定要件で裏書人等に支払請求することが遡求。","tip":"手形譲渡後もリスクが残る場合がある。"},{"title":"電子記録債権（でんさい）","body":"電子債権記録機関の記録により発生・譲渡する金銭債権。","tip":"紙の紛失リスクが少なく分割譲渡等も可能。期日管理は必要。"},{"title":"支払手形の満期決済","body":"満期に銀行預金等から支払うことで手形債務を消滅させる。","tip":"決済日、残高、引落結果を確認。期日に支払資金を確保する。"}]},{"domain":"資金","title":"有価証券","flow":["運用方針","信用・流動性評価","取引","保管照合","期末評価","売却・償還"],"entries":[{"title":"売買目的有価証券","body":"短期価格変動利益を目的として保有。原則時価評価し差額を当期損益。","tip":"取得500、時価540なら評価益40。"},{"title":"満期保有目的債券","body":"満期まで保有する積極的意思・能力を持つ債券。","tip":"金利調整差額があれば償却原価。通常の市場時価変動は評価損益にしない。"},{"title":"その他有価証券","body":"売買目的・満期保有・子会社関連会社株式以外。市場価格のあるものは原則時価。","tip":"全部純資産直入法等。市場価格のない株式等は取得原価等。著しい下落時は減損検討。"},{"title":"子会社・関連会社株式","body":"個別財務諸表上は原則取得原価。","tip":"連結上の資本連結・持分法は別。"},{"title":"償却原価法","body":"金利調整差額を満期まで配分し帳簿価額を償還額に近づける。","tip":"額面1,000・取得940、3年定額なら毎年20増加。原則利息法、一定の場合定額法。"},{"title":"EPS・PER","body":"EPSは1株当たり当期純利益。PER＝株価÷EPS。","tip":"株価2,400・EPS120なら20倍。"},{"title":"BPS・PBR","body":"BPSは1株当たり純資産。PBR＝株価÷BPS。","tip":"株価1,800・BPS1,200なら1.5倍。"},{"title":"配当利回り・配当性向","body":"配当利回り＝1株配当÷株価、配当性向＝配当÷利益。","tip":"株価を分母にするか利益を分母にするか。"},{"title":"債券価格と利回り","body":"将来CFが同じ固定利付債は、投資家の要求利回りが上がるほど現在価値が下落。","tip":"新発債がより高利回りなら古い低利率債の価格は下がる方向。"},{"title":"信用スプレッド","body":"信用リスク等に対する基準利回りへの上乗せ。","tip":"発行体信用悪化→スプレッド拡大→要求利回り上昇→既発債価格下落（他条件一定）。"},{"title":"デュレーション","body":"マコーレーは債券CFの加重平均回収期間。修正デュレーションは金利への価格感応度。","tip":"修正デュレーション5、金利1ポイント上昇なら価格約5%下落（概算）。"},{"title":"信用格付・投資管理","body":"発行体の信用力を評価した格付、保有額・取得価額・時価・満期等を台帳で管理。","tip":"格付だけに依存しない。証券会社残高と自社帳簿を突合。"}]},{"domain":"資金","title":"債務保証","flow":["保証先審査","稟議","保証契約","残高・期限管理","履行可能性評価","解除"],"entries":[{"title":"人的保証","body":"主債務者が履行しない場合に保証人が債務を履行する責任を負う。","tip":"物上保証は財産を担保として提供すること。債務引受は債務そのものを引き受けること。"},{"title":"普通保証・連帯保証","body":"普通保証人には原則催告・検索の抗弁等があるが、連帯保証人にはない。","tip":"主債務者に先に請求してほしいと主張できるか等の違い。"},{"title":"債務保証管理台帳","body":"保証先、金融機関、金額、期間、保証対象借入残高、条件を管理。","tip":"自社借入台帳・自社貸付台帳とは別。"},{"title":"偶発債務","body":"将来の不確実な事象に依存して生じる可能性のある債務等。","tip":"保証契約時は必要に応じ注記。直ちに保証額全額を自社借入金にしない。"},{"title":"保証損失引当金","body":"保証履行による損失が発生する可能性が高く、合理的見積りができる等の要件で計上。","tip":"保証先の財務悪化時に見直す。"},{"title":"代位弁済・求償権","body":"保証人が債務者に代わり弁済すること。弁済した保証人は一定範囲で求償権等を取得。","tip":"求償債権の回収可能性も評価する。"}]},{"domain":"資金","title":"貸付金","flow":["信用審査","貸付稟議・契約","実行","元利金・担保管理","回収"],"entries":[{"title":"貸付金","body":"資金を貸したことによる金銭債権。","tip":"借入金は資金を借りた側の負債。貸付先・元本・期間を台帳管理。"},{"title":"約定利率・法定利率","body":"約定利率は契約で定めた利率。法定利率は法律が定める利率。","tip":"契約利率と法定利率を混同しない。"},{"title":"遅延損害金","body":"支払期日を過ぎた履行遅滞に対する損害賠償金。","tip":"通常利息、保証料、期限前返済手数料とは別。"},{"title":"担保・抵当権・質権","body":"担保は債権回収の確保手段。抵当権は不動産等の使用を続けながら担保、質権は目的物等の質入れによる担保。","tip":"担保評価、登記・対抗要件、優先順位を確認。"},{"title":"譲渡担保・保証","body":"譲渡担保は譲渡形式で担保を設定。保証は他者の人的信用を利用。","tip":"担保回収見込・保証回収見込の重複計上に注意。"},{"title":"貸付金台帳・未収利息","body":"貸付先、元本、利率、期限、回収履歴、担保等を記録。","tip":"既経過未受領の利息は未収収益等。延滞時は貸倒見積り。"}]},{"domain":"資金","title":"借入金","flow":["資金需要","調達比較","条件交渉","稟議・契約","実行","利払・条項管理","返済・借換"],"entries":[{"title":"相対融資","body":"個別の金融機関と企業が融資条件を交渉し契約。","tip":"複数行が共通契約で融資するシンジケートとは異なる。"},{"title":"シンジケートローン","body":"複数金融機関が共通の契約条件に基づき協調融資。","tip":"大口調達で交渉・実行後事務をまとめられる。"},{"title":"アレンジャー・エージェント","body":"アレンジャーは融資組成・参加行募集等、エージェントは契約実行後の通知・利払等の事務取りまとめ。","tip":"メイン行が兼務することもあるが役割は別。"},{"title":"当座貸越（OD）","body":"設定限度額の範囲で反復して借入・返済を行う方式。","tip":"常に融資実行義務があるとは限らない。"},{"title":"コミットメントライン","body":"金融機関が一定期間、契約条件の範囲で融資枠を確約する契約。","tip":"未使用枠にコミットメントフィー等が発生することがある。貸越方式と併用可。"},{"title":"固定金利・変動金利","body":"固定金利は契約期間中一定、変動金利は基準金利の変化に連動する。","tip":"金利上昇時、変動借入の利息負担が増える。"},{"title":"スプレッド・bp","body":"スプレッドは基準金利への上乗せ。1bp＝0.01パーセントポイント。","tip":"1.20%＋7bp＝1.27%。8bp＝0.08ポイント。"},{"title":"TIBOR・TONA・TONA TSR","body":"TIBORは銀行間取引等の指標金利、TONAは無担保コール翌日物金利、TONA TSRはTONA参照の金利スワップ固定金利指標。","tip":"変動基準と固定金利の参照指標を混同しない。"},{"title":"利息計算・未払利息","body":"利息＝元本×年利×期間（契約の日割基準）。既経過未払いは決算で未払費用等。","tip":"元本1億、年1.46%、90日/365日なら36万円。"},{"title":"元金均等返済","body":"毎回の元金返済額が一定。残高が減るので利息と元利合計は通常減少。","tip":"元利均等と区別。"},{"title":"元利均等返済・満期一括","body":"元利均等は毎回の元利合計が一定（固定金利等の前提）。満期一括は元金を満期に全額返済。","tip":"満期一括は資金集中・借換リスク。"},{"title":"財務制限条項（財務コベナンツ）★","body":"一定の純資産・利益・財務比率を維持する等の義務。","tip":"ネット有利子負債/EBITDA上限3.5倍、実績4倍なら違反を検討。定義・治癒期間は契約による。"},{"title":"クロスデフォルト条項★","body":"他の債務で一定の不履行が生じた場合、当該融資契約でも不履行事由に該当させる条項。","tip":"A銀行返済不履行→B銀行契約にも波及し得る。閾値、通知、治癒期間等は契約次第。"},{"title":"ネガティブプレッジ条項★","body":"他の債権者に担保を設定することを制限する条項。","tip":"無担保で融資した銀行の立場を保護。返済不履行の連動ではない。"},{"title":"クロスアクセラレーション★","body":"他債務で期限前弁済請求等が発生した場合に当該契約上の不履行事由とする等の条項。","tip":"他債務の不履行自体に着目するクロスデフォルトより条件が限定されることがある。"},{"title":"期限の利益・期限の利益喪失","body":"借入人が期限まで返済を猶予される利益。契約等により喪失すると期限前返済を求められ得る。","tip":"不履行事由発生＝常に即時一括返済ではない。"},{"title":"期限前任意弁済・強制弁済","body":"任意弁済は借入人の意思による早期返済。強制弁済は契約条件に基づき義務として行う。","tip":"手数料・通知期限・利息精算を確認。"},{"title":"借入金台帳・借換","body":"借入先、元本、利率、期日、担保、条項等を管理。借換は新たな資金で既存借入を返す。","tip":"満期前に返済原資・条件・承認・コベナンツを確認。"},{"title":"加重平均借入利率","body":"各借入残高と利率を掛けた利息相当額の合計を借入残高合計で割る。","tip":"20億円×1%＋30億円×1.5%＝0.65億円。50億円で割ると1.3%。単純平均1.25%ではない。"},{"title":"金利更改日・利払日・返済期日","body":"変動金利借入の基準利率を再設定する日、利息を払う日、元本の返済日をそれぞれ管理する。","tip":"利払日と金利更改日が常に一致するわけではない。契約の計算期間・日数基準も確認。"},{"title":"コミットメントフィー・アレンジメントフィー","body":"前者は融資枠の確保に対する対価（未使用枠を基礎とする契約等）、後者は融資組成の対価。","tip":"借入実行額に対する支払利息とは別の費用。条件は契約による。"}]},{"domain":"資金","title":"社債","flow":["発行方針","条件・格付・引受","発行","利払・残高管理","償還"],"entries":[{"title":"普通社債","body":"企業が投資家から資金を直接調達する債務証券。","tip":"株式は原則返済不要の資本、社債は負債。"},{"title":"転換社債型新株予約権付社債","body":"所定の条件で株式への転換が可能な権利付き社債。","tip":"普通社債には通常この転換権がない。"},{"title":"CP（コマーシャルペーパー）","body":"企業が短期資金を市場から直接調達するため発行する証券。","tip":"銀行借入とは異なる。通常無担保。譲渡性預金は銀行の預金商品。"},{"title":"額面・発行価額・償還価額","body":"額面は元本金額、発行価額は発行時の受取額、償還価額は満期等の返済額。","tip":"平価発行＝額面と同額。"},{"title":"割引発行・打歩発行","body":"割引発行は額面未満、打歩発行は額面超。","tip":"市場価格を基準とする時価発行とは額面との関係が違う。"},{"title":"クーポン利率・現在利回り","body":"クーポンは額面に対する利率。現在利回りは年間利息÷購入価格。","tip":"額面100・年利息2・価格95ならクーポン2%、現在利回り約2.11%。"},{"title":"応募者利回り・最終利回り","body":"応募者利回りは発行時購入を前提とした利回り、最終利回りは購入価額・利息・償還差損益等を考慮した満期までの収益率。","tip":"表面利率だけでは償還差を反映しない。"},{"title":"社債の償却原価","body":"発行額と償還額の金利調整差額を期間配分する。","tip":"額面100、発行98、4年定額なら年0.5増額。"},{"title":"社債発行費・利払・償還管理","body":"発行費用、利払日、償還日、残高を管理。","tip":"日本基準の社債発行費は原則費用、繰延資産処理も認められる場合。元本返済と利息を区別。"},{"title":"社債の償還とキャッシュフロー","body":"満期・期限前償還による元本返済は通常財務活動のキャッシュフロー。利払いの区分は適用基準と表示方針に従う。","tip":"社債発行による資金受取も財務活動。元本返済と支払利息を区別。"}]},{"domain":"資金","title":"デリバティブ取引","flow":["リスク特定","ヘッジ手段選定","契約・承認","時価・残高管理","決済","効果検証"],"entries":[{"title":"デリバティブ","body":"金利、為替、株価等の原資産・指標に価値が連動する取引。","tip":"ヘッジ目的と投機目的を区別。レバレッジ、信用、流動性リスクを管理。"},{"title":"先渡取引","body":"将来の一定期日に価格等を事前に決めた相対取引。","tip":"為替予約は典型。個別に金額・満期を設定。"},{"title":"先物取引","body":"取引所で標準化された条件により将来の売買を約束。","tip":"証拠金・日々の値洗いが特徴。相対の先渡とは別。"},{"title":"コールオプション","body":"あらかじめ定めた価格で原資産を買う権利。","tip":"輸入企業が外貨購入価格の上昇を抑える場合に利用し得る。"},{"title":"プットオプション","body":"あらかじめ定めた価格で原資産を売る権利。","tip":"輸出企業が受取外貨の円換算額低下を抑える場合に利用し得る。"},{"title":"プレミアム・権利行使価格","body":"プレミアムは権利の対価、権利行使価格は権利を行使する際の取引価格。","tip":"買い手は行使・放棄を選べる。売り手は行使に応じる義務。"},{"title":"金利スワップ★","body":"同一通貨の想定元本に対する固定・変動金利のCFを交換する。通常元本は交換しない。","tip":"変動借入＋固定払い・変動受取り＝実質固定化（条件一致時）。逆方向は固定借入を変動化。"},{"title":"金利キャップ★","body":"参照金利が設定上限を超えたときに超過分を受け取る権利。","tip":"変動借入の金利低下メリットを残して上昇リスクを限定。通常プレミアム負担あり。"},{"title":"金利フロア★","body":"参照金利が設定下限を下回ると差額を受け取る権利。","tip":"変動金利で運用する側の金利低下対策等。借入上昇リスク対策はキャップ。"},{"title":"金利カラー★","body":"キャップとフロアを組み合わせ金利の上限・下限を設定。","tip":"変動借入ではキャップ購入＋フロア売却等によりプレミアムを相殺する場合。低下メリットにも制約。"},{"title":"通貨スワップ・為替スワップ","body":"通貨スワップは異通貨の元本・利息等を交換。為替スワップは異なる期日に反対方向の外貨売買を組み合わせる。","tip":"金利スワップは同通貨の金利CF交換。"},{"title":"時価評価・ヘッジ会計","body":"デリバティブは原則時価評価・損益。ヘッジ会計は要件を満たす場合に対象と手段の損益認識時期を対応。","tip":"経済的ヘッジ＝必ず会計上のヘッジ適用ではない。繰延ヘッジ、振当、金利スワップ特例は要件確認。"},{"title":"ヘッジ指定・有効性","body":"リスク、対象、手段、期間・金額を文書化し、効果を確認する。","tip":"想定元本・参照金利・満期の不一致は残存リスクを生む。"}]},{"domain":"資金","title":"外貨建取引","flow":["外貨債権債務計上","通貨別ポジション","予約等","決算換算","決済・差損益"],"entries":[{"title":"円高・円安","body":"1ドル当たり円額が下がることが円高、上がることが円安。","tip":"150円→140円は円高。輸出受取には不利、輸入支払には有利（他条件一定）。"},{"title":"取引時相場・決算時相場","body":"外貨建取引は原則取引時相場で記帳し、外貨建金銭債権債務は決算時相場で換算する。","tip":"売掛金・買掛金と、取得原価評価する非貨幣性項目を区別。"},{"title":"為替差損益","body":"外貨建金銭債権債務の決算換算・決済等で生じる円換算差額。","tip":"10万ドルを140→150円で換算すると売掛金100万円益、買掛金100万円損（ヘッジなし）。"},{"title":"TTM・TTS・TTB","body":"TTMは仲値、TTSは銀行が顧客へ外貨を売る相場、TTBは銀行が顧客から外貨を買う相場。","tip":"輸入で外貨購入＝TTS、輸出外貨売却＝TTB。通常TTB＜TTM＜TTS。"},{"title":"直物取引・為替予約","body":"直物は通常近い決済日、予約は将来の交換レートを事前に確定。","tip":"10万ドルを145円で予約、直物153円なら輸入支払80万円抑制（手数料等なし）。"},{"title":"外貨買い予約・外貨売り予約","body":"将来支払う外貨を買う予約、将来受け取る外貨を売る予約。","tip":"輸入＝買い、輸出＝売り。予約により有利な相場変動の恩恵も失われ得る。"},{"title":"マリー","body":"同一通貨の受取と支払を金額・時期で対応させ自然に為替リスクを相殺。","tip":"受取100万ドル、支払80万ドルなら差額20万ドルのヘッジを検討。"},{"title":"ネッティング","body":"複数の債権債務を相殺し差額だけを決済。","tip":"マリーは為替リスクの相殺、ネッティングは決済額・件数削減が主目的。"},{"title":"信用状（L/C）","body":"所定条件を満たす書類の呈示を条件に発行銀行が支払を確約する貿易決済手段。","tip":"商品の品質そのものを銀行が保証するわけではない。"},{"title":"船荷証券（B/L）・商業送り状","body":"B/Lは貨物受取・運送等を証する書類。Invoiceは取引・請求内容を示す。","tip":"信用状と区別。荷為替手形は船積書類を伴う為替手形。"},{"title":"D/P・D/A","body":"D/Pは支払と引換えに書類引渡し、D/Aは手形引受と引換えに書類引渡し。","tip":"D/Aは支払前に書類が渡る。L/Cとは銀行の支払義務が異なる。"}]},{"domain":"資金","title":"資金管理","flow":["残高把握","日別入出金予測","過不足判定","調達・運用","実行","予測改善"],"entries":[{"title":"資金繰り予定表","body":"将来の入金・出金・残高を時系列に予測する資料。","tip":"CF計算書は実績、資金運用表は資金の源泉・使途分析、銀行勘定調整表は残高照合。"},{"title":"黒字倒産・日中流動性","body":"利益があっても回収遅延・在庫増加・借入返済等で支払資金不足となること。","tip":"月末残高が十分でも入金より支払が先なら日中不足。"},{"title":"最低必要資金","body":"期間中の最も低い予測残高から追加調達額を求める。","tip":"期首200、支出350、入金100、支出150なら最低－200、追加200。"},{"title":"予測差異・資金繰り精度","body":"予定と実績の差を金額・時期・原因で分析して次回予測を改善。","tip":"回収遅延、支払前倒し、臨時支出を区分。"},{"title":"営業運転資金","body":"売上債権＋棚卸資産－仕入債務を基本とする営業上の資金拘束。","tip":"売掛・在庫増加は必要資金増、買掛増加は通常必要資金減。"},{"title":"CCC（キャッシュ・コンバージョン・サイクル）","body":"仕入から販売代金回収までの資金拘束期間。債権回転日数＋在庫回転日数－債務回転日数。","tip":"50＋40－35＝55日。"},{"title":"CMS","body":"キャッシュ・マネジメント・システム。グループ全体の資金管理、集約・融通を支援。","tip":"各社の余剰・不足を統合し、外部借入を圧縮できる場合。"},{"title":"キャッシュ・プーリング・資金集中","body":"プーリングはグループ資金の集約・融通。資金集中は特定口座に残高を集める仕組み。","tip":"実際の資金移動方式と仮想集約方式を区別。"},{"title":"ZBA・ターゲットバランス","body":"ZBAは対象口座を原則ゼロに吸収・補填。ターゲット方式は一定残高を残す。","tip":"夜間ゼロ化後、翌朝の引落前に補填等が必要。"},{"title":"ファクタリング","body":"売掛債権等を譲渡し、回収期日前に資金化する取引。","tip":"ABLは資産を裏付けとする融資であり、譲渡による資金化とは別。契約によるリスク移転を確認。"},{"title":"ABL（アセットバックトローン）","body":"売掛債権・在庫等を担保として融資を受ける仕組み。","tip":"借入債務が生じる。ファクタリングとの違い。"},{"title":"資金運用三原則","body":"安全性・流動性・収益性を総合判断。","tip":"高利回りだけで選ばず必要資金の時期、発行体信用、換金性、集中を確認。"},{"title":"流動比率・当座比率","body":"流動比率＝流動資産÷流動負債、当座比率＝当座資産÷流動負債。","tip":"当座資産には通常棚卸資産を含まない。短期支払能力。"},{"title":"自己資本比率・負債比率","body":"自己資本比率＝自己資本÷総資産、負債比率＝負債÷自己資本等（定義に従う）。","tip":"長期的な財務安定性を測る。"},{"title":"ROA・ROE","body":"ROAは利益÷総資産、ROEは利益÷自己資本。","tip":"利益・平均残高の定義は設問に従う。資産効率と株主資本効率を区別。"},{"title":"EBIT・EBITDA","body":"EBITは利息・税引前利益等、EBITDAはそれに減価償却費等を加えた概念。","tip":"営業CFとは一致しない。契約ごとの調整定義を確認。"},{"title":"ネット有利子負債・レバレッジ倍率","body":"ネット有利子負債＝有利子負債－現預金等。倍率＝ネット有利子負債÷EBITDA。","tip":"負債12、現金2、EBITDA2.5なら4倍。"},{"title":"インタレスト・カバレッジ・レシオ","body":"EBIT等÷支払利息で利息支払能力を評価。","tip":"EBIT3億、利息0.5億なら6倍。分子・分母の契約定義を確認。"},{"title":"調達と運用の期間対応","body":"短期需要に短期借入枠・CP等、長期需要に長期借入・社債・増資等を比較。","tip":"返済時期と回収・運用満期のミスマッチ、借換集中を管理。"},{"title":"CFADS・DSCR","body":"CFADSは元利返済に利用可能なキャッシュフロー。DSCR＝CFADS÷元利返済額で返済余力を測る。定義は契約・案件に従う。","tip":"CFADS2.4億円、元利返済2億円なら1.2倍。契約基準1.25倍には届かない。EBITDAそのものとは限らない。"},{"title":"最低必要残高・利用可能資金","body":"将来の支払に備える最低残高と、現預金・未使用融資枠等から算定した利用可能資金を確認する。","tip":"月末残高が黒字でも月中の資金不足が起こり得る。融資枠の実行条件も確認。"},{"title":"資金予測差異","body":"入出金の予測と実績との差を、金額・時期・原因別に分析する。","tip":"売掛回収遅延、支払前倒し、税金・賞与等の漏れを特定して翌期予測に反映。"},{"title":"送金途上資金（Cash in transit）","body":"送金元では出金済みだが受取側への入金が未確認の資金。","tip":"グループ内送金では両口座の計上時期と銀行明細を突合し、重複や漏れを防ぐ。"}]}];

</script><script>
window.FASS_LEARN_ASSETS=[{"ch":0,"terms":"—","title":"会社のお金はどう動く？","key":"利益が出ても、お金がないことはある。","body":"例えば商店が商品を60万円で買い、100万円で売ります。販売時点で利益は40万円ですが、代金を翌月受け取るなら今日は現金が増えません。経理は取引の記録と決算、財務は支払えるお金の確保を担います。","type":"flow","rows":[["🏦 資金調達","事業を始める元手"],["📦 仕入","60万円の支出"],["🏪 販売","100万円の売上"],["🧾 売掛金","翌月100万円回収"],["💰 入金","現金が戻る"]],"rule":"販売と入金は別の出来事。FASSの4分野はこの流れを管理するための知識。","q":"掛け販売した日に現金は必ず増える？","answer":"増えない。売上と売掛金を認識し、入金は後日。"},{"ch":0,"terms":"—","title":"財務3表の見方","key":"BSは写真、PLとCFは期間の動画。","body":"BSは決算日の財産とその調達元を示します。PLは一定期間にどれだけ利益を生んだか、CFはその期間に現金がなぜ増減したかを示します。借金で100万円の現金が増えても利益は増えません。","type":"bs","rows":[["現金80","売掛金20","商品50","設備50","借入80","買掛20","純資産100"]],"rule":"資産＝負債＋純資産。利益と現金を別々に追う。","q":"銀行から100万円借りたらPLの売上は増える？","answer":"増えない。BSの現金と借入金が増え、CFは財務活動の収入。"},{"ch":0,"terms":"—","title":"決算・税務・資金の関係","key":"一つの取引を違う3つの視点で見る。","body":"会社が設備を購入すると、経理では資産に計上して使う期間に費用を配分します。税務では法律が認める償却限度額等で課税所得を調整します。財務では購入時の現金支出と将来の資金計画を管理します。","type":"compare","rows":[["視点","知りたいこと","設備100万円の例"],["決算","利益と財産","資産計上し減価償却"],["税務","納税額","税法上の損金を確認"],["資金","支払えるか","支払日に100万円の出金"]],"rule":"会計上の費用＝税務上の損金＝現金支出、ではない。","q":"設備代金を一括払いした年に、会計上も全額費用になる？","answer":"通常はならない。使用期間にわたり減価償却する。"},{"ch":1,"terms":"1-2,6-7,14-15","title":"売掛金はなぜ発生する？","key":"「売った」と「入金された」は別。","body":"店が得意先へ商品100万円を販売し、翌月払いと約束したとします。売掛金とは、その代金を後で受け取る権利です。入金時は売掛金を減らします。何の請求への入金か特定するのが消込です。","type":"flow","rows":[["出荷・検収","売上100"],["請求","売掛金100"],["翌月振込","預金100増"],["消込","売掛金100減"]],"rule":"営業取引の未回収＝売掛金。設備売却の未回収＝通常未収入金。","q":"入金時にもう一度売上を計上する？","answer":"しない。すでに認識した売掛金を消し込む。"},{"ch":1,"terms":"3-5","title":"与信管理とエイジング","key":"売る前に「返してもらえるか」を考える。","body":"掛け販売は、代金を受け取るまで相手に資金を貸しているのと似ています。信用調査で安全性を評価し、取引上限を設定します。回収日を過ぎた債権は期間別に分類して追いかけます。","type":"bars","rows":[["与信限度","800"],["既存債権","650"],["追加出荷","200"],["追加後合計","850"]],"rule":"限度800万円に対し850万円なら50万円超過。債権年齢表は滞留期間、残高確認書は相手との一致確認。","q":"回収期日を過ぎた債権を経過日数別に確認する資料は？","answer":"債権年齢表（エイジング）。"},{"ch":1,"terms":"8-12,16-17","title":"貸倒れにどう備える？","key":"回収できなさそうな部分を先に見積もる。","body":"売掛金100万円のうち30万円が回収不能と見込まれるなら、回収不能見込を貸倒引当金で反映します。相手の経営状況により、実績率で計算するか、個別に担保や返済計画を調べるかが変わります。","type":"compare","rows":[["債権区分","相手の状態","主な見積方法"],["一般","通常","貸倒実績率等"],["貸倒懸念","返済に重大な問題","財務内容評価・CF見積"],["破産更生等","破綻・実質破綻","担保・保証等の回収見込控除"]],"rule":"引当金は見積り、貸倒損失は実際の回収不能。会計と税務の判定は別。","q":"将来回収不能と見込むが、まだ貸倒れが確定していないときは？","answer":"貸倒引当金。債権の区分に応じて見積もる。"},{"ch":1,"terms":"13,18","title":"債権を売る・資金化する","key":"入金日を待たずに現金にする。","body":"得意先から100万円を受け取る権利を金融会社へ譲渡し、先に代金を受け取ることがあります。ただし買戻義務等があり支配が移転していないなら、会計上は債権の消滅を認識できないことがあります。","type":"flow","rows":[["自社","売掛金100"],["債権譲渡","金融会社へ"],["金融会社","資金提供"],["得意先","期日に金融会社へ支払"]],"rule":"ファクタリングの資金受領と債権の消滅認識は別。支配移転要件を確認。","q":"譲渡代金を受け取れば必ず債権を帳簿から消せる？","answer":"いいえ。法的隔離、譲受人の権利享受、買戻権・義務などの条件を確認する。"},{"ch":2,"terms":"1-4,9-11","title":"買掛金と支払の流れ","key":"買ったものによって負債の名前が違う。","body":"仕入先から販売用商品を受け取り、翌月代金を払うなら買掛金です。パソコンなどの事務用品購入なら通常未払金、借入利息など継続サービスの経過分なら未払費用です。支払前には注文・納品・請求を照合します。","type":"compare","rows":[["科目","何の未払？","具体例"],["買掛金","通常の仕入","販売商品・原材料"],["未払金","一般の確定債務","設備・備品購入"],["未払費用","継続役務の経過分","未払利息・家賃"]],"rule":"請求書未着でも債務が成立していれば計上を検討。発注・検収・請求の3点照合。","q":"工場機械の購入代金を翌月払う場合は通常何勘定？","answer":"未払金。通常の仕入債務ではない。"},{"ch":2,"terms":"5-8","title":"仕入代金が減る4つの理由","key":"返す、値段を下げる、量で戻る、早く払う。","body":"同じ「代金が減る」でも理由が違えば会計処理も変わります。返品・値引・割戻は仕入代価の調整が基本。早期決済に伴う仕入割引は金融的性質を持ちます。","type":"compare","rows":[["用語","理由","例"],["返品","商品を返す","破損品を返却"],["値引","品質・数量等の問題","傷ありで減額"],["割戻","取引量等","年間購入リベート"],["割引","早期決済","期日前払い"]],"rule":"「たくさん買ったから」は割戻。「早く払ったから」は割引。","q":"一定の購入数量に達したのでリベートを受けた。どの用語？","answer":"仕入割戻。"},{"ch":3,"terms":"1-4,12-13","title":"在庫の数を正しく数える","key":"倉庫にあるかより、誰のものか。","body":"自社倉庫だけでなく、外部倉庫や委託先に預けている自社商品も棚卸対象です。帳簿上の数と実際の数を照合し、期末前後の入出庫が正しい年度に入っているか確かめます。","type":"flow","rows":[["自社倉庫","自社品◎"],["外部倉庫","自社品◎"],["委託販売先","未販売品◎"],["自社倉庫","他社預かり品×"]],"rule":"継続記録法＝入出庫ごとに記録。棚卸計算法＝実棚から払出数量を逆算。","q":"他社の倉庫にある自社商品は棚卸対象？","answer":"自社に帰属するなら対象。"},{"ch":3,"terms":"5-9","title":"在庫の単価を決める","key":"同じ商品でも買った日で原価は違う。","body":"100円で100個、140円で100個買い、100個販売しました。古い分から売ったと仮定する先入先出法なら残りは140円。平均を使うなら120円。数量は同じでも期末在庫と利益が変わります。","type":"compare","rows":[["評価方法","考え方","残り100個の単価例"],["個別法","実際にどれを売ったか","個別原価"],["先入先出法","古い分から販売","140円"],["総平均法","期間全体の平均","120円"],["移動平均法","仕入ごとに平均","この例は120円"],["最終仕入原価法","最後の仕入価格","140円"]],"rule":"総平均は期間単位、移動平均は仕入の都度。会計・税務の適用可否は別。","q":"仕入のたびに平均単価を更新する方法は？","answer":"移動平均法。"},{"ch":3,"terms":"10-11","title":"数量不足と値下がりの損失","key":"なくなった分と価値が落ちた分を分ける。","body":"帳簿100個、実棚95個、原価100円です。まず5個がなくなった損失は500円。残った95個が80円でしか売れないなら20円×95個＝1,900円の評価損です（追加費用なしと仮定）。","type":"waterfall","rows":[["帳簿10,000円","100×100"],["減耗損−500円","5個不足"],["評価損−1,900円","95個×20円"],["期末7,600円","95×80"]],"rule":"減耗損＝数量差。評価損＝価値の低下。","q":"現物の数量は合っているが売価が大きく下がった。何を検討？","answer":"棚卸評価損。収益性低下による切下げを検討。"},{"ch":4,"terms":"1-3,8,12","title":"固定資産の一生と台帳","key":"買ってから捨てるまで、1台ずつ追う。","body":"工場の機械は何年も使用するので、取得価額、所在地、管理部署、耐用年数、移動や廃棄の履歴を記録します。建設中は建設仮勘定、使えるようになったら本勘定へ振り替えます。","type":"flow","rows":[["取得・建設","建設仮勘定"],["使用開始","機械装置へ"],["毎期","償却・現物確認"],["処分","売却・除却、台帳更新"]],"rule":"固定資産台帳は個別資産の履歴。総勘定元帳は勘定別の記録。","q":"機械の管理部署、資産番号、所在地、取得価額を記載する帳簿は？","answer":"固定資産台帳。"},{"ch":4,"terms":"4-7,16","title":"減価償却：買った年だけ費用にしない","key":"長く使うものは使う期間に分けて費用化する。","body":"600万円の設備を5年間使うとします。残存価額ゼロの定額法なら1年120万円ずつ費用化します。定率法は残っている簿価に率を掛けるので通常初期負担が大きくなります。会計と税務の限度額は別です。","type":"bars","rows":[["1年目の簿価","480"],["2年目","360"],["3年目","240"],["4年目","120"],["5年目","0"]],"rule":"定額＝一定額、定率＝一定率、生産高比例＝使用量に比例。供用開始から償却。","q":"600万円、5年、残存ゼロ、定額法で半年使った場合の費用は？","answer":"60万円。年120万円×6/12。"},{"ch":4,"terms":"9,13-15","title":"修理・改良・リース・少額資産","key":"元に戻す費用か、新たな価値を生む支出か。","body":"故障した機械の通常修理は費用。能力を増やし使用期間を延ばす改良は資産計上を検討します。契約上将来撤去する義務やリース利用も資産・負債に関係します。税務には少額資産の特例があります。","type":"compare","rows":[["ケース","原則的考え方"],["通常の修理","修繕費"],["能力増加・耐用期間延長","資本的支出"],["撤去義務","資産除去債務・対応資産"],["少額資産","税務の要件で即時費用等"]],"rule":"税務：10万円未満、20万円未満3年均等、中小企業等特例は2026年4月取得等から40万円未満（要件あり）。","q":"機械の能力を増やした改造は通常何に該当？","answer":"資本的支出。通常の原状回復は修繕費。"},{"ch":4,"terms":"10-11","title":"減損：もう元が取れない資産","key":"帳簿の値段を回収可能な水準に下げる。","body":"帳簿価額100の店舗が将来90しか稼げないと見込まれるとします。日本基準では減損の兆候を確認し、割引前将来CFと簿価で認識判定を行い、必要なら使用価値と売却価額の高い方まで切り下げます。","type":"flow","rows":[["兆候","赤字継続等"],["認識判定","割引前CF90＜簿価100"],["測定","使用価値75／正味売却80"],["計上","回収可能80、損失20"]],"rule":"認識は割引前CF。測定は使用価値（割引後）と正味売却価額の高い方。","q":"使用価値75、正味売却価額80なら回収可能価額は？","answer":"80。高い方を用いる。"},{"ch":5,"terms":"1-4,9","title":"ソフトウェアはいつ資産になる？","key":"支払ったかではなく、将来役立つことが確実か。","body":"社内の入力作業を減らすシステムを自社制作する場合、将来の費用削減や収益獲得が確実と認められる段階の制作費は資産計上の対象です。まだ試験研究の段階なら通常費用です。制作目的によってルールが異なります。","type":"flow","rows":[["企画・研究","原則費用"],["便益確実性","判断・証拠"],["制作","該当直接費を資産化"],["利用開始","利用期間で償却"]],"rule":"自社利用は将来の収益獲得又は費用削減が確実。著作権登録・支払済・予算確定は要件ではない。","q":"著作権登録が終わっただけで自社利用ソフトを資産にできる？","answer":"できない。将来の便益の確実性を判断する。"},{"ch":5,"terms":"5-8","title":"クラウドと買い切りの違い","key":"サービスを借りるか、資産を持つか。","body":"月額で会計システムを利用するだけなら、通常はサービスの利用期間に応じて費用を認識します。一方、独立したソフトを購入・制作し支配するなら資産になる場合があります。導入費も何に対する対価かで判断します。","type":"compare","rows":[["形態","何を利用？","例"],["SaaS","完成したサービス","会計クラウド"],["PaaS","開発・実行環境","アプリ開発基盤"],["IaaS","サーバー等基盤","仮想サーバー"],["買い切り等","独立したソフト資産","自社保有ライセンス"]],"rule":"クラウド導入費は一律資産ではない。契約実態・独立資産の支配・サービス提供時期を確認。","q":"自社が資産を支配しない1年分のSaaS利用料は？","answer":"通常は利用期間に応じて費用。未経過分は前払費用。"}];

window.FASS_LEARN_CLOSING=[{"ch":6,"terms":"1-4,7-8","title":"予算と実績を正しく比較する","key":"金額が減っただけでは、改善とは限らない。","body":"100個売る予定で経費100万円を予算化したのに、80個しか売れなかったとします。実績86万円は当初予算より14万円少なくても、80個に合わせた予算80万円より6万円多い。数量の変化と使い方の良し悪しを分けます。","type":"bars","rows":[["当初予算（100個）","100"],["実際数量に合わせた予算（80個）","80"],["実績（80個）","86"]],"rule":"変動予算は実際操業度で変動費を調整する。見込は予測、予算は目標。","q":"当初予算100、変動予算80、実績86の場合、変動予算比は？","answer":"6万円の不利差異。"},{"ch":6,"terms":"5-6,9","title":"会社の利益はどこで生まれる？","key":"売上が増えるほど固定費を回収しやすくなる。","body":"売上100、売上原価60、販管費25なら営業利益15。支払利息等が5なら経常利益10です。別の管理会計の見方では、売上から変動費を引いた限界利益で固定費を賄います。","type":"waterfall","rows":[["売上100","全売上"],["売上原価−60","商品原価等"],["販管費−25","営業利益15"],["営業外費用−5","経常利益10（他なし）"]],"rule":"損益分岐点売上＝固定費÷限界利益率。固定費900、限界利益率30%なら3,000。","q":"売上100、変動費60、固定費30なら限界利益は？","answer":"40。利益は10。"},{"ch":7,"terms":"1-2,16,26","title":"決算は何を締めるのか","key":"1年間の取引を正しい期間・正しい残高に整える。","body":"日々の記帳を集めた試算表を、補助元帳や銀行明細、棚卸結果などで確かめます。請求書がまだ来ていなくても当期に発生した費用は当期に認識します。調整後に財務諸表を作成します。","type":"flow","rows":[["日々の記帳","証憑から入力"],["試算表","勘定残高集計"],["残高照合","漏れ・重複確認"],["決算整理","未払・償却等"],["財務諸表","BS・PL・CF"]],"rule":"試算表の貸借が一致しても計上漏れはあり得る。カットオフは期末前後の期間帰属。","q":"3月に受けた保守サービスの請求が4月に届いた。費用は何月？","answer":"3月の費用。発生主義・債務成立等を確認する。"},{"ch":7,"terms":"3-7,24","title":"前払・未払・前受・未収を見分ける","key":"お金とサービス、どちらが先かで決まる。","body":"年間保険料を先払いした場合、まだ保険期間が残っている分は将来のサービスを受ける権利です。逆にすでにサービスを受けているのに払っていないなら負債です。自社が提供する側か受ける側かも確認します。","type":"matrix","rows":[["自社の立場","お金が先","サービスが先"],["サービスを受ける側","前払費用（資産）","未払費用（負債）"],["サービスを提供する側","前受収益（負債）","未収収益（資産）"]],"rule":"経過勘定は継続的な役務。商品等の前払いは前払金、使途未確定は仮払金。","q":"期末までに経過した未払い借入利息は？","answer":"未払費用（負債）。"},{"ch":7,"terms":"8,20-21,23,25","title":"将来支払うお金を見積もる","key":"支払がまだでも、今の仕事で生じた負担は今の費用。","body":"従業員が働いた分の賞与を来期払うなら、合理的見積額を当期の賞与引当金にします。退職給付も将来支払う額の現在価値と外部積立資産等の差を考えます。一方、利益準備金は将来の費用を見積もった負債ではありません。","type":"compare","rows":[["項目","何を表す？","区分"],["賞与引当金","当期勤務分の将来賞与","負債"],["退職給付に係る負債","退職給付債務－年金資産等","負債"],["利益準備金","利益剰余金の積立","純資産"]],"rule":"引当金は過去事象・発生可能性が高い・合理的見積り等が要件。退職債務2,000－年金資産1,500＝500（単純例）。","q":"当期勤務分の賞与を来期払う。会計上は何を検討する？","answer":"賞与引当金。税務の損金算入時期とは別。"},{"ch":7,"terms":"9-11,22","title":"売上をいつ、いくら計上する？","key":"契約を結んだ日でも、現金を受け取った日でもない。","body":"機械と保守をセット販売したら、対価を機械と保守の独立販売価格の比率で配分します。機械は支配移転時、保守は一定期間の履行に合わせて売上にするのが典型例です。返品が予想されるなら返金負債等も認識します。","type":"flow","rows":[["契約を特定","相手との約束"],["履行義務を特定","機械・保守"],["取引価格を決定","90万円"],["価格を配分","単独80:20→72:18"],["履行時に認識","機械納入・保守経過"]],"rule":"一時点認識と一定期間認識を区別。無条件の請求権は通常債権、条件付きは契約資産。","q":"単独価格80と20、セット価格90。機械への配分は？","answer":"72。90×80/100。"},{"ch":7,"terms":"12-15","title":"会計上の4種類の変更","key":"「やり方」「見せ方」「予測」「間違い」を区別。","body":"昨日までのルールを変える会計方針の変更、財務諸表の見せ方だけ変える表示方法の変更、新情報で予測を変える見積りの変更、昔から誤っていたものを直す誤謬の訂正です。処理時期が違います。","type":"compare","rows":[["種類","具体例","原則的な処理"],["会計方針","先入先出→総平均","遡及適用"],["表示方法","費用を独立掲記","比較情報組替え"],["見積り","耐用年数の見直し","当期以降に反映"],["誤謬","過年度売上漏れ","修正再表示"]],"rule":"新情報による見積り変更は過去の間違いではない。減価償却方法の変更は特有の扱いに注意。","q":"新たに判明した設備の使用実態で残存耐用年数を見直す。どれ？","answer":"会計上の見積りの変更。"},{"ch":7,"terms":"17-19","title":"キャッシュフロー計算書","key":"利益から現金の増減を説明する。","body":"営業活動は商売での現金、投資活動は設備や投資の売買等、財務活動は借入・資本調達と返済等です。間接法では利益から減価償却や売掛金など、利益と現金のズレを調整します。","type":"compare","rows":[["CF区分","主な入出金","例"],["営業","商品販売や仕入等","回収・支払"],["投資","固定資産等の取得・売却","機械購入"],["財務","資金調達・返済","借入元本返済"]],"rule":"売掛金・在庫増加は間接法で減算、買掛金増加・減価償却は加算。現金同等物は通常取得から満期3か月以内等。","q":"借入元本を返済した場合、どのCF区分？","answer":"財務活動によるキャッシュフロー。"},{"ch":8,"terms":"1-4","title":"連結の対象はどこまで？","key":"会社を別々に見るか、一つのグループとして見るか。","body":"議決権を過半数持つ会社は通常支配しています。ただし過半数を持たなくても、役員構成、同意する株主の議決権、契約等で実質支配していれば子会社になります。重要な影響力があるだけなら関連会社として持分法を検討します。","type":"compare","rows":[["例","経営への関与","会計上の分類"],["議決権70%","支配あり","子会社・連結"],["議決権45%","実質支配あり","子会社・連結"],["議決権50%","実質支配なし","支配力基準で判定"],["議決権25%","重要な影響のみ","関連会社・持分法"]],"rule":"子会社＝支配。関連会社＝重要な影響力。比率だけで機械的に決めない。","q":"45%保有で実質的に経営方針を支配する場合は？","answer":"子会社となる。"},{"ch":8,"terms":"5-6","title":"のれんと非支配株主持分","key":"買収価格と、買収した会社の純資産を分ける。","body":"純資産100の会社の80%を100で取得したとします（時価評価後、他調整なし）。親会社持分80との差額20がのれん。残り20%の純資産20はグループ内でも親会社の持分ではないため、非支配株主持分として表示します。","type":"split","rows":[["子会社純資産100","親会社持分80","非支配持分20"],["親会社の投資100","持分80","のれん20"]],"rule":"非支配株主持分は連結BSの純資産の部。日本基準ののれんは効果期間20年以内で償却。","q":"80%取得した子会社の残り20%は連結BSで負債？","answer":"いいえ。純資産の部の非支配株主持分。"},{"ch":8,"terms":"7-10","title":"グループ内部の売上・利益を消す","key":"自分の右ポケットから左ポケットへ移しても儲からない。","body":"親会社が原価80の商品を子会社へ100で売り、子会社がまだ40%を保有しているとします。グループとしてまだ外部販売していない部分の利益8は未実現なので消去します。内部債権債務も相殺消去します。","type":"flow","rows":[["親会社","原価80"],["子会社へ内部販売","100（利益20）"],["期末残存","40%は外部未販売"],["連結修正","利益20×40%=8消去"]],"rule":"親→子はダウンストリーム、子→親はアップ。後者では非支配株主帰属額も調整する。","q":"原価80、内部売価100、全量が期末在庫なら未実現利益は？","answer":"20。"},{"ch":9,"terms":"1-4,11","title":"会社は誰にどの書類を出す？","key":"法律・取引所のルール・提出目的を区別する。","body":"投資家は決算を速く知りたいので決算短信があり、詳細な法定情報は有価証券報告書で提供されます。会社法では株主に対する計算書類等の作成が求められます。重要な事実は適時開示も必要になります。","type":"compare","rows":[["書類","根拠","主な目的"],["決算短信","取引所規則","速報"],["有価証券報告書","金融商品取引法","法定情報開示"],["計算書類等","会社法","株主等への報告"],["半期報告書","金融商品取引法","中間の法定開示"]],"rule":"有報は通常期末後3か月以内。短信は速やかに開示（45日以内目安）。","q":"取引所ルールに基づく決算速報は？","answer":"決算短信。"},{"ch":9,"terms":"5-10","title":"決算後に起きたこと・注記","key":"決算日にすでに存在した問題か、後から発生した問題か。","body":"3月末時点で相手の経営が悪化しており、4月に倒産した場合は、3月末の債権評価に新たな証拠が得られたとして修正を検討します。一方、4月に初めて起きた重大な火災は、3月末の状況ではないため注記を検討します。","type":"compare","rows":[["区分","決算日時点","処理"],["修正後発事象","原因・状態が存在","財務諸表の修正"],["開示後発事象","決算日後に新規発生","重要なら注記"],["継続企業・偶発債務等","事象ごとの要件","計上・注記を検討"]],"rule":"関連当事者・セグメントは投資判断に役立つ別種の開示。","q":"翌期初めて発生した重要な火災。原則どちら？","answer":"開示後発事象。重要なら注記。"}];

window.FASS_LEARN_TAX=[{"ch":10,"terms":"1-3","title":"会計と税務の利益が違う理由","key":"利益を計算するルールが二つある。","body":"会計は業績を正しく伝えるためのルール、税務は公平に税を計算するルールです。会計上費用になっても、税務では今期の損金にならない場合があります。将来解消する差は一時差異、ずっと解消しない差は永久差異です。","type":"compare","rows":[["差の種類","例","税効果"],["一時差異","将来損金になる賞与引当金等","対象"],["永久差異","罰金など将来も損金不算入","対象外"]],"rule":"税効果会計の目的は利益と税金費用の期間対応。納税額を直接減らす制度ではない。","q":"将来も損金にならない罰金は一時差異？","answer":"永久差異。税効果の対象外。"},{"ch":10,"terms":"4-8","title":"繰延税金資産と負債","key":"税金を「いつ負担するか」のズレを表す。","body":"今期、会計で費用100を計上しても税務で損金にならず、翌期に損金になるとします。今期の税金が30多く、翌期は30少なくなる効果（税率30%）を繰延税金資産として計上します。ただし将来の課税所得等から回収できる範囲に限ります。","type":"timeline","rows":[["今期","会計費用100・税務損金0 → 今期税負担増"],["翌期","税務損金100 → 将来の税負担減"],["決算","DTA30（回収可能性あり、税率30%）"]],"rule":"将来減算＝DTA、将来加算＝DTL。解消時に適用される税率で計算。","q":"将来減算一時差異200万円、全額回収可能、税率30%ならDTAは？","answer":"60万円。"},{"ch":11,"terms":"1-5","title":"消費税がかかる取引、かからない取引","key":"税金ゼロでも、理由は三つある。","body":"国内で事業として対価を得る商品販売等は課税。土地や一定の住宅賃貸・利息等は法律で非課税とされています。給与や対価のない寄附等はそもそも課税対象外。輸出は課税取引に該当しても一定要件で免税となります。","type":"compare","rows":[["区分","例","課税売上割合の基本"],["課税","商品販売・事務所賃料","分子と分母"],["非課税","土地売却・貸付利息","原則分母のみ"],["不課税","給与・対価のない寄附","原則対象外"],["輸出免税","一定の輸出売上","分子と分母"]],"rule":"標準10%、一定の飲食料品・新聞8%。輸出免税と非課税は別。","q":"輸出免税売上は課税売上割合の分子に入る？","answer":"入る。課税取引であり一定要件で免税される。"},{"ch":11,"terms":"6-9","title":"消費税は預かった税から払った税を引く","key":"売上全部の税を納めるのではない。","body":"税抜100万円で仕入れ、税抜150万円で販売すると、10%税率なら仕入先に10万円、顧客から15万円の税を受け取ります。全額控除できるなら納付は5万円です。非課税売上があると控除できる仕入税額が制限される場合があります。","type":"flow","rows":[["仕入","仮払10万円"],["販売","仮受15万円"],["仕入税額控除","−10万円"],["納付","5万円"]],"rule":"課税売上高5億円以下かつ課税売上割合95%以上なら原則全額控除。個別対応＝課税専用＋共通×割合。一括比例＝全仕入×割合。","q":"課税売上高6億円、課税売上割合98%。95%ルールで全額控除できる？","answer":"できない。5億円以下の条件も必要。"},{"ch":11,"terms":"10-12","title":"免税・簡易課税・申告納付","key":"小規模事業者には別の計算方法がある。","body":"基準期間の売上高等によって納税義務の免除を受ける場合があります。課税事業者でも、簡易課税を選択する要件を満たすと、実際の仕入税額ではなく事業区分ごとのみなし仕入率を使います。申告期限と中間納付も管理します。","type":"compare","rows":[["仕組み","基準期間の課税売上高等","考え方"],["免税","原則1,000万円以下","納税義務免除（例外あり）"],["簡易課税","5,000万円以下等","みなし仕入率で計算"],["一般課税","その他・選択等","実際の控除対象仕入税額"]],"rule":"インボイス登録者は原則課税。法人の確定申告は原則期末後2か月。みなし仕入率は業種別。","q":"簡易課税では実際に払った消費税を仕入税額控除に使う？","answer":"原則みなし仕入率で計算する。"},{"ch":12,"terms":"1-5,21","title":"法人税の申告調整と別表","key":"会計利益を税法の利益に変換する。","body":"会計利益100に罰金10が費用として含まれていたら、税務ではその10を損金にしないので加算します。逆に非課税扱いの収益部分や、前期に加算した費用が今期に損金となった部分は減算します。この計算を別表四に記載します。","type":"waterfall","rows":[["会計利益100","出発点"],["損金不算入＋10","税務では費用にしない"],["益金不算入−5","税務では収益にしない"],["所得105","税率等を適用"]],"rule":"別表四＝所得調整、別表一＝税額、別表五（一）＝利益積立金等、五（二）＝租税納付状況。","q":"前期に加算留保した費用が当期に認容される。会計上の当期費用なし。調整は？","answer":"当期の減算。二重に課税しないための調整。"},{"ch":12,"terms":"6-9,20","title":"費用でも損金にならないもの","key":"会計で費用にしたことと税法で認められることは別。","body":"会社が負担した税金には、事業経費として損金にできるものと、利益への課税やペナルティ等で損金にできないものがあります。交際費・寄附金等は金額制限や条件、受取配当金は益金不算入の範囲を確認します。","type":"compare","rows":[["項目","税務上の原則・要注意点"],["固定資産税・法人事業税","原則損金算入（時期も確認）"],["法人税・法人住民税本税","原則損金不算入"],["罰金・ペナルティ性附帯税","原則損金不算入"],["交際費・寄附金","法人区分・限度等あり"],["受取配当金","保有区分等に応じ益金不算入"]],"rule":"一定の社外飲食費は1人1万円以下・記録等で交際費等から除外。","q":"固定資産税・法人住民税本税のうち通常損金になるのは？","answer":"固定資産税。法人住民税本税は原則損金不算入。"},{"ch":12,"terms":"10-12,18-19,22","title":"税務で費用になる時期・条件","key":"見積もっただけで何でも損金になるわけではない。","body":"例えば3月末に従業員賞与を見積計上しても、通知や支払時期等の税法要件を満たさなければ当期の損金にはできません。役員給与にも定期同額給与などの要件があります。貸倒損失や減価償却も税務固有の判断が必要です。","type":"compare","rows":[["費用","税務で確認する事項"],["一般の費用","債務成立・原因事実・金額の合理的算定"],["役員給与","定期同額・事前確定届出・一定の業績連動等"],["使用人賞与","支払年度が原則、通知・1か月以内支払等の例外"],["減価償却","償却限度額・供用日"],["貸倒損失","法的切捨て・全額回収不能等"]],"rule":"会計上の引当金と税務上の損金は別。税務上今期認められなければ原則申告加算。","q":"要件を満たさない役員臨時賞与は原則損金になる？","answer":"ならない。会計費用から申告加算する。"},{"ch":12,"terms":"13-17","title":"税金の申告・納付カレンダー","key":"誰が、いつ、何の税金を払うかを整理する。","body":"会社は決算後に法人税等を申告します。給料や一定の個人報酬からは源泉所得税を差し引き、会社が代わりに納めます。欠損金の繰越控除や2026年度からの防衛特別法人税にも適用条件があります。","type":"timeline","rows":[["毎月","源泉所得税：原則翌月10日納付"],["期中","法人税中間申告：通常6か月後2か月以内（要否あり）"],["期末後","法人税・消費税確定申告：原則2か月以内"],["翌期以降","欠損金等の繰越・税額調整"]],"rule":"防衛特別法人税：2026年4月以後開始年度から、基準法人税額−年500万円に4%。所得に直接4%ではない。","q":"個人税理士に一定の報酬を払う場合、税を差し引き納付する手続は？","answer":"源泉徴収。原則翌月10日までに納付する（特例等あり）。"},{"ch":13,"terms":"1-5","title":"グループ通算：赤字と黒字を合わせる","key":"同じグループでも会社ごとに税を申告する。","body":"親会社が100の所得、100%子会社が40の欠損だとします。一定条件の下で損益を通算できますが、各法人がそれぞれ申告・納税する点が旧連結納税との違いです。対象となるのは原則完全支配関係にある一定の国内法人です。","type":"split","rows":[["グループ内の所得・欠損（単純例）","親：所得100","子：欠損40"],["通算後のイメージ","合計所得60","各社が個別申告"]],"rule":"会計上の連結範囲と通算制度の対象は別。グループ法人税制は通算制度を選ばなくても適用される場合がある。","q":"60%子会社は連結対象だから当然グループ通算の対象？","answer":"違う。通算制度は原則完全支配関係等の要件。"},{"ch":14,"terms":"1-4,8","title":"税務申告を訂正する4つの手続","key":"払い過ぎ、足りない、未申告、当局の訂正。","body":"申告後に税金が少な過ぎたと気づいたら修正申告。逆に払い過ぎなら更正の請求。未申告なら期限後申告。税務署が既申告の金額を訂正するのは更正、未申告の金額を定めるのは決定です。","type":"compare","rows":[["状況","誰が行う？","手続"],["過少申告","納税者","修正申告"],["過大申告","納税者","更正の請求"],["未申告","納税者","期限後申告"],["既申告を訂正","税務署","更正"],["未申告の税額決定","税務署","決定"]],"rule":"更正の請求は原則法定申告期限から5年以内。不服申立てとは別。","q":"税を払い過ぎた納税者が申告期限後に減額を求めるのは？","answer":"更正の請求。"},{"ch":14,"terms":"5-7","title":"附帯税：申告や納付のペナルティ","key":"なぜ追加の税がかかるかで名称が違う。","body":"本来の税額とは別に、申告額が少ない、申告していない、仮装・隠蔽がある、納付が遅れたなどの理由で追加負担が発生します。ペナルティ性のものは通常、法人税の損金になりません。","type":"compare","rows":[["附帯税","原因"],["過少申告加算税","期限内申告したが過少"],["無申告加算税","期限内申告なし"],["重加算税","仮装・隠蔽等"],["延滞税","納付遅れ"],["不納付加算税","源泉所得税等の不納付"],["利子税","一定の期限延長等"]],"rule":"附帯税のうちペナルティ性の税は原則損金不算入。一定の利子税等は例外。","q":"仮装・隠蔽がある場合に通常の加算税に代えて課されるのは？","answer":"重加算税。"},{"ch":15,"terms":"1-5","title":"電子帳簿保存：紙とデータの区別","key":"最初からデータだったか、紙だったか。","body":"会計ソフトで帳簿を作る、紙の領収書をスキャンする、メールでPDF請求書を受け取る。この三つは別の保存区分です。電子取引情報は原則データで保存し、取引日・金額・取引先で検索できる等の要件に対応します。","type":"compare","rows":[["元の資料","保存区分","例"],["電子で自己作成","電子帳簿等保存","会計ソフトの帳簿"],["紙で作成・受領","スキャナ保存","紙領収書"],["電子で授受","電子取引","メールPDF、EDI"]],"rule":"法人税帳簿書類は原則7年（例外あり）、会社法会計帳簿は10年。改ざん防止・見読・検索を確認。","q":"メールで受け取った請求書を紙に印刷しただけでよい？","answer":"原則不可。電子取引データを電子保存する。"},{"ch":16,"terms":"1-4,7","title":"インボイス：仕入税額控除の証拠","key":"何を買い、誰から、どの税率で税を負担したか。","body":"一般課税では、仕入先が発行する適格請求書等と所定の帳簿が原則必要です。請求書に登録番号や税率別の金額・税額等を記載することで正しい控除額を確認します。小売等の簡易インボイスや帳簿のみ保存の例外もあります。","type":"flow","rows":[["仕入先","登録番号の確認"],["請求書","税率・税額・内容等"],["社内帳簿","所定事項を記録"],["両方保存","仕入税額控除の証拠"]],"rule":"適格請求書のみでは原則不足。帳簿＋適格請求書等。公共交通機関等の例外あり。","q":"一般課税・特例なしで仕入税額控除に必要な保存物は？","answer":"所定の帳簿と適格請求書等。"},{"ch":16,"terms":"5-6","title":"インボイス経過措置と小規模特例","key":"移行期は一定割合だけ控除できる。","body":"未登録事業者等からの仕入れでも、経過措置で仕入税額相当額の一定割合を控除できる場合があります。2026年度改正後は段階的に縮小します。2割・3割特例は売上税額から納付額を簡便に算定する別制度です。","type":"timeline","rows":[["2026年9月末まで","80%控除"],["2026年10月〜2028年9月","70%控除"],["2028年10月〜2030年9月","50%控除"],["2030年10月〜2031年9月","30%控除"],["2031年10月以降","原則0%"]],"rule":"対象要件・上限あり。少額特例は一定規模以下・税込1万円未満・2029年9月末まで。3割特例は一定の個人事業者の2027・28年分。","q":"2026年11月の未登録事業者等からの仕入れ、経過措置の控除割合は？","answer":"70%（令和8年度改正後。適用条件を満たす場合）。"}];

</script><script>
window.FASS_LEARN_TREASURY=[{"ch":17,"terms":"1-3,9-10","title":"現金を安全に管理する","key":"会社のお金と帳簿が一致しているか確かめる。","body":"小口現金として5万円を前渡しし、8千円使うと現金は4万2千円。領収書8千円と合わせて5万円になるはずです。使った8千円だけ補給して元の定額に戻す方法を定額資金前渡法と呼びます。","type":"split","rows":[["前渡した5万円","手許現金42,000円","領収書8,000円"],["補給後","現金50,000円","領収書を精算"]],"rule":"現金実査と現金出納帳の差は原因調査。入力・承認・実行の分離。決済用預金は一定要件で全額保護。","q":"使った額だけ補給して小口現金を元の金額に戻す方法は？","answer":"定額資金前渡法（インプレスト）。"},{"ch":17,"terms":"4-8","title":"銀行残高と帳簿残高が違う理由","key":"タイミングの違いと、記帳ミスを分ける。","body":"自社は小切手を交付したときに預金を減らしましたが、相手が銀行に持って行くまで銀行残高は減りません。銀行側で未処理の取引は銀行残高を調整し、会社の誤記・未記帳は会社側で修正します。","type":"waterfall","rows":[["銀行残高1,000","銀行の証明"],["未記帳入金＋50","会社は入金記帳済"],["未取付小切手−100","交付済・銀行未呈示"],["調整後950","正しい会社側残高と照合"]],"rule":"未取付＝交付済・銀行未呈示。未渡＝相手に未交付で会社側の修正を検討。","q":"未取付小切手100は銀行側残高にどう調整？","answer":"100を控除する。"},{"ch":18,"terms":"1-4,9","title":"手形・小切手は何のためにある？","key":"今払うか、将来払うか、誰が払うか。","body":"企業間で商品代金の支払いを後日に約束するために手形が使われます。約束手形は自分が払う約束、為替手形は他人に払うよう委託するもの。小切手は銀行等に支払いを委託し原則呈示払いです。","type":"compare","rows":[["証券","支払の仕組み","支払時期"],["約束手形","振出人が支払を約束","満期"],["為替手形","第三者に支払を委託","満期等"],["小切手","銀行等に支払を委託","原則呈示払い"]],"rule":"手形台帳で額面、期日、振出人、譲渡履歴等を管理。支払手形は満期に決済。","q":"振出人が自分で代金を支払うと約束する証券は？","answer":"約束手形。"},{"ch":18,"terms":"5-8","title":"手形を資金化する・譲渡する","key":"満期まで待てないときの選択肢。","body":"受取手形100万円を満期前に銀行に譲渡し、割引料を引いた額を受け取るのが手形割引です。仕入先などに権利を移すのが裏書譲渡です。ただし手形が不渡りになると裏書人等に遡求されることがあります。","type":"flow","rows":[["自社","受取手形100"],["金融機関","割引し現金化"],["満期","振出人等が決済"],["不渡り","遡求される可能性"]],"rule":"電子記録債権は電子記録により発生・譲渡する債権。手形の電子化と考えると入りやすいが法的仕組みは別。","q":"受取手形を金融機関に渡して満期前に現金化する取引は？","answer":"手形割引。"},{"ch":19,"terms":"1-5,12","title":"有価証券は保有目的で会計処理が変わる","key":"同じ株・債券でも何のために持っているか。","body":"短期の売買益を狙う株式なら期末時価の変動を損益に反映します。満期まで保有する債券は取得価額と額面の金利調整差額を償却原価で配分することがあります。子会社株式は経営支配のための投資です。","type":"compare","rows":[["分類","保有目的","個別決算の基本"],["売買目的","短期売買益","時価・損益"],["満期保有目的債券","満期まで保有","償却原価等"],["子会社・関連会社株式","支配・重要な影響","取得原価"],["その他有価証券","上記以外","原則時価、評価差額は純資産等"]],"rule":"市場価格のない株式等や減損は例外。保有目的と評価差額の計上先をセットで覚える。","q":"売買目的有価証券の時価評価差額は原則どこ？","answer":"当期損益。"},{"ch":19,"terms":"6-8","title":"株価指標：PER・PBR・配当利回り","key":"株価を利益・純資産・配当のどれで見るか。","body":"株価1,800円の会社が1株利益150円、1株純資産1,200円、1株配当60円なら、PER12倍、PBR1.5倍、配当利回り約3.33%です。価格だけでは高い・安いとは言えず、比較する基準が重要です。","type":"compare","rows":[["指標","計算式","例"],["PER","株価÷EPS（1株利益）","1,800÷150＝12倍"],["PBR","株価÷BPS（1株純資産）","1,800÷1,200＝1.5倍"],["配当利回り","配当÷株価","60÷1,800≒3.33%"],["配当性向","配当÷利益","60÷150＝40%"]],"rule":"PERの分母は利益、PBRの分母は純資産。配当利回りの分母は株価。","q":"株価2,400円、EPS120円、BPS1,200円。PERは？","answer":"20倍。株価÷EPS。"},{"ch":19,"terms":"9-11","title":"金利が上がると債券価格が下がる理由","key":"昔の低金利の債券を高い値段では買いたくない。","body":"額面100、毎年2の利息を払う債券を持っているとします。市場で同じリスクの新しい債券が4%で買えるなら、古い2%の債券は価格を下げないと買い手がつきません。発行体の信用が悪化したときも、要求利回りが上がるので価格は下がる方向です。","type":"bond","rows":[["発行時","額面100・年2"],["市場金利上昇","要求利回り4%"],["既発債","価格が下がる"]],"rule":"信用スプレッド＝基準利回りへの信用リスク等の上乗せ。修正デュレーションは価格の金利感応度。","q":"発行体の信用力が低下した場合、他条件一定でスプレッドと価格は？","answer":"スプレッド拡大、価格下落。"},{"ch":20,"terms":"1-3","title":"債務保証：他社の借金を肩代わりする約束","key":"借りたのは子会社でも、親会社に責任が発生する場合がある。","body":"銀行が子会社へ融資するとき、親会社が「子会社が払えなければ私が払う」と約束するのが保証です。普通保証と連帯保証では、先に主債務者へ請求してほしいと言えるかなどが異なります。","type":"guarantee","rows":[["銀行","子会社に融資"],["子会社","主債務者"],["親会社","保証人"]],"rule":"人的保証は人・法人が責任を負い、物上保証は財産を担保提供する。連帯保証に催告・検索の抗弁はない。","q":"主債務者に先に請求してほしいという催告の抗弁が原則ないのは？","answer":"連帯保証。"},{"ch":20,"terms":"4-6","title":"保証契約から代位弁済まで","key":"保証した瞬間と、実際に払う段階は違う。","body":"保証契約時は潜在的債務として残高を管理します。子会社が返せない可能性が高まり合理的な損失見積りができれば保証損失引当金を検討します。親会社が代わりに払えば子会社へ求償できる場合があり、その回収可能性も判断します。","type":"flow","rows":[["保証契約","偶発債務・注記検討"],["信用悪化","損失見積り"],["履行の可能性が高い","保証損失引当金"],["代位弁済","求償権等を検討"]],"rule":"保証金額を最初から自社借入金として全額計上するのではない。","q":"保証先の損失負担が高い可能性で発生し合理的に見積可能なら？","answer":"保証損失引当金の計上を検討。"},{"ch":21,"terms":"1-3,6","title":"貸付金：元金と利息の管理","key":"貸したお金は資産、借りたお金は負債。","body":"子会社へ1,000万円を年2%で1年貸すと、単純化すれば利息20万円を受け取ります。期末までに発生したのに未受領の利息は未収収益等です。返済が遅れた場合は約定利息と遅延損害金を区別します。","type":"flow","rows":[["貸付実行","貸付金1,000万円"],["経過6か月","利息10万円発生"],["満期","元金＋利息回収"],["遅延","回収・遅延損害金検討"]],"rule":"貸付台帳で元金、利率、期日、残高、担保・回収履歴を管理。","q":"通常の利息と、期日に返さないことで発生する金銭は同じ？","answer":"異なる。後者は遅延損害金。"},{"ch":21,"terms":"4-5","title":"担保と保証：返してもらうための備え","key":"人の信用と、物の価値は別。","body":"借り手が返済できない場合に備え、銀行は不動産等に抵当権を設定したり、保証人を求めたりします。担保は財産の価値を、保証は他者の信用を利用する仕組みです。担保順位や価値が回収可能額を左右します。","type":"compare","rows":[["方法","回収の裏付け","代表例"],["抵当権","不動産等","土地・建物"],["質権","目的物等","質入れ"],["譲渡担保","譲渡形式の担保","動産・債権"],["保証","保証人の信用","親会社保証"]],"rule":"担保評価・順位・対抗要件・保証人の支払能力を確認。回収見込を重複計上しない。","q":"親会社が子会社の借入返済を約束するのは物的担保？","answer":"人的保証。"},{"ch":22,"terms":"1-5,21","title":"銀行からの借り方・借入枠","key":"今すぐ借りる方法と、必要な時に借りる枠。","body":"1行と直接交渉する相対融資、複数行で共通契約を結ぶシンジケートローン、限度内で反復借入する当座貸越、一定条件で融資枠を確約するコミットメントラインがあります。目的は資金を必要な時に用意することです。","type":"compare","rows":[["方式","仕組み","重要な違い"],["相対融資","1行と個別契約","条件を個別交渉"],["シンジケート","複数行と共通契約","組成と事務の役割"],["当座貸越","枠内で反復借入","確約の有無は契約次第"],["コミットメントライン","融資枠を確約","所定の実行条件あり"]],"rule":"アレンジャー＝組成・参加行募集、エージェント＝実行後事務。コミットメントフィーと利息は別。","q":"複数行が共通条件で協調融資する方式は？","answer":"シンジケートローン。"},{"ch":22,"terms":"6-9,19-20","title":"金利を分解して理解する","key":"基準金利＋上乗せが借入金利になることが多い。","body":"変動金利の例として、TIBOR1.20%にスプレッド7bpを足すと1.27%。1bpは0.01パーセントポイントです。TONAは翌日物の金利、TONA TSRはTONA参照のスワップ固定金利指標で、同じものではありません。","type":"waterfall","rows":[["基準金利1.20%","市場等の指標"],["スプレッド＋0.07%pt","信用・条件等"],["借入利率1.27%","合計"],["利息","元本×年利×日数÷契約基準"]],"rule":"金利更改日は利率決定日、利払日は支払日。加重平均借入利率は残高で重み付け。","q":"基準金利1.20%、スプレッド15bpの合計は？","answer":"1.35%。15bp＝0.15ポイント。"},{"ch":22,"terms":"10-11,18","title":"借入金はどう返す？","key":"元金と利息の返し方によって資金繰りが変わる。","body":"300万円を3年で返す元金均等なら毎年元金100万円、利息は残高に応じて減ります。元利均等は元金と利息の合計が一定（固定金利等の前提）。満期一括は期間中に利息を払い、満期に元金全額を返す方式です。","type":"compare","rows":[["返済方式","毎回の元金","元利合計"],["元金均等","一定","通常減少"],["元利均等","徐々に増える","一定（固定金利等）"],["満期一括","期中0・満期全額","満期に集中"]],"rule":"借換は新たな資金で既存借入を返済。借入台帳には返済・金利・条項・担保等を記録。","q":"満期まで元金を返さず最終日に全額返す方法は？","answer":"満期一括返済。"},{"ch":22,"terms":"12-17","title":"借入契約の条項：何を守らせる？","key":"銀行は融資後も貸したお金を守りたい。","body":"A銀行とB銀行から借りている会社がA銀行の返済を止めると、B銀行も危険だと考えます。他債務の不履行を自分の契約の不履行事由にするのがクロスデフォルト。特定の銀行にだけ担保を渡さないようにするのがネガティブプレッジ。経営悪化を財務数値で監視するのが財務制限条項です。","type":"cross","rows":[["クロスデフォルト","A銀行で不履行→B銀行でも不履行事由"],["ネガティブプレッジ","他行への担保設定を制限"],["財務制限条項","純資産・財務比率等を維持"],["任意弁済","借入人が自ら期限前返済"]],"rule":"クロスアクセラレーションは他債務の期限前弁済請求等に着目。不履行事由と期限の利益喪失の手順・金額閾値は契約次第。","q":"他の銀行に担保を設定することを制限する条項は？","answer":"ネガティブプレッジ。クロスデフォルトは他債務の不履行との連動。"},{"ch":23,"terms":"1-3,9-10","title":"銀行借入と社債・CPの違い","key":"銀行から借りるか、投資家から直接集めるか。","body":"普通社債は企業が市場の投資家から資金を借りる証券です。CPは短期資金の直接調達。転換社債型新株予約権付社債には一定条件で株式に転換する権利が付きます。株式発行は原則として返済義務がない資本調達です。","type":"compare","rows":[["資金調達","主な調達先","特徴"],["銀行借入","金融機関","間接金融"],["社債","投資家","直接金融・元本償還"],["CP","短期市場","直接金融・通常短期"],["株式","株主","原則返済不要"]],"rule":"元本返済・社債償還は財務CF。発行費と利払い・償還予定を管理する。","q":"企業が短期資金を市場で直接調達する証券は？","answer":"CP（コマーシャルペーパー）。"},{"ch":23,"terms":"4-5,8","title":"社債の額面・発行価額・償還価額","key":"借りた金額と最後に返す金額が違うことがある。","body":"額面100の社債を98で発行すれば、企業は98を受け取り、満期に100を返します。この2の金利調整差額を4年の定額法で配分する例なら毎年0.5ずつ負債簿価を増やし、満期100に近づけます。","type":"bars","rows":[["発行時","98"],["1年後","98.5"],["2年後","99"],["3年後","99.5"],["満期","100"]],"rule":"平価＝額面と同じ。割引＝額面未満。打歩＝額面超。償却原価法は原則利息法、一定の場合定額法。","q":"額面100、発行98。発行方法の名称は？","answer":"割引発行。"},{"ch":23,"terms":"6-7","title":"債券の利率と利回り","key":"額面の何%を払うか、投資額の何%儲かるか。","body":"額面100で年2の利息が付く債券を95で買うと、表面利率は2%、現在利回りは2÷95≒2.11%。満期に100を受け取る利益5も含めて評価するのが最終利回りです。","type":"compare","rows":[["指標","何で割る・何を含める？"],["クーポン利率","年利息÷額面"],["現在利回り","年利息÷購入価額"],["最終利回り","購入価額・利息・償還差損益等を考慮"],["応募者利回り","発行時の購入を前提"]],"rule":"額面と購入価格は別。最終利回りは満期までの収益率。","q":"額面100・利息2・購入価額80なら現在利回りは？","answer":"2.5%（2÷80）。"},{"ch":24,"terms":"1-3","title":"先渡・先物：将来の値段を今日決める","key":"価格が分からない将来を、今日の約束で確定する。","body":"3か月後に燃料が必要な会社が今日のうちに購入価格を決めておけば、価格上昇でも予算を守れます。先渡は相対契約で金額・期日を自由に設計しやすく、先物は取引所の標準化された契約で取引します。どちらも原則売買の義務です。","type":"timeline","rows":[["今日","3か月後の売買価格100を約束"],["3か月後の価格130","買い手は100で買える（差額決済等あり）"],["3か月後の価格80","約束した100で買う義務"]],"rule":"先渡＝相対、先物＝取引所・証拠金・値洗い。オプションは権利であり義務とは異なる。","q":"取引所の標準化された将来売買契約は？","answer":"先物取引。"},{"ch":24,"terms":"4-6","title":"オプション：買う権利と売る権利","key":"都合がよければ使う、悪ければ使わない権利。","body":"今、3か月後に商品を100で買う権利を5で購入します。将来の市場価格が130なら権利を使って100で買えば30の差が得られ、費用5を引くと25。市場価格が80なら権利を放棄し、損失は5にとどまります。売る権利は逆の方向です。","type":"option","rows":[["コール","買う権利"],["プット","売る権利"],["権利行使価格","将来の約束価格100"],["プレミアム","権利代金5"]],"rule":"オプション買い手は行使か放棄を選べる。売り手は行使に応じる義務を負う。","q":"将来100で売れる権利を買う取引は？","answer":"プットオプションの購入。"},{"ch":24,"terms":"7","title":"金利スワップ：変動金利を固定する仕組み","key":"変動金利を受け取って借入の変動支払いを相殺する。","body":"変動借入があり、将来金利が上がるのが不安な企業を考えます。スワップ相手に固定1.5%を払い、同じ参照変動金利を受け取る契約を結ぶと、銀行に払う変動分と受取変動分が相殺され、実質1.5%の固定負担になります（条件一致・スプレッド等除外）。","type":"swap","rows":[["銀行","借入変動金利を支払う"],["企業","変動借入を保有"],["スワップ相手","固定を受取り・変動を支払う"]],"rule":"固定払い・変動受取りで変動借入を固定化。元本は通常交換しない。","q":"変動借入を固定化するスワップの支払・受取方向は？","answer":"固定払い、変動受取り。"},{"ch":24,"terms":"8-10","title":"キャップ・フロア・カラーを図で覚える","key":"金利上昇を止める「上限」と、低下を止める「下限」。","body":"上限1.5%のキャップを買うと、市場金利2.5%のときに差1%を受け取り、変動借入の実質負担は1.5%になります。金利1%なら受取なしで1%負担です。スワップと違って低下メリットを残せますが、通常プレミアムがかかります。","type":"cap","rows":[["変動借入","上限なし"],["スワップ","1.5%固定"],["キャップ","1.5%を超える部分を補償"],["フロア","下限未満の差額を受取"]],"rule":"キャップ買い＝借入の上昇対策、フロア買い＝運用の低下対策等。カラー＝両者を組合せ。","q":"変動金利借入の低下メリットを維持しながら上昇を抑えるのは？","answer":"金利キャップの購入。"},{"ch":24,"terms":"11-13","title":"通貨スワップ・為替スワップとヘッジ会計","key":"リスクを減らす取引と、帳簿上の処理は別。","body":"外貨借入の元利金を別の通貨に交換する通貨スワップと、異なる期日に反対方向の外貨交換を組み合わせる為替スワップがあります。デリバティブは原則時価評価ですが、一定の条件を満たせばヘッジ対象との損益計上時期を対応させられます。","type":"compare","rows":[["手段","何を交換する？"],["金利スワップ","同一通貨の固定・変動金利"],["通貨スワップ","異通貨の元本・利息等"],["為替スワップ","異なる期日の反対方向の外貨売買"],["為替予約","将来1時点の外貨売買等"]],"rule":"ヘッジ会計は指定・文書化・有効性等の要件がある。経済的にヘッジできても自動適用ではない。","q":"同一通貨の固定・変動金利を交換する取引は？","answer":"金利スワップ。"},{"ch":25,"terms":"1-4","title":"円高・円安と為替差損益","key":"ドルの値段が上がると、輸出側と輸入側で逆の影響。","body":"1ドル140円から150円になると、同じ1ドルを手に入れるのに10円多く必要なので円安です。10万ドルを受け取る企業は円換算で100万円増え、10万ドルを支払う企業は100万円負担が増えます。","type":"fx","rows":[["当初","140円/USD"],["円安","150円/USD"],["輸出","売掛金の円換算額増加"],["輸入","買掛金の円換算額増加"]],"rule":"TTS＝銀行が外貨を売る（輸入側が買う）、TTB＝銀行が外貨を買う（輸出側が売る）、TTM＝仲値。","q":"1ドル150円から140円になった。外貨建買掛金には差益？","answer":"通常は為替差益（予約等なし）。"},{"ch":25,"terms":"5-8","title":"為替予約と自然ヘッジ","key":"将来の外貨を買うのか、売るのかを決める。","body":"輸出企業は将来受け取るドルを円にしたいのでドル売り予約。輸入企業は将来支払うドルを用意するのでドル買い予約です。同じ通貨の受取と支払をぶつければ、差額だけをヘッジする方法もあります。","type":"compare","rows":[["立場","将来の外貨","ヘッジ方向"],["輸出","ドルを受取","ドル売り・円買い予約"],["輸入","ドルを支払","ドル買い・円売り予約"],["両方あり","同通貨の受取・支払","マリー・差額ヘッジ"]],"rule":"マリー＝自然にリスクを相殺、ネッティング＝債権債務の差額決済。予約は有利な変動の利益も固定する。","q":"3か月後に米ドル代金を支払う輸入会社の予約は？","answer":"米ドル買い・円売り予約。"},{"ch":25,"terms":"9-11","title":"貿易の決済と書類","key":"離れた国の取引で、代金を安全に回収する。","body":"輸出側は商品を送ったのに代金が来ないリスク、輸入側は代金を払ったのに商品が来ないリスクがあります。信用状では銀行が所定の書類の呈示に対して支払を確約します。D/P・D/Aは書類を渡す条件が異なります。","type":"compare","rows":[["名称","書類・支払の条件"],["L/C（信用状）","所定書類で発行銀行が支払確約"],["D/P","代金支払と引換えに書類交付"],["D/A","手形引受と引換えに書類交付"],["B/L（船荷証券）","貨物受取・運送等を証する書類"]],"rule":"D/Aは支払い前に書類が渡る。銀行は信用状で商品の品質そのものを保証しない。","q":"手形の引受と引換えに船積書類を渡す条件は？","answer":"D/A。"},{"ch":26,"terms":"1-4,21-22","title":"資金繰り表：お金が尽きる日を探す","key":"月末に余裕があっても、月中に不足することがある。","body":"月初の現金が200、5日に350の支払、10日に100の入金、15日に150の支払なら最低残高は−200です。月中の最低残高を見て必要な資金を確保します。実績との差が続くなら予測を改善します。","type":"cash","rows":[["期首","200"],["5日支払","−150"],["10日入金","−50"],["15日支払","−200"]],"rule":"資金繰り表は将来予測、CF計算書は実績。最低必要追加資金は最も低い残高から判定。","q":"月初200、初日350支出、翌日100入金、3日目150支出。最低追加資金は？","answer":"200。残高200→−150→−50→−200。"},{"ch":26,"terms":"5-6","title":"運転資金とCCC：現金が寝ている期間","key":"仕入れから回収までのお金の拘束を短くする。","body":"商品を仕入れて40日在庫し、売って50日後に代金を回収すると90日かかります。ただし仕入代金の支払いが35日後なら、自社の資金が拘束されるのは55日。これがキャッシュ・コンバージョン・サイクル（CCC）です。","type":"ccc","rows":[["在庫期間","40"],["売上債権回収期間","50"],["仕入債務支払猶予","35"]],"rule":"営業運転資金＝売上債権＋在庫−仕入債務。CCC＝債権日数＋在庫日数−債務日数。","q":"在庫40日、債権50日、債務35日。CCCは？","answer":"55日。"},{"ch":26,"terms":"7-9,23","title":"グループの現金を集めるCMS","key":"ある会社の余りを、別の会社の不足に回す。","body":"A子会社には現金100が余り、B子会社には50が不足している場合、グループで資金を管理すると外部借入を減らせます。実際に資金を移すプーリングや残高をゼロにするZBAがあります。送金途上の資金も追跡します。","type":"pool","rows":[["A社","余剰100"],["親会社の集中口座","資金を集約"],["B社","不足50を補填"]],"rule":"CMSは管理の仕組み、プーリングは集約・融通、ZBAは残高ゼロ化。翌朝の支払いに備える。","q":"対象口座の残高を原則ゼロにする仕組みは？","answer":"ZBA（ゼロバランス方式）。"},{"ch":26,"terms":"10-12,19","title":"ファクタリング・ABL・資金運用","key":"債権を売るか、資産を担保に借りるか。","body":"売掛金100万円を資金化する場合、ファクタリングは債権を譲渡する方法、ABLは債権・在庫等を裏付けに借入する方法です。短期の不足は短期枠等、長期需要は長期資金等で賄うのが基本。余剰資金の運用は安全性・流動性・収益性を考えます。","type":"compare","rows":[["手段","仕組み","資金化後"],["ファクタリング","債権譲渡","譲渡の会計要件確認"],["ABL","資産を担保に融資","借入債務が残る"],["コミットメントライン","融資枠確約","実行時借入"],["CP","短期市場調達","満期償還"]],"rule":"資金運用は利回りだけで選ばず、必要な支払期日までに換金できることを確認。","q":"売掛債権を譲渡し回収前に現金化する取引は？","answer":"ファクタリング。"},{"ch":26,"terms":"13-15","title":"財務指標：安全性と収益性","key":"会社が支払えるか、資本をうまく使っているか。","body":"流動比率は短期の支払能力、当座比率は在庫などを除いたより換金性の高い資産で測る短期支払能力。自己資本比率は財務安定性。ROAは資産全体を使った利益効率、ROEは株主資本に対する利益効率を見ます。","type":"compare","rows":[["指標","式（代表的定義）","見るもの"],["流動比率","流動資産÷流動負債","短期支払能力"],["当座比率","当座資産÷流動負債","換金性の高い資産での支払能力"],["自己資本比率","自己資本÷総資産","財務安定性"],["ROA","利益÷総資産","資産効率"],["ROE","利益÷自己資本","株主資本効率"]],"rule":"分子の利益・平均残高等は設問に従う。当座資産には通常棚卸資産を含まない。","q":"流動資産200（うち在庫80）、当座資産120、流動負債100。当座比率は？","answer":"120%（120÷100）。"},{"ch":26,"terms":"16-18,20","title":"借入返済能力を測る財務指標","key":"稼ぐ力に対して借金が重すぎないか。","body":"EBITDAは利払・税・償却前利益等を示し、ネット有利子負債は有利子負債から現預金等を引いたものです。DSCRは実際に元利返済に使える資金（CFADS）と元利返済額を比較します。契約では細かい定義が決まっています。","type":"compare","rows":[["指標","代表的な計算式","例"],["ネット有利子負債/EBITDA","（借入等−現預金）÷EBITDA","(12−2)÷2.5＝4倍"],["インタレストカバレッジ","EBIT等÷利息","3÷0.5＝6倍"],["DSCR","CFADS÷元利返済額","2.4÷2＝1.2倍"]],"rule":"EBITDA≠現金残高・営業CF。財務制限条項では契約の定義・上限下限を確認。","q":"DSCR下限1.25倍、CFADS2.4億・元利返済2億。判定は？","answer":"1.2倍なので抵触（契約に従う）。"}];

const blocklabel=(n,t)=>'<div class="blocklabel"><span class="circle">'+n+'</span>'+t+'</div>';

function chart(id, cfg){
const root=$(id);if(!root)return;
const L=45,R=326,T=14,B=179;const X=x=>L+(x-cfg.xmin)/(cfg.xmax-cfg.xmin)*(R-L),Y=y=>B-(y-cfg.ymin)/(cfg.ymax-cfg.ymin)*(B-T);

for(const y of cfg.yticks){g+='<line x1="'+L+'" x2="'+R+'" y1="'+Y(y)+'" y2="'+Y(y)+'" stroke="'+(y===0?"#7d929e":"#e1e8e8")+'" stroke-width="'+(y===0?1.3:1)+'"/><text x="'+(L-7)+'" y="'+(Y(y)+3)+'" text-anchor="end">'+e(cfg.yfmt?cfg.yfmt(y):y)+'</text>'}

g+='<text x="'+((L+R)/2)+'" y="210" text-anchor="middle">'+e(cfg.xlabel)+'</text></g><path d="M'+L+' '+T+' V'+B+' H'+R+'" fill="none" stroke="#8da1ac"/>';
for(const l of cfg.lines){const pts=l.points||Array.from({length:81},(_,i)=>{const x=cfg.xmin+(cfg.xmax-cfg.xmin)*i/80;return [x,l.fn(x)]});g+='<path d="'+pts.map(([x,y],i)=>(i?"L":"M")+X(x).toFixed(2)+" "+Y(y).toFixed(2)).join(" ")+'" fill="none" stroke="'+l.color+'" stroke-width="'+(l.width||3)+'" '+(l.dash?'stroke-dasharray="5 4"':"")+' stroke-linejoin="round" stroke-linecap="round"/>'}
if(cfg.marker!=null){const x=cfg.marker;g+='<line x1="'+X(x)+'" x2="'+X(x)+'" y1="'+T+'" y2="'+B+'" stroke="#82969b" stroke-dasharray="3 4"/>';for(const l of cfg.lines.filter(l=>l.fn)){g+='<circle cx="'+X(x)+'" cy="'+Y(l.fn(x))+'" r="4.5" fill="'+l.color+'" stroke="white" stroke-width="1.4"/>'}}
if(cfg.points)for(const [x,y,label] of cfg.points){g+='<circle cx="'+X(x)+'" cy="'+Y(y)+'" r="4" fill="#2c7774"/><text x="'+X(x)+'" y="'+(Y(y)+(y>=0?-9:14))+'" text-anchor="middle" font-size="11" fill="#305364" font-weight="700">'+e(label)+'</text>'}
root.innerHTML=g;
}

case "cap":return legend([["#8a9da7","ヘッジなし"],["#ba7b31","固定スワップ"],["#27836f","キャップ"]])+chartSvg("capChart","市場金利と実質負担金利")+ '<div class="lab-controls">'+range("rate","市場金利（年率）",0,4,2.5,.1)+res([["noHedge","なし"],["swapRate","スワップ"],["capRate","キャップ"]],true)+'</div>'+note("固定金利・キャップ上限は1.5%と仮定。プレミアム・スプレッドを除く。フロアは下限未満の受取。");
case "fx":return '<div class="split"><div class="splitrow"><strong>1ドルの円価格が変わる</strong><div class="splitcells"><span>当初 140円</span><span id="fxLabel">決算 150円</span></div></div></div><div class="lab-controls">'+range("fx","決算レート（円／ドル）",120,180,150)+res([["fxExport","輸出：売掛金"],["fxImport","輸入：買掛金"]])+'</div>'+note("10万米ドル、当初1ドル140円、予約なし。他の条件は一定。円安は外貨建債権にプラス、外貨建債務にマイナス。");

function mountLabs(s){
const on=(id,f)=>{const el=$(id);if(el)el.addEventListener("input",f)};
const out=(id,v)=>{if($(id))$(id).textContent=v};
const v=id=>Number($(id).value);
const n=x=>Number(x.toFixed(2)).toString(),signed=x=>x===0?"0":(x>0?"+":"−")+n(Math.abs(x));
if(s.type==="bond"){
const f=y=>{let z=100/(1+y/100)**5;for(let i=1;i<=5;i++)z+=2/(1+y/100)**i;return z};
const calc=()=>{const y=v("yield"),p=f(y);out("yieldO",y.toFixed(1)+"%");out("bondPrice",p.toFixed(2));out("bondDirection",signed(p-100));chart("bondChart",{xmin:0,xmax:6,ymin:80,ymax:112,xticks:[0,2,4,6],yticks:[80,90,100,110],xfmt:x=>x+"%",xlabel:"要求利回り",lines:[{fn:f,color:"#267b70"}],marker:y})};
on("yield",calc);calc()
}
if(s.type==="option"){
let kind="call";const payoff=x=>(kind==="call"?Math.max(0,x-100):Math.max(0,100-x))-5;
const calc=()=>{const x=v("underlying"),intrinsic=kind==="call"?x-100:100-x;out("underlyingO",x);out("optionAction",intrinsic>0?"行使":"放棄");out("optionProfit",signed(payoff(x)));chart("optionChart",{xmin:60,xmax:140,ymin:-10,ymax:40,xticks:[60,80,100,120,140],yticks:[-10,0,10,20,30,40],xlabel:"満期の市場価格",lines:[{fn:payoff,color:"#267b70"}],marker:x});$("callChoice").classList.toggle("active",kind==="call");$("putChoice").classList.toggle("active",kind==="put")};
on("underlying",calc);for(const b of document.querySelectorAll("[data-option]"))b.addEventListener("click",()=>{kind=b.dataset.option;calc()});calc()
}
if(s.type==="cap"){const calc=()=>{const r=v("rate");out("rateO",r.toFixed(1)+"%");out("noHedge",r.toFixed(2)+"%");out("swapRate","1.50%");out("capRate",Math.min(r,1.5).toFixed(2)+"%");chart("capChart",{xmin:0,xmax:4,ymin:0,ymax:4,xticks:[0,1,2,3,4],yticks:[0,1,2,3,4],xfmt:x=>x+"%",yfmt:y=>y+"%",xlabel:"市場金利",lines:[{fn:x=>x,color:"#8a9da7",dash:true},{fn:()=>1.5,color:"#ba7b31"},{fn:x=>Math.min(x,1.5),color:"#27836f",width:4}],marker:r})};on("rate",calc);calc()}
if(s.type==="fx"){const calc=()=>{let x=v("fx"),d=(x-140)*10;out("fxO",x+"円");out("fxLabel","決算 "+x+"円（"+(x===140?"同じ":x>140?"円安":"円高")+"）");out("fxExport",d===0?"差損益0":(d>0?"差益 ":"差損 ")+Math.abs(d)+"万円");out("fxImport",d===0?"差損益0":(d<0?"差益 ":"差損 ")+Math.abs(d)+"万円")};on("fx",calc);calc()}
if(s.type==="cash"){const pts=[[0,200],[1,-150],[2,-50],[3,-200]];chart("cashChart",{xmin:0,xmax:3,ymin:-250,ymax:250,xticks:[0,1,2,3],yticks:[-200,-100,0,100,200],xfmt:x=>["期首","5日","10日","15日"][x],xlabel:"入出金のタイミング",lines:[{points:pts,color:"#267b70"}],points:pts.map(([x,y])=>[x,y,signed(y)])})}
if(s.type==="ccc"){const calc=()=>{let i=v("daysInv"),a=v("daysAr"),p=v("daysAp"),t=i+a,z=t-p;out("daysInvO",i+"日");out("daysArO",a+"日");out("daysApO",p+"日");out("cccInv","在庫 "+i+"日");out("cccAr","回収 "+a+"日");out("cccAp","猶予 "+p+"日");out("cccLock",z>=0?"資金拘束 "+z+"日":"支払猶予が超過 "+(-z)+"日");$("cccBar").style.gridTemplateColumns="minmax(68px,"+Math.max(i,1)+"fr) minmax(68px,"+Math.max(a,1)+"fr)";$("cccPay").style.gridTemplateColumns="minmax(68px,"+Math.max(p,1)+"fr) minmax(95px,"+Math.max(Math.abs(z),1)+"fr)";out("cccDays",z+"日");out("cccTotal",t+"日")};for(const id of ["daysInv","daysAr","daysAp"])on(id,calc);calc()}
}
function reader(id,keep=false){

if(!keep){answerOpen=false;openTerms=!!query.trim();current=id;st.last=id;save()}
const done=st.marks[id], summary=st.mode==="summary";
const termHtml=s.details.length?'<details class="terms" id="details" '+(openTerms?"open":"")+' style="--c:'+color(s)+'"><summary>📖 関連用語を詳しく学ぶ <span class="small">全'+s.details.length+'項目</span></summary>'+s.details.map(t=>'<div class="termbody"><h3>'+e(t.title.replace("★",""))+'</h3><p>'+e(t.body)+'</p><div class="tip"><strong>実務・試験：</strong>'+e(t.tip)+'</div></div>').join("")+'</details>':"";
$("app").innerHTML='<main class="reader" style="--c:'+color(s)+';--accent:'+color(s)+'"><nav class="breadcrumb">'+button("目次","toc","plain")+'<span>›</span><span>'+e(s.domain)+'</span><span>›</span><span>'+e(s.chapter)+'</span></nav><div class="lesson-progress"><span>SHEET '+pad(id)+' / '+S.length+'</span>'+progress(id,S.length)+(done?'<span class="statuspill '+(done==="review"?"review":"")+'">'+(done==="learned"?"理解済":"要復習")+'</span>':"")+'</div><article class="sheet"><div class="sheet-title"><div class="sheet-num">SHEET<b>'+pad(id)+'</b></div><div><div class="cat">'+e(s.domain)+(s.ch?" ／ 第"+s.ch+"章 "+e(s.chapter):" ／ 入門")+'</div><h1>'+e(s.title)+'</h1></div></div><div class="sheet-main"><div class="takeaway"><span class="smallcap">このシートの結論</span>'+e(s.key)+'</div><div class="diagram-side">'+blocklabel("1","図で仕組みをつかむ")+'<div class="diagram">'+diagram(s)+'</div></div>'+(summary?"":'<section class="explain">'+blocklabel("2","なぜ？ 具体例で理解")+'<p>'+e(s.body)+'</p></section>')+'<section class="exam">'+blocklabel(summary?"2":"3","試験で見分けるポイント")+'<p>'+e(s.rule)+'</p></section></div><div class="sheet-bottom"><div class="recall"><h2>思い出してみよう</h2><p class="small">選択肢なしで答えを思い出すと、知識が定着しやすくなります。</p><p class="question">'+e(s.q)+'</p>'+button(answerOpen?"答えを隠す":"答えを見る","answer","outline")+'<div class="answer" id="recallAnswer" '+(answerOpen?"":"hidden")+'><b>答え・理由</b>'+e(s.answer)+'</div><div class="recallbuttons" id="recallbuttons" '+(answerOpen?"":"hidden")+'>'+button("↻ もう一度復習","markReview",done==="review"?"solid":"outline")+button("✓ 理解できた","markLearned",done==="learned"?"solid":"soft")+'</div><p class="studyhint" id="markHint">'+(done==="learned"?"理解済みに登録されています。":done==="review"?"復習リストに登録されています。":"答えを確認して学習状態を記録できます。")+'</p></div></div></article>'+(summary?"":termHtml)+'<div class="nextbar">'+button("‹ 前へ","prev","outline",id===1?"disabled":"")+button("☰ 目次","toc","outline")+button(id===S.length?"目次へ戻る":"次のシート ›","next","solid")+'</div><div class="footnote"><p>画面上部の「要点だけ」で、試験直前に図と識別ポイントだけ確認できます。<br>本シートは独自教材。個別会計・税務の適用は条件や改正時期を確認してください。</p></div></main>';
$("mode").textContent=summary?"解説も読む":"要点だけ";
mountLabs(s);
if($("details"))$("details").addEventListener("toggle",ev=>{openTerms=ev.target.open});
}
function navigate(id,historyUpdate=true){current=id;if(historyUpdate)history.pushState(null,"","#sheet-"+id);reader(id);window.scrollTo({top:0,behavior:"auto"})}
function gotoHome(toc=false){history.pushState(null,"",toc?"#toc":"#home");home();if(toc)requestAnimationFrame(()=> $("toc").scrollIntoView({block:"start",behavior:"smooth"}));else window.scrollTo({top:0,behavior:"auto"})}
function route(){const m=location.hash.match(/^#sheet-(\d+)$/);if(m&&S[Number(m[1])-1])navigate(Number(m[1]),false);else{home();if(location.hash==="#toc")requestAnimationFrame(()=>$("toc").scrollIntoView({block:"start"}))}}
document.addEventListener("click",ev=>{
const b=ev.target.closest("button");if(!b||b.disabled)return;
if(b.dataset.sheet){navigate(Number(b.dataset.sheet));return}
if(b.dataset.domain){domain=b.dataset.domain;query="";if($("search"))$("search").value="";filter="all";if(current)gotoHome(true);else{updateList();$("toc").scrollIntoView({block:"start",behavior:"smooth"})}return}
if(b.dataset.filter){filter=b.dataset.filter;updateList();return}
const a=b.dataset.action;
if(a==="home"){gotoHome();return}
if(a==="toc"){gotoHome(true);return}
if(a==="start"){navigate(Number(b.dataset.next));return}
if(a==="prev"&&current>1){navigate(current-1);return}
if(a==="next"){current<S.length?navigate(current+1):gotoHome(true);return}
if(a==="clearSearch"){query="";if($("search"))$("search").value="";updateList();return}
if(a==="mode"){st.mode=st.mode==="learn"?"summary":"learn";save();if(current)reader(current,true);else{$("mode").textContent=st.mode==="summary"?"解説も読む":"要点だけ";$("mode").setAttribute("aria-pressed",String(st.mode==="summary"))}return}
if(a==="answer"&&current){answerOpen=!answerOpen;$("recallAnswer").hidden=!answerOpen;$("recallbuttons").hidden=!answerOpen;b.textContent=answerOpen?"答えを隠す":"答えを見る";return}
if((a==="markReview"||a==="markLearned")&&current&&answerOpen){st.marks[current]=a==="markLearned"?"learned":"review";save();reader(current,true);return}
if(a==="search"){if(current){gotoHome(true)}requestAnimationFrame(()=>{$("search")?.focus();$("toc")?.scrollIntoView({block:"start"})});return}
if(a==="print"&&current){window.print();return}
});
window.addEventListener("popstate",route);window.addEventListener("hashchange",route);
$("mode").textContent=st.mode==="summary"?"解説も読む":"要点だけ";
route();
})();
</script></body></html>
